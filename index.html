<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>شطرنج — العب ضد الحاسوب</title>
<style>
  :root{
    --bg1:#0b1220;
    --bg2:#070a0f;
    --panel1:rgba(30,41,59,.92);
    --panel2:rgba(13,20,33,.94);
    --line:rgba(148,163,184,.16);
    --line2:rgba(148,163,184,.30);
    --txt:#e8eef7;
    --muted:#93a4bb;
    --accent:#3b82f6;
    --accent2:#2563eb;
    --light:#eed7b0;
    --dark:#b58863;
    --good:#22c55e;
    --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",system-ui,-apple-system,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1200px 800px at 15% -10%, #1e2a3f 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 110%, #172033 0%, transparent 55%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }

  .app{
    display:grid;
    grid-template-columns: 340px minmax(0,1fr);
    gap:20px;
    width:min(1180px,100%);
    align-items:start;
  }
  @media (max-width: 900px){
    .app{grid-template-columns:1fr; gap:14px;}
    .panel{order:2}
    .board-col{order:1}
  }

  .panel{
    background:linear-gradient(180deg,var(--panel1),var(--panel2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(8px);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:46px;height:46px;flex:0 0 46px;
    display:grid;place-items:center;
    font-size:28px;line-height:1;
    border-radius:14px;
    background:linear-gradient(145deg,#1f3a63,#0f1b2e);
    border:1px solid rgba(96,165,250,.35);
    color:#93c5fd;
    box-shadow:0 8px 22px rgba(37,99,235,.28);
  }
  .brand h1{margin:0;font-size:19px;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}

  .section{display:flex;flex-direction:column;gap:8px}
  .label{
    font-size:12px;color:var(--muted);font-weight:600;
    display:flex;justify-content:space-between;align-items:center;
  }
  .label b{color:#cfe0f5;font-weight:700}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .btn{
    appearance:none;
    border:1px solid var(--line2);
    background:rgba(148,163,184,.08);
    color:#e2e8f0;
    padding:10px 12px;
    border-radius:12px;
    font:inherit;font-size:14px;font-weight:600;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:background .16s, border-color .16s, transform .12s, box-shadow .16s;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(148,163,184,.18);border-color:var(--line2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.active{
    background:linear-gradient(180deg,#3b82f6,#2563eb);
    border-color:#60a5fa;color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.38);
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:26px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:99px;
    background:linear-gradient(90deg,#3b82f6 var(--p,33%),rgba(148,163,184,.22) var(--p,33%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:18px;height:18px;margin-top:-6px;border-radius:50%;
    background:#fff;border:3px solid #3b82f6;
    box-shadow:0 3px 10px rgba(0,0,0,.45);
  }
  input[type=range]::-moz-range-track{
    height:6px;border-radius:99px;background:rgba(148,163,184,.22);
  }
  input[type=range]::-moz-range-progress{
    height:6px;border-radius:99px;background:#3b82f6;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;
    border:3px solid #3b82f6;
  }
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:-4px;padding:0 2px}

  .status{
    flex-direction:row;align-items:center;gap:10px;
    background:rgba(148,163,184,.07);
    border:1px solid var(--line);
    border-radius:13px;padding:11px 13px;
  }
  .dot{
    width:10px;height:10px;border-radius:50%;flex:0 0 10px;
    background:#64748b;box-shadow:0 0 0 4px rgba(100,116,139,.16);
    transition:.25s;
  }
  .dot.you{background:var(--good);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
  .dot.think{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.18);animation:pulse 1.1s infinite}
  .dot.end{background:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.18)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .status-text{font-size:13.5px;font-weight:600;line-height:1.35}

  .engine-info{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;color:var(--muted);
    background:rgba(2,6,23,.55);
    border:1px solid var(--line);
    border-radius:11px;padding:9px 11px;
    direction:ltr;text-align:left;
    min-height:36px;
    max-height:60px;overflow:hidden;
    word-break:break-all;
  }

  .moves-wrap{flex:1;min-height:0}
  .moves{
    height:172px;overflow-y:auto;
    background:rgba(2,6,23,.5);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    display:flex;flex-direction:column;gap:1px;
    scrollbar-width:thin;
    scrollbar-color:rgba(148,163,184,.35) transparent;
  }
  .moves::-webkit-scrollbar{width:7px}
  .moves::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:99px}
  .mv-row{
    display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;
    font-size:13px;padding:3px 5px;border-radius:7px;
  }
  .mv-row:nth-child(odd){background:rgba(148,163,184,.05)}
  .mv-row .num{color:var(--muted);font-size:11.5px;text-align:center;line-height:1.6}
  .mv-row .san{font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:center}
  .mv-row .san.last{color:#93c5fd}
  .moves .empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}

  .board-col{
    display:flex;flex-direction:column;gap:10px;align-items:center;
    width:100%;
  }
  .player{
    width:min(100%, 74vh, 700px);
    display:flex;align-items:center;gap:9px;
    padding:8px 12px;
    background:linear-gradient(180deg,rgba(30,41,59,.75),rgba(13,20,33,.75));
    border:1px solid var(--line);
    border-radius:12px;
    font-size:13.5px;font-weight:600;
  }
  .player .pdot{width:11px;height:11px;border-radius:50%;border:2px solid #0b1220;flex:0 0 11px}
  .player .pdot.w{background:#f8fafc}
  .player .pdot.b{background:#1e293b;border-color:#64748b}
  .player .pname{flex:1}
  .player .pmat{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#86efac}

  .board-shell{
    position:relative;
    width:min(100%, 74vh, 700px);
  }
  .board{
    container-type: size;
    direction:ltr;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    width:100%;
    aspect-ratio:1/1;
    border-radius:10px;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    box-shadow:
      0 30px 70px rgba(0,0,0,.6),
      0 0 0 1px rgba(255,255,255,.07),
      0 0 0 8px rgba(15,23,42,.75),
      0 0 0 9px rgba(148,163,184,.14);
  }

  .sq{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    overflow:hidden;
  }
  .sq.light{background:var(--light)}
  .sq.dark{background:var(--dark)}

  .sq .coord{
    position:absolute;font-size:1.55cqw;font-weight:700;
    opacity:.55;pointer-events:none;line-height:1;
  }
  .sq .coord.file{bottom:.6cqw;right:.7cqw}
  .sq .coord.rank{top:.6cqw;left:.7cqw}
  .sq.light .coord{color:#7a5c3e}
  .sq.dark  .coord{color:#f0e0c8}

  .piece{
    font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans","Arial Unicode MS",sans-serif;
    font-size:9.4cqw;
    line-height:1;
    pointer-events:none;
    position:relative;
    z-index:2;
    transition:transform .08s;
  }
  .piece.w{
    color:#ffffff;
    -webkit-text-stroke:2.2px #23282e;
    paint-order:stroke fill;
    text-shadow:0 2px 3px rgba(0,0,0,.35);
  }
  .piece.b{
    color:#242a31;
    -webkit-text-stroke:1.6px #0b0e12;
    paint-order:stroke fill;
    text-shadow:0 2px 3px rgba(0,0,0,.35);
  }

  .sq.last::before{
    content:"";position:absolute;inset:0;
    background:rgba(255,214,64,.42);
    pointer-events:none;z-index:1;
  }
  .sq.sel::before{
    content:"";position:absolute;inset:0;
    background:rgba(59,130,246,.5);
    pointer-events:none;z-index:1;
  }
  .sq.hover::after{
    content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.75);
    pointer-events:none;z-index:3;
  }
  .sq.check::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%, rgba(239,68,68,.95) 0%, rgba(239,68,68,.55) 42%, rgba(239,68,68,0) 72%);
    pointer-events:none;z-index:1;
  }
  .hint{
    position:absolute;inset:0;display:grid;place-items:center;
    pointer-events:none;z-index:3;
  }
  .hint i{
    display:block;width:30%;height:30%;border-radius:50%;
    background:rgba(20,20,20,.28);
    box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .sq.capture .hint i{
    width:96%;height:96%;background:transparent;
    border:0.85cqw solid rgba(20,20,20,.26);
    border-radius:50%;
    box-shadow:none;
  }

  .drag-ghost{
    position:fixed;z-index:9999;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%) scale(1.1);
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));
  }

  .thinking{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:99px;
    background:rgba(2,6,23,.82);
    border:1px solid rgba(96,165,250,.45);
    color:#bfdbfe;font-size:12.5px;font-weight:700;
    backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    z-index:50;
  }
  .spinner{
    width:13px;height:13px;border-radius:50%;
    border:2px solid rgba(191,219,254,.28);
    border-top-color:#93c5fd;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .overlay{
    position:fixed;inset:0;z-index:10000;
    display:grid;place-items:center;
    background:rgba(2,6,23,.72);
    backdrop-filter:blur(6px);
    padding:18px;
  }
  .overlay.hidden,.hidden{display:none !important}

  .card{
    background:linear-gradient(180deg,rgba(30,41,59,.98),rgba(13,20,33,.98));
    border:1px solid var(--line2);
    border-radius:20px;
    padding:22px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    text-align:center;
    max-width:min(92vw,460px);
  }
  .card h2{margin:0 0 6px;font-size:18px}
  .card p{margin:0;color:var(--muted);font-size:13px}

  .loader{
    width:42px;height:42px;margin:0 auto 14px;
    border-radius:50%;
    border:3px solid rgba(148,163,184,.22);
    border-top-color:#60a5fa;
    animation:spin .85s linear infinite;
  }

  .promo-options{display:flex;gap:10px;justify-content:center;margin-top:16px}
  .promo-btn{
    width:64px;height:64px;border-radius:14px;
    display:grid;place-items:center;
    font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif;
    font-size:38px;line-height:1;
    cursor:pointer;
    border:1px solid var(--line2);
    background:rgba(148,163,184,.09);
    transition:.15s;
    padding:0;
  }
  .promo-btn:hover{background:rgba(59,130,246,.25);border-color:#60a5fa;transform:translateY(-2px)}
  .promo-btn.w{color:#fff;-webkit-text-stroke:2px #23282e;paint-order:stroke fill}
  .promo-btn.b{color:#242a31;-webkit-text-stroke:1.6px #0b0e12;paint-order:stroke fill}
</style>
</head>
<body>

<div class="app">

  <aside class="panel">
    <div class="brand">
      <div class="logo">♞</div>
      <div>
        <h1>شطرنج</h1>
        <p>العب ضد محرك الحاسوب (WebAssembly)</p>
      </div>
    </div>

    <div class="section">
      <div class="label">اللعب بـ</div>
      <div class="seg">
        <button id="playWhite" class="btn active">أبيض ♔</button>
        <button id="playBlack" class="btn">أسود ♚</button>
      </div>
    </div>

    <div class="section">
      <div class="label">قوة المحرك — العمق <b id="depthVal">3</b></div>
      <input id="depth" type="range" min="1" max="9" step="1" value="3" />
      <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
    </div>

    <div class="section">
      <div class="row">
        <button id="flip" class="btn">⇅ قلب الطاولة</button>
        <button id="restart" class="btn">↺ استعادة</button>
      </div>
    </div>

    <div class="section status">
      <div id="statusDot" class="dot"></div>
      <div id="status" class="status-text">جارٍ تحميل المحرك…</div>
    </div>

    <div class="section">
      <div class="engine-info" id="engineInfo">engine: loading…</div>
    </div>

    <div class="section moves-wrap">
      <div class="label">نقلات المباراة</div>
      <div id="moves" class="moves"><div class="empty">لا توجد نقلات بعد</div></div>
    </div>
  </aside>

  <section class="board-col">
    <div class="player top" id="playerTop">
      <span class="pdot b" id="dotTop"></span>
      <span class="pname" id="nameTop">الحاسوب</span>
      <span class="pmat" id="matTop"></span>
    </div>

    <div class="board-shell">
      <div id="board" class="board"></div>
      <div id="thinking" class="thinking hidden"><span class="spinner"></span> المحرك يفكّر…</div>
    </div>

    <div class="player bottom" id="playerBot">
      <span class="pdot w" id="dotBot"></span>
      <span class="pname" id="nameBot">أنت</span>
      <span class="pmat" id="matBot"></span>
    </div>
  </section>
</div>

<div id="promo" class="overlay hidden">
  <div class="card">
    <h2>ترقية البيدق</h2>
    <p>اختر القطعة التي تريد الترقية إليها</p>
    <div class="promo-options" id="promoOptions"></div>
  </div>
</div>

<div id="loading" class="overlay">
  <div class="card">
    <div class="loader"></div>
    <h2>جارٍ تحميل محرك الشطرنج…</h2>
    <p>chess.wasm</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
(function () {
  "use strict";

  /* ============================================================
   *  1) ربط WASM API (بدل UCI/stdin)
   * ============================================================ */

  var engineReady  = false;
  var engineInfoLn = "";
  var lastScore    = 0;
  var lastDepth    = 0;
  var lastNodes    = 0;
  var lastTime     = 0;

  window.Module = {
    locateFile: function (path) { return path; },
    print:    function () {},
    printErr: function () {},
    onRuntimeInitialized: function () {
      engineReady = true;

      // تحقق من وجود الدوال الأساسية
      var missing = [];
      ["_engine_init", "_engine_set_fen", "_engine_search",
       "_engine_move_to_uci"].forEach(function (fn) {
        if (typeof Module[fn] !== "function") missing.push(fn);
      });

      if (missing.length) {
        console.error("WASM API ناقص:", missing.join(", "));
        var el = document.getElementById("loading");
        if (el) {
          el.querySelector("h2").textContent = "نسخة chess.js قديمة";
          el.querySelector("p").textContent =
            "الدوال الناقصة: " + missing.join(", ") + " — أعد البناء بأمر emcc الصحيح.";
        }
        return;
      }

      try { Module._engine_init(); }
      catch (e) { console.error("engine_init:", e); }

      var loadEl = document.getElementById("loading");
      if (loadEl) loadEl.classList.add("hidden");
      newGame();
    }
  };

  function stringToHeap(str) {
    var len = (Module.lengthBytesUTF8 ? Module.lengthBytesUTF8(str) : str.length) + 1;
    var ptr = Module._malloc(len);
    if (Module.stringToUTF8) {
      Module.stringToUTF8(str, ptr, len);
    } else {
      var bytes = new TextEncoder().encode(str + "\0");
      Module.HEAPU8.set(bytes, ptr);
    }
    return ptr;
  }

  function intToUci(m) {
    if (!m || typeof Module._engine_move_to_uci !== "function") return null;
    var ptr = Module._engine_move_to_uci(m);
    if (!ptr) return null;
    return Module.UTF8ToString(ptr);
  }

  /**
   * يشغّل المحرك على الوضعية الحالية ويعيد النقلة بصيغة UCI.
   */
  function runEngine() {
    if (!engineReady) return null;
    if (typeof Module._engine_search !== "function") return null;

    // 1) ادفع الوضعية الحالية
    var fen = game.fen();
    var fenPtr = stringToHeap(fen);
    Module._engine_set_fen(fenPtr);
    Module._free(fenPtr);

    // 2) ابحث
    var t0 = performance.now();
    var move = Module._engine_search(depth, 3000);
    lastTime = Math.round(performance.now() - t0);

    lastScore = (typeof Module._engine_get_score === "function")
                  ? Module._engine_get_score() : 0;
    lastDepth = (typeof Module._engine_get_depth === "function")
                  ? Module._engine_get_depth() : depth;
    lastNodes = (typeof Module._engine_get_nodes === "function")
                  ? Module._engine_get_nodes() : 0;

    // 3) حدّث سطر المعلومات
    engineInfoLn = "info depth " + lastDepth +
                   " score cp " + lastScore +
                   " nodes " + Math.round(lastNodes) +
                   " time " + lastTime + "ms";

    return intToUci(move);
  }

  /* ============================================================
   *  2) حالة اللعبة
   * ============================================================ */

  var GLYPH = { k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" };
  var FILES = ["a","b","c","d","e","f","g","h"];
  var VALUES = { p:1, n:3, b:3, r:5, q:9, k:0 };

  var game        = new Chess();
  var humanColor  = "w";
  var orientation = "w";
  var depth       = 3;

  var selected     = null;
  var legalTargets = new Map();
  var lastMove     = null;
  var thinking     = false;
  var isOver       = false;
  var drag         = null;

  /* ============================================================
   *  3) عناصر DOM
   * ============================================================ */

  var boardEl   = document.getElementById("board");
  var statusEl  = document.getElementById("status");
  var statusDot = document.getElementById("statusDot");
  var movesEl   = document.getElementById("moves");
  var thinkEl   = document.getElementById("thinking");
  var infoEl    = document.getElementById("engineInfo");
  var depthEl   = document.getElementById("depth");
  var depthVal  = document.getElementById("depthVal");

  /* ============================================================
   *  4) الرسم
   * ============================================================ */

  function render() {
    var bd = game.board();
    var order = [];
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) order.push([r, f]);
    if (orientation === "b") order.reverse();

    var checkSq = null;
    if (game.in_check && game.in_check()) {
      var turn = game.turn();
      for (var r2 = 0; r2 < 8; r2++) {
        for (var f2 = 0; f2 < 8; f2++) {
          var c = bd[r2][f2];
          if (c && c.type === "k" && c.color === turn) {
            checkSq = FILES[f2] + (8 - r2);
          }
        }
      }
    }

    var frag = document.createDocumentFragment();

    order.forEach(function (rf, i) {
      var r = rf[0], f = rf[1];
      var square = FILES[f] + (8 - r);
      var cell   = bd[r][f];
      var vr = Math.floor(i / 8), vc = i % 8;

      var div = document.createElement("div");
      div.className = "sq " + (((r + f) % 2 === 0) ? "light" : "dark");
      div.dataset.square = square;

      if (lastMove && (square === lastMove.from || square === lastMove.to)) div.classList.add("last");
      if (selected === square) div.classList.add("sel");
      if (checkSq === square) div.classList.add("check");

      if (legalTargets.has(square)) {
        if (cell) div.classList.add("capture");
        var hint = document.createElement("span");
        hint.className = "hint";
        hint.appendChild(document.createElement("i"));
        div.appendChild(hint);
      }

      if (cell) {
        var p = document.createElement("span");
        p.className = "piece " + cell.color;
        p.textContent = GLYPH[cell.type];
        div.appendChild(p);
      }

      if (vr === 7) {
        var cf = document.createElement("span");
        cf.className = "coord file";
        cf.textContent = square[0];
        div.appendChild(cf);
      }
      if (vc === 0) {
        var cr = document.createElement("span");
        cr.className = "coord rank";
        cr.textContent = square[1];
        div.appendChild(cr);
      }

      frag.appendChild(div);
    });

    boardEl.innerHTML = "";
    boardEl.appendChild(frag);
  }

  /* ============================================================
   *  5) واجهة المستخدم
   * ============================================================ */

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusDot.className = "dot" + (kind ? " " + kind : "");
  }

  function updateUI() {
    if (!engineReady) {
      setStatus("جارٍ تحميل المحرك…", "think");
    } else if (isOver) {
      /* النص مُحدَّد مسبقًا */
    } else if (thinking) {
      setStatus("المحرك يفكّر… (العمق " + depth + ")", "think");
    } else if (game.turn() === humanColor) {
      setStatus("دورك — العب الآن", "you");
    } else {
      setStatus("دور المحرك…", "think");
    }

    // معلومات المحرك
    if (engineInfoLn) {
      infoEl.textContent = engineInfoLn;
    } else if (engineReady) {
      infoEl.textContent = "engine: ready (depth=" + depth + ")";
    } else {
      infoEl.textContent = "engine: loading…";
    }

    var topColor = orientation === "w" ? "b" : "w";
    var botColor = orientation === "w" ? "w" : "b";

    var nameTop = document.getElementById("nameTop");
    var nameBot = document.getElementById("nameBot");
    var dotTop  = document.getElementById("dotTop");
    var dotBot  = document.getElementById("dotBot");

    dotTop.className = "pdot " + topColor;
    dotBot.className = "pdot " + botColor;
    nameTop.textContent = (topColor === humanColor ? "أنت" : "الحاسوب") + (topColor === "w" ? " (أبيض)" : " (أسود)");
    nameBot.textContent = (botColor === humanColor ? "أنت" : "الحاسوب") + (botColor === "w" ? " (أبيض)" : " (أسود)");

    var mat = { w: 0, b: 0 };
    var board = game.board();
    for (var r = 0; r < 8; r++) {
      for (var f = 0; f < 8; f++) {
        var c = board[r][f];
        if (c) mat[c.color] += VALUES[c.type];
      }
    }
    var diff = mat.w - mat.b;
    document.getElementById("matTop").textContent = diffFor(topColor, diff);
    document.getElementById("matBot").textContent = diffFor(botColor, diff);

    renderMoves();
  }

  function diffFor(color, diff) {
    var v = color === "w" ? diff : -diff;
    return v > 0 ? "+" + v : "";
  }

  function renderMoves() {
    var hist = game.history({ verbose: true });
    if (!hist.length) {
      movesEl.innerHTML = '<div class="empty">لا توجد نقلات بعد</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < hist.length; i += 2) {
      var n = i / 2 + 1;
      var w = hist[i] ? hist[i].san : "";
      var b = hist[i + 1] ? hist[i + 1].san : "";
      var isLastW = (i === hist.length - 1);
      var isLastB = (i + 1 === hist.length - 1);
      html += '<div class="mv-row">' +
                '<span class="num">' + n + '.</span>' +
                '<span class="san' + (isLastW ? " last" : "") + '">' + w + '</span>' +
                '<span class="san' + (isLastB ? " last" : "") + '">' + b + '</span>' +
              '</div>';
    }
    movesEl.innerHTML = html;
    movesEl.scrollTop = movesEl.scrollHeight;
  }

  /* ============================================================
   *  6) التحديد والنقل
   * ============================================================ */

  function selectSquare(sq) {
    selected = sq;
    legalTargets = new Map();
    var ms = game.moves({ square: sq, verbose: true }) || [];
    for (var i = 0; i < ms.length; i++) legalTargets.set(ms[i].to, ms[i]);
    render();
  }

  function clearSelection() {
    selected = null;
    legalTargets = new Map();
  }

  function makeHumanMove(from, to) {
    var piece = game.get(from);
    var isPromo = piece && piece.type === "p" && (to[1] === "8" || to[1] === "1");

    if (isPromo) { askPromotion(from, to); return; }

    var mv = null;
    try { mv = game.move({ from: from, to: to }); } catch (e) { mv = null; }
    if (!mv) return;

    clearSelection();
    lastMove = { from: from, to: to };
    render();
    updateUI();
    afterHumanMove();
  }

  function afterHumanMove() {
    if (checkGameEnd()) return;
    if (game.turn() !== humanColor) scheduleEngineMove();
  }

  /* ============================================================
   *  7) ترقية البيدق
   * ============================================================ */

  function askPromotion(from, to) {
    var overlay = document.getElementById("promo");
    var opts = document.getElementById("promoOptions");
    opts.innerHTML = "";

    ["q", "r", "b", "n"].forEach(function (t) {
      var b = document.createElement("button");
      b.className = "promo-btn " + humanColor;
      b.textContent = GLYPH[t];
      b.title = t;
      b.addEventListener("click", function () {
        overlay.classList.add("hidden");
        var mv = null;
        try { mv = game.move({ from: from, to: to, promotion: t }); } catch (e) { mv = null; }
        if (mv) {
          clearSelection();
          lastMove = { from: from, to: to };
          render();
          updateUI();
          afterHumanMove();
        }
      });
      opts.appendChild(b);
    });

    overlay.classList.remove("hidden");
  }

  /* ============================================================
   *  8) التفاعل
   * ============================================================ */

  boardEl.addEventListener("pointerdown", function (e) {
    if (!engineReady || thinking || isOver) return;
    if (game.turn() !== humanColor) return;

    var sqEl = e.target.closest ? e.target.closest(".sq") : null;
    if (!sqEl) return;
    var square = sqEl.dataset.square;

    if (selected && legalTargets.has(square)) {
      makeHumanMove(selected, square);
      return;
    }

    var piece = game.get(square);

    if (piece && piece.color === humanColor) {
      if (selected === square) { clearSelection(); render(); updateUI(); return; }
      selectSquare(square);
      startDrag(square, e);
      e.preventDefault();
    } else {
      if (selected) { clearSelection(); render(); }
    }
  });

  function startDrag(square, e) {
    var sqEl = boardEl.querySelector('.sq[data-square="' + square + '"]');
    if (!sqEl) return;
    var pieceEl = sqEl.querySelector(".piece");
    if (!pieceEl) return;

    var rect = pieceEl.getBoundingClientRect();
    var cs = getComputedStyle(pieceEl);

    var ghost = pieceEl.cloneNode(true);
    ghost.classList.add("drag-ghost");
    ghost.style.fontSize = cs.fontSize;
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    document.body.appendChild(ghost);

    pieceEl.style.visibility = "hidden";

    drag = { from: square, ghost: ghost, pieceEl: pieceEl, moved: false };
    moveGhost(e.clientX, e.clientY);
  }

  function moveGhost(x, y) {
    if (!drag) return;
    drag.ghost.style.left = x + "px";
    drag.ghost.style.top = y + "px";
  }

  function endDrag() {
    if (!drag) return;
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if (drag.pieceEl) drag.pieceEl.style.visibility = "";
    drag = null;
    var hov = boardEl.querySelectorAll(".sq.hover");
    for (var i = 0; i < hov.length; i++) hov[i].classList.remove("hover");
  }

  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    drag.moved = true;
    moveGhost(e.clientX, e.clientY);

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var sqEl = el && el.closest ? el.closest(".sq") : null;
    var prev = boardEl.querySelector(".sq.hover");
    if (prev) prev.classList.remove("hover");
    if (sqEl && sqEl.dataset.square !== drag.from) sqEl.classList.add("hover");
  }, { passive: true });

  document.addEventListener("pointerup", function (e) {
    if (!drag) return;
    var from = drag.from;

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var sqEl = el && el.closest ? el.closest(".sq") : null;
    var target = sqEl ? sqEl.dataset.square : null;

    endDrag();

    if (target && target !== from && legalTargets.has(target)) {
      makeHumanMove(from, target);
    } else {
      render();
    }
  });

  document.addEventListener("pointercancel", function () { endDrag(); render(); });

  /* ============================================================
   *  9) محرك الحاسوب (WASM API)
   * ============================================================ */

  function scheduleEngineMove() {
    thinking = true;
    thinkEl.classList.remove("hidden");
    updateUI();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setTimeout(doEngineMove, 20);
      });
    });
  }

  function doEngineMove() {
    if (!engineReady) {
      thinking = false;
      thinkEl.classList.add("hidden");
      updateUI();
      return;
    }

    var uci = runEngine();
    thinking = false;
    thinkEl.classList.add("hidden");

    if (!uci || uci.length < 4) {
      console.warn("[engine] no move returned", engineInfoLn);
      updateUI();
      checkGameEnd();
      return;
    }

    var from  = uci.slice(0, 2);
    var to    = uci.slice(2, 4);
    var promo = uci.length > 4 ? uci[4] : null;

    var obj = { from: from, to: to };
    if (promo) obj.promotion = promo;

    var mv = null;
    try { mv = game.move(obj); } catch (e) { mv = null; }

    if (mv) lastMove = { from: from, to: to };

    render();
    updateUI();
    checkGameEnd();
  }

  /* ============================================================
   * 10) نهاية اللعبة
   * ============================================================ */

  function checkGameEnd() {
    if (game.in_checkmate()) {
      isOver = true;
      var winner = game.turn() === "w" ? "b" : "w";
      setStatus(winner === humanColor ? "🏆 كش مات — لقد فزت!" : "💀 كش مات — فاز الحاسوب", "end");
      updateUI(); render(); return true;
    }
    if (game.in_stalemate()) {
      isOver = true; setStatus("🤝 تعادل — طريق مسدود (Stalemate)", "end"); updateUI(); return true;
    }
    if (game.in_threefold_repetition && game.in_threefold_repetition()) {
      isOver = true; setStatus("🤝 تعادل — تكرار ثلاثي", "end"); updateUI(); return true;
    }
    if (game.insufficient_material()) {
      isOver = true; setStatus("🤝 تعادل — مواد غير كافية", "end"); updateUI(); return true;
    }
    if (game.in_draw()) {
      isOver = true; setStatus("🤝 تعادل", "end"); updateUI(); return true;
    }
    return false;
  }

  /* ============================================================
   * 11) الأزرار
   * ============================================================ */

  function newGame() {
    game = new Chess();
    clearSelection();
    lastMove = null;
    isOver = false;
    thinking = false;
    engineInfoLn = "";
    lastScore = lastDepth = lastNodes = lastTime = 0;
    endDrag();
    thinkEl.classList.add("hidden");
    render();
    updateUI();

    if (humanColor === "b" && engineReady) scheduleEngineMove();
  }

  document.getElementById("playWhite").addEventListener("click", function () {
    humanColor = "w";
    orientation = "w";
    this.classList.add("active");
    document.getElementById("playBlack").classList.remove("active");
    newGame();
  });

  document.getElementById("playBlack").addEventListener("click", function () {
    humanColor = "b";
    orientation = "b";
    this.classList.add("active");
    document.getElementById("playWhite").classList.remove("active");
    newGame();
  });

  document.getElementById("flip").addEventListener("click", function () {
    orientation = orientation === "w" ? "b" : "w";
    render();
    updateUI();
  });

  document.getElementById("restart").addEventListener("click", function () {
    newGame();
  });

  depthEl.addEventListener("input", function () {
    depth = parseInt(this.value, 10);
    depthVal.textContent = depth;
    var pct = ((depth - 1) / 8) * 100;
    this.style.setProperty("--p", pct + "%");
  });
  depthEl.dispatchEvent(new Event("input"));

  /* ============================================================
   * 12) بدء
   * ============================================================ */

  render();
  updateUI();

  setTimeout(function () {
    if (!engineReady) {
      var el = document.getElementById("loading");
      if (el && !el.classList.contains("hidden")) {
        el.querySelector("h2").textContent = "تعذّر تحميل المحرك";
        el.querySelector("p").textContent =
          "تأكد من وجود chess.wasm بجانب الملف، وشغّل الصفحة عبر خادم HTTP (ليس file://).";
      }
    }
  }, 8000);

})();
</script>
