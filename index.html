<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محرك شطرنج + Polyglot Book</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--light:#f0d9b5;--dark:#b58863;--panel:#1e212c;--panel2:#262a38}
  body{font-family:'Segoe UI',Tahoma,sans-serif;
    background:radial-gradient(circle at 50% -10%,#2c3040,#0e0f15 65%);
    color:#e9eaf0;min-height:100vh;padding:18px}
  .app{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1200px;margin:0 auto}
  .board-outer{position:relative;padding:26px;border-radius:18px;
    background:linear-gradient(145deg,#3b4055,#20232f);
    box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
  #board{position:relative;width:min(74vh,68vw,600px);aspect-ratio:1;border-radius:6px;overflow:hidden;
    direction:ltr;touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.55);
    user-select:none;-webkit-user-select:none}
  .sq{position:absolute;top:0;left:0;width:12.5%;height:12.5%}
  .sq.light{background:var(--light)}.sq.dark{background:var(--dark)}
  .sq.last::before{content:'';position:absolute;inset:0;background:rgba(255,236,80,.36)}
  .sq.check::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle,rgba(255,45,45,.95),rgba(255,45,45,0) 72%)}
  .sq.sel::after{content:'';position:absolute;inset:0;
    background:rgba(255,196,0,.48);box-shadow:inset 0 0 0 4px rgba(255,170,0,.95)}
  .sq.tgt::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;
    transform:translate(-50%,-50%);border-radius:50%;background:rgba(15,20,15,.34)}
  .sq.tgt.cap::after{content:'';position:absolute;inset:7%;width:auto;height:auto;left:7%;top:7%;
    transform:none;border-radius:50%;background:transparent;border:6px solid rgba(15,20,15,.32)}
  .pieces{position:absolute;inset:0;pointer-events:none}
  .piece{position:absolute;top:0;left:0;width:12.5%;height:12.5%;
    display:flex;align-items:center;justify-content:center;
    font-size:min(9.2vh,8.4vw,74px);line-height:1;will-change:transform;
    font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',sans-serif}
  .piece.w{color:#fff;text-shadow:0 0 1px #222,1px 1px 0 #2a2a2a,-1px 1px 0 #2a2a2a,1px -1px 0 #2a2a2a,-1px -1px 0 #2a2a2a,0 2px 4px rgba(0,0,0,.55)}
  .piece.b{color:#1b1b1e;text-shadow:0 0 1px #000,1px 1px 0 #d6d6d6,-1px 1px 0 #d6d6d6,1px -1px 0 #d6d6d6,-1px -1px 0 #d6d6d6,0 2px 4px rgba(0,0,0,.55)}
  .panel{width:340px;background:linear-gradient(180deg,var(--panel),#171a24);border-radius:18px;padding:18px;
    border:1px solid rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:12px}
  .panel h1{font-size:16px;font-weight:800;
    background:linear-gradient(90deg,#8ef0c8,#6cc6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px;
    border:1px solid rgba(255,255,255,.06);line-height:1.8}
  .status .row{display:flex;justify-content:space-between;gap:8px}
  .status .k{color:#8b90a8;font-size:12px}
  .status .v{font-weight:700;font-variant-numeric:tabular-nums}
  .turn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #333 inset}
  .dot.b{background:#1b1b1e;box-shadow:0 0 0 2px #ddd inset}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls label{font-size:11px;color:#8b90a8;display:block;margin-bottom:4px}
  select,button{font-family:inherit;font-size:13px;border-radius:10px;border:1px solid rgba(255,255,255,.09);
    background:#2c3142;color:#e9eaf0;padding:8px 10px;cursor:pointer;transition:.16s}
  select:hover,button:hover{background:#363c50}
  button.primary{background:linear-gradient(135deg,#2f9e79,#1f7a5c);border-color:#2f9e79;font-weight:700}
  button:disabled{opacity:.5;cursor:not-allowed}
  .moves{background:#15171f;border-radius:12px;padding:10px;height:150px;overflow-y:auto;
    font-size:13px;border:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
  .moves .mv{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:3px 4px;border-radius:6px}
  .moves .mv:nth-child(odd){background:rgba(255,255,255,.025)}
  .moves .num{color:#727892;font-size:12px}
  .moves .san{padding:1px 6px;border-radius:5px}
  .moves .san.last{background:rgba(127,209,174,.18);color:#9ff0cd}
  .promo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
  .promo.on{display:flex}
  .promo .box{background:#232735;padding:18px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.1);text-align:center}
  .promo .opts{display:flex;gap:10px}
  .promo .opts div{width:64px;height:64px;border-radius:12px;background:#2f3547;display:flex;
    align-items:center;justify-content:center;font-size:42px;cursor:pointer;transition:.15s;
    font-family:'Segoe UI Symbol',sans-serif}
  .promo .opts div:hover{background:#3d465e;transform:translateY(-3px)}
  .book-box{background:#15171f;border-radius:10px;padding:10px;border:1px solid rgba(255,255,255,.06);font-size:12px}
  .book-status{font-size:11px;color:#f88;margin-top:6px;line-height:1.5}
  .book-status.ok{color:#8f8}
  .book-status.loading{color:#8cf}
  .book-progress{margin-top:6px;height:6px;background:#2c3142;border-radius:3px;overflow:hidden;display:none}
  .book-progress.on{display:block}
  .book-progress > div{height:100%;background:linear-gradient(90deg,#6cc6ff,#8ef0c8);width:0%;transition:width .15s}
</style>
</head>
<body>

<script src="polyglot-constants.js"></script>

<div class="app">
  <div class="board-outer">
    <div id="board">
      <div class="squares" id="squares"></div>
      <div class="pieces" id="pieces"></div>
    </div>
  </div>

  <aside class="panel">
    <h1>♛ محرك شطرنج + Polyglot Book</h1>
    <div class="status">
      <div class="turn"><span class="dot" id="turnDot"></span><span id="turnTxt">دور الأبيض</span></div>
      <div class="row"><span class="k">التقييم</span><span class="v" id="evalTxt">0.00</span></div>
      <div class="row"><span class="k">العمق / العقد</span><span class="v" id="depthTxt">-</span></div>
      <div class="row"><span class="k">الحالة</span><span class="v" id="stateTxt">جاهز</span></div>
    </div>
    <div class="controls">
      <div><label>العمق</label>
        <select id="depthSel">
          <option>2</option><option>3</option><option>4</option><option>5</option>
          <option selected>6</option><option>7</option><option>8</option><option>9</option>
        </select>
      </div>
      <div><label>الزمن</label>
        <select id="timeSel">
          <option value="1000">1 ث</option><option value="3000" selected>3 ث</option>
          <option value="6000">6 ث</option><option value="12000">12 ث</option>
          <option value="30000">30 ث</option><option value="0">بلا حد</option>
        </select>
      </div>
      <div><label>تلعب بـ</label>
        <select id="sideSel"><option value="0" selected>الأبيض</option><option value="1">الأسود</option></select>
      </div>
      <div><label>&nbsp;</label><button id="flipBtn">↻ اقلب</button></div>
      <button class="primary" id="newBtn" style="grid-column:span 2">لعبة جديدة</button>
      <button id="undoBtn" style="grid-column:span 2">↶ تراجع</button>
    </div>

    <div class="book-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <label style="font-size:11px;color:#8b90a8">📖 الكتاب — عدد النقلات</label>
        <select id="bookPliesSel" style="padding:4px 8px;font-size:12px">
          <option value="0">معطّل</option>
          <option value="10">5</option>
          <option value="16">8</option>
          <option value="20" selected>10</option>
          <option value="24">12</option>
          <option value="30">15</option>
          <option value="999">كامل</option>
        </select>
      </div>
      <div style="display:flex;gap:6px">
        <button id="bookReloadBtn" style="flex:1;font-size:12px">🔄 أعد المحاولة</button>
        <button id="bookFileBtn" style="flex:1;font-size:12px">📁 يدوي</button>
      </div>
      <input type="file" id="bookFile" accept=".bin" style="display:none">
      <div class="book-progress" id="bookProgress"><div id="bookProgressBar"></div></div>
      <div class="book-status" id="bookStatus">جاري البحث عن الكتاب...</div>
    </div>

    <div class="moves" id="moves"></div>
  </aside>
</div>

<div class="promo" id="promo"><div class="box">
  <p style="font-size:13px;color:#9aa0b8;margin-bottom:12px">اختر قطعة الترقية</p>
  <div class="opts" id="promoOpts"></div>
</div></div>

<!-- ================= ENGINE ================= -->
<script id="engine-src" type="text/js-worker">
(function(global){
'use strict';

var EMPTY=0,PAWN=1,KNIGHT=2,BISHOP=3,ROOK=4,QUEEN=5,KING=6;
var WHITE=0,BLACK=1;
var FLAG_NORMAL=0,FLAG_DOUBLE=1,FLAG_EP=2,FLAG_CASTLE=3;
var MAX_PLY=128, INF=1000000, MATE=100000;

function pc(t,c){return t|(c<<3)}
function pType(p){return p&7}
function pColor(p){return p>>3}
function mv(from,to,promo,flag){return (from|(to<<6)|((promo||0)<<12)|((flag||0)<<15))|0}
function mFrom(m){return m&63}
function mTo(m){return (m>>6)&63}
function mPromo(m){return (m>>12)&7}
function mFlag(m){return (m>>15)&7}
function idxToAlg(i){return 'abcdefgh'[i&7]+(8-(i>>3))}
function algToIdx(s){return (8-parseInt(s[1],10))*8+(s.charCodeAt(0)-97)}
function sqColor(s){return ((s>>3)+(s&7))&1}
var PIECE_CHARS=['','P','N','B','R','Q','K','','','p','n','b','r','q','k'];

var board=new Int8Array(64);
var side=WHITE, castling=0, epSq=-1, halfmove=0, fullmove=1;
var kingSq=[60,4];
var hashLo=0,hashHi=0;

var zPieceLo=new Int32Array(15*64), zPieceHi=new Int32Array(15*64);
var zCastleLo=new Int32Array(16), zCastleHi=new Int32Array(16);
var zEpLo=new Int32Array(8), zEpHi=new Int32Array(8);
var zTurnLo=0, zTurnHi=0;
var _rngState=0x9E3779B9;
function rnd32(){_rngState^=_rngState<<13;_rngState>>>=0;_rngState^=_rngState>>>17;_rngState^=_rngState<<5;_rngState>>>=0;return _rngState>>>0}
(function(){
  for(var i=0;i<15*64;i++){zPieceLo[i]=rnd32()|0;zPieceHi[i]=rnd32()|0}
  for(var j=0;j<16;j++){zCastleLo[j]=rnd32()|0;zCastleHi[j]=rnd32()|0}
  for(var k=0;k<8;k++){zEpLo[k]=rnd32()|0;zEpHi[k]=rnd32()|0}
  zTurnLo=rnd32()|0; zTurnHi=rnd32()|0;
})();
function hPiece(p,sq){hashLo^=zPieceLo[p*64+sq];hashHi^=zPieceHi[p*64+sq]}
function computeHash(){
  var lo=0,hi=0,i,p;
  for(i=0;i<64;i++){p=board[i];if(p){lo^=zPieceLo[p*64+i];hi^=zPieceHi[p*64+i]}}
  lo^=zCastleLo[castling];hi^=zCastleHi[castling];
  if(epSq!==-1){lo^=zEpLo[epSq&7];hi^=zEpHi[epSq&7]}
  if(side===BLACK){lo^=zTurnLo;hi^=zTurnHi}
  hashLo=lo|0; hashHi=hi|0;
}

// ====== POLYGLOT HASH (Uint32Array مسطّح) ======
var PG_RANDOM = null;

function initPolyglotConstants(raw) {
  if (!raw) { PG_RANDOM = null; return false; }
  if (raw instanceof Uint32Array) {
    PG_RANDOM = raw;
  } else if (Array.isArray(raw)) {
    if (raw.length > 0 && Array.isArray(raw[0])) {
      // مصفوفة أزواج [hi, lo]
      var flat = new Uint32Array(raw.length * 2);
      for (var i = 0; i < raw.length; i++) {
        flat[i*2]   = raw[i][0] >>> 0;
        flat[i*2+1] = raw[i][1] >>> 0;
      }
      PG_RANDOM = flat;
    } else {
      // مصفوفة مسطّحة
      PG_RANDOM = new Uint32Array(raw);
    }
  } else {
    PG_RANDOM = null;
  }
  return !!(PG_RANDOM && PG_RANDOM.length >= 781 * 2);
}

// استقبال تلقائي من polyglot-constants.js
if (typeof global.POLYGLOT_RANDOM !== 'undefined' && global.POLYGLOT_RANDOM) {
  initPolyglotConstants(global.POLYGLOT_RANDOM);
}

function pgIsEpValid(){
  if (epSq === -1) return false;
  var f = epSq & 7;
  if (side === BLACK) {
    if (f > 0 && board[epSq - 9] === pc(PAWN, BLACK)) return true;
    if (f < 7 && board[epSq - 7] === pc(PAWN, BLACK)) return true;
  } else {
    if (f > 0 && board[epSq + 7] === pc(PAWN, WHITE)) return true;
    if (f < 7 && board[epSq + 9] === pc(PAWN, WHITE)) return true;
  }
  return false;
}

function polyglotHash(){
  if (!PG_RANDOM) return null;
  var R = PG_RANDOM;
  var hi = 0, lo = 0;
  for (var i = 0; i < 64; i++) {
    var p = board[i];
    if (p === 0) continue;
    var type = p & 7, color = p >> 3;
    var pieceIdx = (type - 1) * 2 + (color === BLACK ? 0 : 1);
    var rank = i >> 3, f = i & 7;
    var sq = (7 - rank) * 8 + f;
    var idx = (pieceIdx * 64 + sq) * 2;
    hi ^= R[idx];
    lo ^= R[idx + 1];
  }
  if (castling & 1) { hi ^= R[768*2];   lo ^= R[768*2+1]; }
  if (castling & 2) { hi ^= R[769*2];   lo ^= R[769*2+1]; }
  if (castling & 4) { hi ^= R[770*2];   lo ^= R[770*2+1]; }
  if (castling & 8) { hi ^= R[771*2];   lo ^= R[771*2+1]; }
  if (pgIsEpValid()) {
    var epFile = epSq & 7;
    hi ^= R[(772 + epFile) * 2];
    lo ^= R[(772 + epFile) * 2 + 1];
  }
  if (side === BLACK) {
    hi ^= R[780*2];
    lo ^= R[780*2+1];
  }
  return (hi >>> 0) + ':' + (lo >>> 0);
}
// ====== END POLYGLOT ======

function charToPiece(c){
  var up=c.toUpperCase();
  var t={P:PAWN,N:KNIGHT,B:BISHOP,R:ROOK,Q:QUEEN,K:KING}[up];
  if(!t)return 0;
  return pc(t,c===up?WHITE:BLACK);
}
function setFen(fen,opts){
  opts=opts||{};
  for(var i=0;i<64;i++)board[i]=0;
  var parts=fen.trim().split(/\s+/);
  var rows=parts[0].split('/'), idx=0;
  for(var r=0;r<8&&r<rows.length;r++){
    var row=rows[r];
    for(var k=0;k<row.length;k++){
      var ch=row[k];
      if(ch>='1'&&ch<='8')idx+=ch.charCodeAt(0)-48;
      else if(idx<64)board[idx++]=charToPiece(ch);
    }
  }
  side=(parts[1]==='b')?BLACK:WHITE;
  castling=0;
  var cs=parts[2]||'-';
  if(cs.indexOf('K')>=0)castling|=1;
  if(cs.indexOf('Q')>=0)castling|=2;
  if(cs.indexOf('k')>=0)castling|=4;
  if(cs.indexOf('q')>=0)castling|=8;
  epSq=(!parts[3]||parts[3]==='-')?-1:algToIdx(parts[3]);
  halfmove=parseInt(parts[4],10)||0;
  fullmove=parseInt(parts[5],10)||1;
  kingSq[WHITE]=-1; kingSq[BLACK]=-1;
  for(var i2=0;i2<64;i2++){
    if(board[i2]===pc(KING,WHITE))kingSq[WHITE]=i2;
    else if(board[i2]===pc(KING,BLACK))kingSq[BLACK]=i2;
  }
  computeHash();
  hIdx=0; posN=0;
  if(opts.prevHashes){
    var ph=opts.prevHashes;
    for(var pi=0;pi<ph.length&&posN<posHlo.length;pi++){
      posHlo[posN]=ph[pi][0]|0;
      posHhi[posN]=ph[pi][1]|0;
      posN++;
    }
  }
  if(opts.newGame){
    ttKey.fill(0); ttLock.fill(0); ttDepth.fill(-1);
    for(var z=0;z<64*64;z++){historyTable[z]=0}
    counterMoves.fill(0);
  }
}
function getFen(){
  var s='',r,f;
  for(r=0;r<8;r++){
    var empty=0;
    for(f=0;f<8;f++){
      var p=board[r*8+f];
      if(p===0)empty++;
      else{if(empty){s+=empty;empty=0}s+=PIECE_CHARS[p]}
    }
    if(empty)s+=empty;
    if(r<7)s+='/';
  }
  s+=' '+(side===WHITE?'w':'b');
  var c='';
  if(castling&1)c+='K'; if(castling&2)c+='Q';
  if(castling&4)c+='k'; if(castling&8)c+='q';
  s+=' '+(c||'-');
  s+=' '+(epSq===-1?'-':idxToAlg(epSq));
  s+=' '+halfmove+' '+fullmove;
  return s;
}

var HS=2048;
var hMove=new Int32Array(HS),hCastle=new Int32Array(HS),hEp=new Int32Array(HS);
var hHalf=new Int32Array(HS),hHl=new Int32Array(HS),hHh=new Int32Array(HS);
var hCap=new Int32Array(HS),hCapSq=new Int32Array(HS);
var hIdx=0;
var posHlo=new Int32Array(HS), posHhi=new Int32Array(HS);
var posN=0;

function makeMove(m){
  var from=m&63,to=(m>>6)&63,promo=(m>>12)&7,flag=(m>>15)&7;
  var p=board[from], us=side;
  var captured=board[to], capSq=to;
  if(flag===FLAG_EP){capSq=(us===WHITE)?to+8:to-8;captured=board[capSq]}
  var hi=hIdx++;
  hMove[hi]=m;hCastle[hi]=castling;hEp[hi]=epSq;hHalf[hi]=halfmove;
  hHl[hi]=hashLo;hHh[hi]=hashHi;hCap[hi]=captured;hCapSq[hi]=capSq;
  board[from]=0;hPiece(p,from);
  if(flag===FLAG_EP){board[capSq]=0;hPiece(captured,capSq)}
  else if(captured){hPiece(captured,to)}
  var placed=promo?pc(promo,us):p;
  board[to]=placed;hPiece(placed,to);
  if((p&7)===KING)kingSq[us]=to;
  if(flag===FLAG_CASTLE){
    var rf,rt;
    if(to===62){rf=63;rt=61}
    else if(to===58){rf=56;rt=59}
    else if(to===6){rf=7;rt=5}
    else{rf=0;rt=3}
    var rk=board[rf];
    board[rf]=0;hPiece(rk,rf);
    board[rt]=rk;hPiece(rk,rt);
  }
  var nc=castling;
  if((p&7)===KING)nc&=(us===WHITE)?~3:~12;
  if(from===63||to===63)nc&=~1;
  if(from===56||to===56)nc&=~2;
  if(from===7||to===7)nc&=~4;
  if(from===0||to===0)nc&=~8;
  if(nc!==castling){
    hashLo^=zCastleLo[castling]^zCastleLo[nc];
    hashHi^=zCastleHi[castling]^zCastleHi[nc];
    castling=nc;
  }
  if(epSq!==-1){hashLo^=zEpLo[epSq&7];hashHi^=zEpHi[epSq&7]}
  epSq=-1;
  if(flag===FLAG_DOUBLE){
    epSq=(us===WHITE)?to+8:to-8;
    hashLo^=zEpLo[epSq&7];hashHi^=zEpHi[epSq&7];
  }
  if((p&7)===PAWN||captured)halfmove=0;else halfmove++;
  side=us^1;
  hashLo^=zTurnLo;hashHi^=zTurnHi;
  if(us===BLACK)fullmove++;
  if(posN<posHlo.length){posHlo[posN]=hashLo;posHhi[posN]=hashHi;posN++}
}
function unmakeMove(){
  var hi=--hIdx, m=hMove[hi];
  var from=m&63,to=(m>>6)&63,promo=(m>>12)&7,flag=(m>>15)&7;
  side^=1;
  var us=side;
  castling=hCastle[hi];epSq=hEp[hi];halfmove=hHalf[hi];
  hashLo=hHl[hi];hashHi=hHh[hi];
  if(us===BLACK)fullmove--;
  var p=board[to];
  if(promo)p=pc(PAWN,us);
  board[from]=p;board[to]=0;
  if((p&7)===KING)kingSq[us]=from;
  var captured=hCap[hi];
  if(flag===FLAG_EP){board[hCapSq[hi]]=captured}
  else if(captured){board[to]=captured}
  if(flag===FLAG_CASTLE){
    var rf,rt;
    if(to===62){rf=63;rt=61}
    else if(to===58){rf=56;rt=59}
    else if(to===6){rf=7;rt=5}
    else{rf=0;rt=3}
    board[rf]=board[rt];board[rt]=0;
  }
  if(posN>0)posN--;
}

function genMoves(ply,capsOnly){

    var p=board[sq];
    if(p===0||(p>>3)!==us)continue;
    var t=p&7;
    var f=sq&7,r=sq>>3;
    if(t===PAWN){
      var dir=(us===WHITE)?-8:8;
      var promoRow=(us===WHITE)?0:7;
      var startRow=(us===WHITE)?6:1;
      var one=sq+dir;
      if(one>=0&&one<64&&board[one]===0){
        if((one>>3)===promoRow){

          mStack[base+n++]=mv(sq,one,ROOK,0);

          mStack[base+n++]=mv(sq,one,KNIGHT,0);
        } else if(!capsOnly){
          mStack[base+n++]=mv(sq,one,0,0);
          if(r===startRow){
            var two=sq+dir+dir;

          }
        }
      }
      for(var d=-1;d<=1;d+=2){
        var nf=f+d;
        if(nf<0||nf>7)continue;
        var ts=sq+dir+d;
        if(ts<0||ts>63)continue;
        var tp=board[ts];
        if(tp!==0){
          if((tp>>3)===them){
            if((ts>>3)===promoRow){
              mStack[base+n++]=mv(sq,ts,QUEEN,0);
              mStack[base+n++]=mv(sq,ts,ROOK,0);
              mStack[base+n++]=mv(sq,ts,BISHOP,0);
              mStack[base+n++]=mv(sq,ts,KNIGHT,0);
            } else mStack[base+n++]=mv(sq,ts,0,0);
          }
        } else if(ts===epSq) mStack[base+n++]=mv(sq,ts,0,FLAG_EP);
      }
    } else if(t===KNIGHT||t===KING){
      var dirs=(t===KNIGHT)?KNIGHT_D:KING_D;
      for(var i=0;i<8;i++){
        var nr=r+dirs[i][0],nf2=f+dirs[i][1];
        if(nr<0||nr>7||nf2<0||nf2>7)continue;
        var ts2=nr*8+nf2, tp2=board[ts2];
        if(tp2===0){if(!capsOnly)mStack[base+n++]=mv(sq,ts2,0,0)}
        else if((tp2>>3)===them)mStack[base+n++]=mv(sq,ts2,0,0);
      }
      if(t===KING&&!capsOnly){
        if(us===WHITE&&sq===60){
          if((castling&1)&&board[61]===0&&board[62]===0&&board[63]===pc(ROOK,WHITE)){
            if(!isAttacked(60,BLACK)&&!isAttacked(61,BLACK)&&!isAttacked(62,BLACK))
              mStack[base+n++]=mv(60,62,0,FLAG_CASTLE);
          }
          if((castling&2)&&board[59]===0&&board[58]===0&&board[57]===0&&board[56]===pc(ROOK,WHITE)){
            if(!isAttacked(60,BLACK)&&!isAttacked(59,BLACK)&&!isAttacked(58,BLACK))
              mStack[base+n++]=mv(60,58,0,FLAG_CASTLE);
          }
        } else if(us===BLACK&&sq===4){
          if((castling&4)&&board[5]===0&&board[6]===0&&board[7]===pc(ROOK,BLACK)){
            if(!isAttacked(4,WHITE)&&!isAttacked(5,WHITE)&&!isAttacked(6,WHITE))
              mStack[base+n++]=mv(4,6,0,FLAG_CASTLE);
          }
          if((castling&8)&&board[3]===0&&board[2]===0&&board[1]===0&&board[0]===pc(ROOK,BLACK)){
            if(!isAttacked(4,WHITE)&&!isAttacked(3,WHITE)&&!isAttacked(2,WHITE))
              mStack[base+n++]=mv(4,2,0,FLAG_CASTLE);
          }
        }
      }
    } else {
      var dirs2=(t===BISHOP)?BISHOP_D:(t===ROOK)?ROOK_D:KING_D;
      var cnt=(t===QUEEN)?8:4;
      for(var k=0;k<cnt;k++){
        var dr=dirs2[k][0],df=dirs2[k][1];
        var rr=r+dr,ff=f+df;

            break;
          }
          rr+=dr;ff+=df;
        }
      }
    }
  }
  return n;
}

}

function evalKQK(sK,wK,qS){
  var edgeBonus=(6-EDGE_DIST[wK])*25;
  var cd=Math.min(CORNER_DIST_LIGHT[wK],CORNER_DIST_DARK[wK]);
  var cornerBonus=(7-cd)*20;
  var kingClose=(7-chebyshev(sK,wK))*15;
  var queenClose=(7-chebyshev(qS,wK))*8;
  var stale=0;
  if(EDGE_DIST[wK]===0&&chebyshev(qS,wK)===1){
    var free=0,adj=ATK_KING[wK];
    for(var i=0;i<adj.length;i++){var s=adj[i];if(board[s]===0&&s!==qS)free++;}
    if(free===0)stale=-100;
  }
  return 900+edgeBonus+cornerBonus+kingClose+queenClose+stale;
}

function evalKPK(sK,wK,pS,color){
  var pFile=pS&7, pRank=pS>>3;
  var pawnRank=color===WHITE?(8-pRank):(pRank+1);
  var promoRank=8;
  var ranksToPromo=Math.abs(promoRank-pawnRank);
  var sKRank=color===WHITE?(8-(sK>>3)):((sK>>3)+1);
  var wKRank=color===WHITE?(8-(wK>>3)):((wK>>3)+1);
  var distWkToPromo=Math.max(Math.abs((wK&7)-pFile),Math.abs(wKRank-promoRank));
  if(distWkToPromo>ranksToPromo+1)return 900;
  var inFront=sKRank>pawnRank;
  var keyRank=color===WHITE?(pawnRank+1):(pawnRank-1);
  var sKToKey=Math.max(Math.abs((sK&7)-pFile),Math.abs(sKRank-keyRank));
  var wKToKey=Math.max(Math.abs((wK&7)-pFile),Math.abs(wKRank-keyRank));
  var score=100+(7-ranksToPromo)*30;
  if(inFront)score+=50;
  if(sKToKey<wKToKey)score+=80;
  if(sKToKey===0)score+=60;
  if(ranksToPromo<=2)score+=180;
  if(pFile===0||pFile===7){
    if(ranksToPromo<=3){
      var cornerRank=color===WHITE?8:1;
      var wKToCorner=Math.max(Math.abs((wK&7)-pFile),Math.abs(wKRank-cornerRank));
      var sKToCorner=Math.max(Math.abs((sK&7)-pFile),Math.abs(sKRank-cornerRank));
      if(wKToCorner<=sKToCorner)score-=250;
    }

  var sKToP=chebyshev(sK,pS);
  if(sKToP>3)score-=40;

}

function kingSafety(kSq,enemyColor){

    else if(t===KNIGHT){var at2=ATK_KNIGHT[sq];
      for(var a2=0;a2<at2.length&&!hit;a2++)for(var z2=0;z2<zoneSquares.length;z2++)if(zoneSquares[z2]===at2[a2]){hit=true;break;}}

function pawnShield(kSq,pawnCnt,pawnMinMax,color){

var SEE_VAL=[0,100,320,330,500,900,20000];

function seeFindLVA(sq,color,remLo,remHi){

    for(var j2=0,M2=ray2.length;j2<M2;j2++){var s4=ray2[j2];

function see(move){
  var from=move&63,to=(move>>6)&63,promo=(move>>12)&7,flag=(move>>15)&7;
  var capSq=-1,v0,ourVal;
  if(flag===FLAG_EP){capSq=(side===WHITE)?to+8:to-8;v0=SEE_VAL[PAWN];ourVal=SEE_VAL[PAWN];}
  else{
    var cp=board[to];
    v0=(cp!==0)?SEE_VAL[cp&7]:0;
    if(promo){v0+=SEE_VAL[promo]-SEE_VAL[PAWN];ourVal=SEE_VAL[promo];}
    else ourVal=SEE_VAL[board[from]&7];
  }
  if(v0===0&&promo===0)return 0;
  var remLo=0,remHi=0;
  if(from<32)remLo|=(1<<from);else remHi|=(1<<(from-32));
  if(capSq>=0){if(capSq<32)remLo|=(1<<capSq);else remHi|=(1<<(capSq-32));}
  _seeSeq[0]=v0;
  var n=1,stm=side^1,nextVal=ourVal;
  while(n<32){
    var atk=seeFindLVA(to,stm,remLo,remHi);
    if(atk<0)break;
    var atkSq=atk&63,atkType=atk>>6;
    _seeSeq[n++]=nextVal;
    nextVal=SEE_VAL[atkType];
    if(atkSq<32)remLo|=(1<<atkSq);else remHi|=(1<<(atkSq-32));
    stm^=1;
  }

  return _seeSeq[0]-V;
}
function seeGE(move,threshold){return see(move)>=threshold}

function quiesce(alpha,beta,ply){

  var base=ply*256;
  scoreMoves(ply,n,0);
  var best=checked?-INF:alpha,legal=0;
  for(var i=0;i<n;i++){
    var bi=i;
    for(var j=i+1;j<n;j++)if(sStack[base+j]>sStack[base+bi])bi=j;
    if(bi!==i){
      var tm=mStack[base+i];mStack[base+i]=mStack[base+bi];mStack[base+bi]=tm;
      var ts=sStack[base+i];sStack[base+i]=sStack[base+bi];sStack[base+bi]=ts;
    }
    var m=mStack[base+i];

      var victim=board[mTo(m)];var gain=victim?MVV[victim&7]:0;if(!gain)gain=100;

    }

    if(alpha<-MATE+ply)alpha=-MATE+ply;
    if(beta>MATE-ply-1)beta=MATE-ply-1;
    if(alpha>=beta)return alpha;
  }
  var isPv=(beta-alpha)>1;
  var checked=isAttacked(kingSq[side],side^1);
  if(checked&&ply<rootDepthLimit*2)depth++;
  if(depth<=0)return quiesce(alpha,beta,ply);
  var idx=hashLo&TT_MASK;
  var ttM=0;
  if(ttDepth[idx]>=0&&ttKey[idx]===hashLo&&ttLock[idx]===hashHi){
    ttM=ttMove[idx];
    if(ply>0&&!isPv&&ttDepth[idx]>=depth){
      var s2=ttScore[idx];
      if(s2>MATE-1000)s2-=ply;else if(s2<-MATE+1000)s2+=ply;
      var fl=ttFlag[idx];
      if(fl===0)return s2;
      if(fl===1&&s2>=beta)return s2;
      if(fl===2&&s2<=alpha)return s2;
    }
  }
  var staticEval=evaluate();
  if(!isPv&&!checked&&depth<=2&&staticEval+300*depth<alpha){
    var r=quiesce(alpha-1,alpha,ply);
    if(r<alpha)return r;
  }
  if(!isPv&&!checked&&depth<=4&&Math.abs(alpha)<MATE-1000&&Math.abs(beta)<MATE-1000){
    var margin=100+80*depth;
    if(staticEval-margin>=beta)return staticEval;
  }
  if(!isPv&&!checked&&allowNull&&depth>=3&&ply>0&&staticEval>=beta&&Math.abs(beta)<MATE-1000&&hasNonPawn(side)){
    var R=2+(depth>6?1:0);
    makeNull();
    var ns=-negamax(depth-1-R,-beta,-beta+1,ply+1,false);
    unmakeNull();
    if(stopped)return 0;
    if(ns>=beta)return (ns>MATE-1000)?beta:ns;
  }
  var n=genMoves(ply,false);
  var base=ply*256;
  scoreMoves(ply,n,ttM);
  var best=-INF,bestMove=0,legal=0;
  var origAlpha=alpha;
  for(var i=0;i<n;i++){
    var bi=i;
    for(var j=i+1;j<n;j++)if(sStack[base+j]>sStack[base+bi])bi=j;
    if(bi!==i){
      var tm=mStack[base+i];mStack[base+i]=mStack[base+bi];mStack[base+bi]=tm;
      var ts=sStack[base+i];sStack[base+i]=sStack[base+bi];sStack[base+bi]=ts;
    }
    var m=mStack[base+i];
    var toSq=mTo(m),flagM=mFlag(m);
    var quiet=(board[toSq]===0)&&flagM!==FLAG_EP;
    if(!isPv&&!checked&&quiet&&depth<=3&&legal>3+depth*depth)continue;
    makeMove(m);
    if(inCheck(side^1)){unmakeMove();continue}
    legal++;
    var newDepth=depth-1,score,extension=0;
    if(!quiet&&hIdx>=2){
      var prev=hMove[hIdx-2];
      if(prev!==0&&mTo(prev)===toSq){
        var captured=hCap[hIdx-1];
        if(captured!==0&&(captured&7)===PAWN)extension+=1;
      }
    }
    var extDepth=newDepth+extension;
    if(legal===1)score=-negamax(extDepth,-beta,-alpha,ply+1,true);
    else{
      var red=0;
      if(depth>=3&&legal>=3&&quiet&&!checked&&newDepth>2){
        red=1;
        if(legal>=6)red=2;
        if(depth>=6)red=3;
        if(isPv)red=Math.max(0,red-1);
        red+=Math.floor((depth-3)/3);
        if(red>newDepth-2)red=Math.max(0,newDepth-2);
      }
      score=-negamax(extDepth-red,-alpha-1,-alpha,ply+1,true);
      if(score>alpha&&red>0)score=-negamax(extDepth,-alpha-1,-alpha,ply+1,true);
      if(score>alpha&&score<beta)score=-negamax(extDepth,-beta,-alpha,ply+1,true);
    }
    unmakeMove();
    if(stopped)return 0;
    if(score>best){best=score;bestMove=m}
    if(score>alpha){
      alpha=score;
      if(alpha>=beta){
        if(quiet){
          if(killers[ply*2]!==m){killers[ply*2+1]=killers[ply*2];killers[ply*2]=m;}
          var hi=(m&63)*64+((m>>6)&63);
          historyTable[hi]+=depth*depth;
          if(historyTable[hi]>1000000){for(var z=0;z<historyTable.length;z++)historyTable[z]>>=1;}
          if(hIdx>0){var prev2=hMove[hIdx-1];if(prev2!==0)counterMoves[(prev2&63)*64+((prev2>>6)&63)]=m;}
        }
        break;
      }
    }
  }
  if(legal===0)return checked?(-MATE+ply):0;
  var flag2=(best<=origAlpha)?2:((best>=beta)?1:0);
  var storeScore=best;
  if(storeScore>MATE-1000)storeScore+=ply;
  else if(storeScore<-MATE+1000)storeScore-=ply;
  if(ttDepth[idx]<0||depth>=ttDepth[idx]||ttKey[idx]!==hashLo||ttLock[idx]!==hashHi){
    ttKey[idx]=hashLo;ttLock[idx]=hashHi;ttDepth[idx]=depth;
    ttFlag[idx]=flag2;ttScore[idx]=storeScore;ttMove[idx]=bestMove;
  }
  return best;
}

function searchRoot(depth,alpha,beta,prevBest){
  var n=genMoves(0,false);
  scoreMoves(0,n,prevBest);
  var best=-INF,bestM=0,legal=0;
  for(var i=0;i<n;i++){
    var bi=i;
    for(var j=i+1;j<n;j++)if(sStack[j]>sStack[bi])bi=j;
    if(bi!==i){
      var tm=mStack[i];mStack[i]=mStack[bi];mStack[bi]=tm;
      var ts=sStack[i];sStack[i]=sStack[bi];sStack[bi]=ts;
    }
    var m=mStack[i];
    makeMove(m);
    if(inCheck(side^1)){unmakeMove();continue}
    legal++;
    var score;
    if(legal===1)score=-negamax(depth-1,-beta,-alpha,1,true);
    else{
      score=-negamax(depth-1,-alpha-1,-alpha,1,true);
      if(score>alpha&&score<beta)score=-negamax(depth-1,-beta,-alpha,1,true);
    }
    unmakeMove();
    if(stopped)break;
    if(score>best){best=score;bestM=m}
    if(score>alpha)alpha=score;
  }
  if(legal===0)return{score:isAttacked(kingSq[side],side^1)?-MATE:0,move:0,complete:true};
  return{score:best,move:bestM,complete:!stopped};
}

function search(maxDepth,timeMs){
  nodes=0;stopped=false;startTime=Date.now();
  timeLimit=(timeMs&&timeMs>0)?timeMs:1e12;
  killers.fill(0);
  for(var hi=0;hi<64*64;hi++)historyTable[hi]=(historyTable[hi]>>1);
  counterMoves.fill(0);
  var legalMoves=generateLegalMoves();
  if(legalMoves.length===0)return{move:0,score:0,depth:0,nodes:0,time:0};
  if(legalMoves.length===1)return{move:legalMoves[0],score:0,depth:1,nodes:0,time:0};
    var bestMove=legalMoves[0],bestScore=0,completedDepth=0,prevBest=0,noProgress=-1;
  for(var d=1;d<=maxDepth;d++){
    rootDepthLimit=d;
    var alpha=-INF,beta=INF;
    if(d>=4&&Math.abs(bestScore)<MATE-1000){alpha=bestScore-25;beta=bestScore+25;}
    var res=null,guard=0;
    while(guard++<12){
      res=searchRoot(d,alpha,beta,prevBest);
      if(stopped)break;
      if(res.score<=alpha){beta=(alpha+beta)>>1;alpha=res.score-100;continue;}
      if(res.score>=beta){alpha=(alpha+beta)>>1;beta=res.score+100;continue;}
      break;
    }
    if(stopped)break;
    if(!res||!res.complete)break;
    if(res.move){if(res.move===bestMove)noProgress++;else noProgress=0;bestMove=res.move;prevBest=res.move;}
    bestScore=res.score;completedDepth=d;
    if(global.onSearchInfo)global.onSearchInfo({depth:d,score:bestScore,nodes:nodes,move:bestMove,time:Date.now()-startTime});
    if(Math.abs(bestScore)>MATE-1000)break;
    var elapsed=Date.now()-startTime;
    if(timeMs&&timeMs>0){
      if(elapsed>timeMs*0.45)break;
            if(noProgress>=3&&elapsed>timeMs*0.30)break;
      var expected=elapsed*3;
      if(elapsed+expected>timeMs*0.9)break;
    }
  }
  return{move:bestMove,score:bestScore,depth:completedDepth,nodes:nodes,time:Date.now()-startTime,stopped:stopped};
}

var LETTERS=['','','N','B','R','Q','K'];
function moveToSan(m){
  var from=m&63,to=mTo(m),promo=mPromo(m),flag=mFlag(m);
  var p=board[from],t=p&7;
  var capture=(board[to]!==0)||(flag===FLAG_EP);
  var san;
  if(flag===FLAG_CASTLE)san=(to===62||to===6)?'O-O':'O-O-O';
  else if(t===PAWN){
    san=capture?('abcdefgh'[from&7]+'x'+idxToAlg(to)):idxToAlg(to);
    if(promo)san+='='+LETTERS[promo];
  } else {
    var legal=generateLegalMoves();
    var sameFile=false,sameRank=false,any=false;
    for(var i=0;i<legal.length;i++){
      var mm=legal[i];
      if(mm===m)continue;
      if(mTo(mm)!==to)continue;
      if(board[mFrom(mm)]!==p)continue;
      any=true;
      if((mFrom(mm)&7)===(from&7))sameFile=true;
      if(((mFrom(mm)>>3)&7)===(from>>3))sameRank=true;
    }
    var dis='';
    if(any){
      if(!sameFile)dis='abcdefgh'[from&7];
      else if(!sameRank)dis=String(8-(from>>3));
      else dis='abcdefgh'[from&7]+String(8-(from>>3));
    }
    san=LETTERS[t]+dis+(capture?'x':'')+idxToAlg(to);
  }
  makeMove(m);
  var opp=side;
  var oppLegal=generateLegalMoves();
  if(isAttacked(kingSq[opp],opp^1))san+=(oppLegal.length===0)?'#':'+';
  unmakeMove();
  return san;
}

function insufficientMaterial(){
  var wB=0,bB=0,wN=0,bN=0,wBc=[0,0],bBc=[0,0];
  for(var i=0;i<64;i++){
    var p=board[i];if(!p)continue;
    var t=p&7,c=p>>3;
    if(t===PAWN||t===ROOK||t===QUEEN)return false;
    if(t===BISHOP){var color=sqColor(i);if(c===WHITE){wB++;wBc[color]++}else{bB++;bBc[color]++}}
    else if(t===KNIGHT){if(c===WHITE)wN++;else bN++;}
  }
  var wM=wB+wN,bM=bB+bN;
  if(wM===0&&bM===0)return true;
  if(wM+bM===1)return true;
  if(wM===1&&bM===1&&wN===0&&bN===0){if((wBc[0]>0&&bBc[0]>0)||(wBc[1]>0&&bBc[1]>0))return true;}
  return false;
}

function gameStatus(){
  var legal=generateLegalMoves();
  if(legal.length===0){
    if(isAttacked(kingSq[side],side^1)){
      return{over:true,result:(side===WHITE?'0-1':'1-0'),reason:'checkmate',
             text:(side===WHITE?'كش مات — فاز الأسود':'كش مات — فاز الأبيض')};
    }
    return{over:true,result:'1/2-1/2',reason:'stalemate',text:'تعادل — جمود'};
  }
  if(halfmove>=100)return{over:true,result:'1/2-1/2',reason:'fifty',text:'تعادل — 50 نقلة'};
  if(countGameReps()>=3)return{over:true,result:'1/2-1/2',reason:'repetition',text:'تعادل — تكرار'};
  if(insufficientMaterial())return{over:true,result:'1/2-1/2',reason:'material',text:'تعادل — قطع غير كافية'};
  return{over:false,text:(side===WHITE?'دور الأبيض':'دور الأسود')};
}

function getPositionHistory(){
  var out=new Array(posN);
  for(var i=0;i<posN;i++)out[i]=[posHlo[i],posHhi[i]];
  return out;
}

global.Engine={
  WHITE:WHITE,BLACK:BLACK,
  PAWN:PAWN,KNIGHT:KNIGHT,BISHOP:BISHOP,ROOK:ROOK,QUEEN:QUEEN,KING:KING,
  FLAG_EP:FLAG_EP,FLAG_CASTLE:FLAG_CASTLE,
  setFen:setFen,getFen:getFen,
  getPositionHistory:getPositionHistory,
  getBoard:function(){return board},
  getSide:function(){return side},
  getKingSq:function(c){return kingSq[c]},
  getHalfmove:function(){return halfmove},
  inCheck:inCheck,
  legalMoves:generateLegalMoves,
  makeMove:makeMove,
  unmakeMove:unmakeMove,
  moveToSan:moveToSan,
  gameStatus:gameStatus,
  search:search,
  stopSearch:function(){stopped=true},
  pType:pType,pColor:pColor,
  mFrom:mFrom,mTo:mTo,mPromo:mPromo,mFlag:mFlag,
  idxToAlg:idxToAlg,
  polyglotHash:polyglotHash,
  setPolyglotConstants:initPolyglotConstants,
  isPolyglotReady:function(){return !!(PG_RANDOM && PG_RANDOM.length >= 781*2)},
  START_FEN:'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
};
})(self);
</script>

function updateStatus(){
  var st=E.getSide();
  turnDot.className='dot'+(st===E.BLACK?' b':'');
  turnTxt.textContent=(st===E.WHITE?'دور الأبيض':'دور الأسود');
  if(thinking)stateTxt.textContent='المحرك يفكر…';
}
function updateEvalFromSearch(score,sideAtSearch){
  var whiteScore=(sideAtSearch===E.WHITE)?score:-score;
  if(Math.abs(whiteScore)>90000){evalTxt.textContent=whiteScore>0?'مات للأبيض':'مات للأسود';return}
  if(Math.abs(whiteScore)>800){evalTxt.textContent=(whiteScore>0?'+':'')+(whiteScore/100).toFixed(2)+' (نهاية)';return}
  var v=whiteScore/100;
  evalTxt.textContent=(v>0?'+':'')+v.toFixed(2);
}

/* ═══════════════════════════════════════════════════════════════

function applyMove(m,recordSan){
  var san=recordSan?E.moveToSan(m):null;
  E.makeMove(m);
  pliesPlayed++;
  var nl={from:E.mFrom(m),to:E.mTo(m)};
  lastMoveHistory.push(nl);lastMove=nl;
  if(san)sanList.push(san);
  selected=-1;legalFromSelected=[];
  renderPieces();renderHighlights();renderMoves();updateStatus();
  var gs=E.gameStatus();
  if(gs.over){gameOver=true;stateTxt.textContent=gs.text;turnTxt.textContent='انتهت اللعبة';}
  else stateTxt.textContent='جاهز';
}
function engineTurn(){
  if(gameOver)return;
  if(E.getSide()===humanColor)return;
  thinking=true;updateStatus();depthTxt.textContent='...';
  var fen=E.getFen();
  var depth=parseInt(depthSel.value,10)||6;
  var tl=parseInt(timeSel.value,10)||0;

    worker._sideAtSearch=sideAtSearch;
    worker.postMessage({
      cmd:'search',fen:fen,depth:depth,timeLimit:tl,id:id,
      prevHashes:prevHashes,newGame:false,
      plyCount: pliesPlayed
    });
  } else {
    setTimeout(function(){
      var r=E.search(depth,tl);
      onEngineResult({id:id,move:r.move,score:r.score,depth:r.depth,nodes:r.nodes,side:sideAtSearch});
    },30);

function onEngineResult(d){

    depthTxt.textContent=d.depth+' / '+(d.nodes||0).toLocaleString('en-US');

    }

  };

/* ═══════════════════════════════════════════════════════════════
   تفاعل اللوحة
   ═══════════════════════════════════════════════════════════════ */
function squareFromPoint(cx,cy){
  var rect=boardEl.getBoundingClientRect();
  var cw=rect.width/8,ch=rect.height/8;
  var col=Math.floor((cx-rect.left)/cw);
  var row=Math.floor((cy-rect.top)/ch);
  if(col<0||col>7||row<0||row>7)return -1;
  if(flipped){col=7-col;row=7-row}
  return row*8+col;
}
function isHumanTurn(){return !gameOver&&!thinking&&E.getSide()===humanColor}
function selectSquare(sq){
  var b=E.getBoard(),p=b[sq];
  if(!p||E.pColor(p)!==humanColor){selected=-1;legalFromSelected=[];return false}
  var all=E.legalMoves();
  legalFromSelected=[];
  for(var i=0;i<all.length;i++)if(E.mFrom(all[i])===sq)legalFromSelected.push(all[i]);
  if(legalFromSelected.length===0){selected=-1;return false}
  selected=sq;return true;
}
function tryMoveTo(sq){
  if(selected<0)return false;
  var matches=[];
  for(var i=0;i<legalFromSelected.length;i++)if(E.mTo(legalFromSelected[i])===sq)matches.push(legalFromSelected[i]);
  if(matches.length===0)return false;
  if(matches.length>1){pendingPromo=matches;showPromo(matches);return true}
  applyMove(matches[0],true);afterHumanMove();return true;
}
function afterHumanMove(){
  var gs=E.gameStatus();
  if(gs.over){gameOver=true;stateTxt.textContent=gs.text;turnTxt.textContent='انتهت اللعبة';return;}
  if(E.getSide()!==humanColor){stateTxt.textContent='المحرك يفكر…';setTimeout(engineTurn,60);}
  else stateTxt.textContent='دورك';
}
function showPromo(moves){
  promoOpts.innerHTML='';
  var order=[E.QUEEN,E.ROOK,E.BISHOP,E.KNIGHT];
  order.forEach(function(t){
    var d=document.createElement('div');
    d.textContent=GLYPH[t];
    d.style.color=(humanColor===E.WHITE)?'#fff':'#1b1b1e';
    d.style.textShadow=(humanColor===E.WHITE)
      ?'1px 1px 0 #222,-1px 1px 0 #222,1px -1px 0 #222,-1px -1px 0 #222'
      :'1px 1px 0 #ddd,-1px 1px 0 #ddd,1px -1px 0 #ddd,-1px -1px 0 #ddd';
    d.addEventListener('click',function(){
      var found=null;
      for(var i=0;i<pendingPromo.length;i++)if(E.mPromo(pendingPromo[i])===t){found=pendingPromo[i];break}
      promoEl.classList.remove('on');pendingPromo=null;
      if(found!==null){applyMove(found,true);afterHumanMove();}
    });
    promoOpts.appendChild(d);
  });
  promoEl.classList.add('on');
}

boardEl.addEventListener('pointerdown',function(ev){
  if(promoEl.classList.contains('on'))return;
  if(!isHumanTurn())return;
  var sq=squareFromPoint(ev.clientX,ev.clientY);
  if(sq<0)return;
  if(selected>=0&&selected!==sq){if(tryMoveTo(sq)){ev.preventDefault();return}}
  var b=E.getBoard(),p=b[sq];
  if(p&&E.pColor(p)===humanColor){selectSquare(sq);renderHighlights();}
  else{selected=-1;legalFromSelected=[];renderHighlights();}
});
boardEl.addEventListener('click',function(ev){
  if(promoEl.classList.contains('on'))return;
  if(!isHumanTurn())return;
  var sq=squareFromPoint(ev.clientX,ev.clientY);
  if(sq<0)return;
  if(selected>=0&&selected!==sq){tryMoveTo(sq);}
});

/* ═══════════════════════════════════════════════════════════════
   أزرار
   ═══════════════════════════════════════════════════════════════ */
function newGame(){
  searchId++;
  if(worker){try{worker.postMessage({cmd:'stop'})}catch(e){}}
  thinking=false;gameOver=false;
  selected=-1;legalFromSelected=[];lastMove=null;
  pliesPlayed=0;sanList=[];pendingPromo=null;lastMoveHistory=[];
  promoEl.classList.remove('on');
  humanColor=parseInt(sideSel.value,10);
  E.setFen(E.START_FEN,{newGame:true});
  renderPieces();renderHighlights();renderMoves();updateStatus();
  evalTxt.textContent='0.00';depthTxt.textContent='-';stateTxt.textContent='جاهز';
  if(E.getSide()!==humanColor)setTimeout(engineTurn,250);
}
function undoMove(){
  if(thinking){searchId++;thinking=false;if(worker){try{worker.postMessage({cmd:'stop'})}catch(e){}}}
  var steps=0;
  while(pliesPlayed>0&&steps<2){
    E.unmakeMove();pliesPlayed--;sanList.pop();lastMoveHistory.pop();steps++;
    if(E.getSide()===humanColor)break;
  }
  if(steps===0)return;
  gameOver=false;searchId++;
  selected=-1;legalFromSelected=[];
  lastMove=lastMoveHistory.length?lastMoveHistory[lastMoveHistory.length-1]:null;
  renderPieces();renderHighlights();renderMoves();updateStatus();
  if(E.getSide()!==humanColor){stateTxt.textContent='المحرك يفكر…';setTimeout(engineTurn,60);}
  else stateTxt.textContent='دورك';
}

document.getElementById('flipBtn').addEventListener('click',function(){
  flipped=!flipped;layoutSquares();renderPieces();renderHighlights();
});
document.getElementById('newBtn').addEventListener('click',newGame);
document.getElementById('undoBtn').addEventListener('click',undoMove);
sideSel.addEventListener('change',newGame);

/* ═══════════════════════════════════════════════════════════════
   تحميل الكتاب
   ═══════════════════════════════════════════════════════════════ */
function sendBookToWorker(buffer){
  if(!worker){ setBookStatus('لا يوجد Worker',''); return; }
  try{ worker.postMessage({cmd:'loadBook',buffer:buffer},[buffer]); }
  catch(e){ worker.postMessage({cmd:'loadBook',buffer:buffer}); }
}

function fetchWithProgress(url){
  return fetch(url,{cache:'no-cache'}).then(function(resp){
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var total = parseInt(resp.headers.get('content-length')||'0',10);
    var reader = resp.body && resp.body.getReader ? resp.body.getReader() : null;
    if(!reader){
      return resp.arrayBuffer();
    }
    var chunks=[], received=0;
    function step(){
      return reader.read().then(function(r){
        if(r.done){
          var out=new Uint8Array(received), off=0;
          for(var i=0;i<chunks.length;i++){ out.set(chunks[i],off); off+=chunks[i].length; }
          return out.buffer;
        }
        chunks.push(r.value);
        received += r.value.length;
        if(total>0){
          setProgress((received/total)*100);
          var mb=(received/1048576).toFixed(2);
          var tmb=(total/1048576).toFixed(2);
          setBookStatus('تحميل '+mb+' / '+tmb+' MB','loading');
        } else {
          setBookStatus('تحميل '+(received/1048576).toFixed(2)+' MB','loading');
        }
        return step();
      });
    }
    return step();
  });
}

function autoDetectBook(){
  var candidates = [BOOK_FILE].concat(BOOK_FALLBACKS);
  showProgress(true); setProgress(0);
  var i = 0;
  function next(){
    if(i >= candidates.length){
      showProgress(false);
      setBookStatus('لم يُعثر على الكتاب — استخدم "📁 يدوي"','');
      return Promise.resolve(false);
    }
    var url = candidates[i++];
    setBookStatus('جاري تجربة: '+url,'loading');
    return fetchWithProgress(url).then(function(buf){
      sendBookToWorker(buf);
      return true;
    }).catch(function(err){
      console.warn('[Book] فشل',url,'-',err.message);
      return next();
    });
  }
  return next();
}

bookFileBtn.addEventListener('click',function(){bookFileEl.click()});
bookFileEl.addEventListener('change',async function(ev){
  var file=ev.target.files[0];
  if(!file)return;
  setBookStatus('جاري التحميل: '+file.name,'loading');
  showProgress(true); setProgress(0);
  try{
    var reader=new FileReader();
    var buf=await new Promise(function(resolve,reject){
      reader.onload=function(){resolve(reader.result)};
      reader.onerror=function(){reject(reader.error)};
      reader.onprogress=function(e){
        if(e.lengthComputable){
          setProgress((e.loaded/e.total)*100);
          var mb=(e.loaded/1048576).toFixed(2);
          var tmb=(e.total/1048576).toFixed(2);
          setBookStatus('تحميل '+mb+' / '+tmb+' MB','loading');
        }
      };
      reader.readAsArrayBuffer(file);
    });
    sendBookToWorker(buf);
  }catch(err){
    showProgress(false);
    setBookStatus('خطأ: '+err.message,'');
  }
});

bookReloadBtn.addEventListener('click',function(){
  autoDetectBook();
});

bookPliesSel.addEventListener('change',function(){
  var v=parseInt(this.value,10)||0;
  if(worker)worker.postMessage({cmd:'setBookPlies',value:v});
});

/* ═══════════════════════════════════════════════════════════════
   تهيئة المحرك — انتظار ثوابت Polyglot ثم بناء الـ Worker
   ═══════════════════════════════════════════════════════════════ */
function waitForPolyglot(){
  return new Promise(function(resolve){
    // 1) جاهزة فوراً؟ (ندعم الشكلين: مسطّح 1562، أو أزواج 781)
    var pg = window.POLYGLOT_RANDOM;
    if(pg){
      var isFlat   = (pg.length >= 1562) && (typeof pg[0] === 'number');
      var isPaired = (pg.length >= 781)  && Array.isArray(pg[0]);
      if(isFlat || isPaired){
        return resolve(pg);
      }
    }
    // 2) في انتظار Promise؟
    if(window.POLYGLOT_RANDOM_PROMISE){
      return window.POLYGLOT_RANDOM_PROMISE.then(function(data){
        // حتى بعد حل الـ Promise، أعد الفحص بنفس المنطق
        var p = data || window.POLYGLOT_RANDOM;
        if(p){
          var okFlat   = (p.length >= 1562) && (typeof p[0] === 'number');
          var okPaired = (p.length >= 781)  && Array.isArray(p[0]);
          if(okFlat || okPaired) return resolve(p);
        }
        resolve(null);
      }).catch(function(){ resolve(null); });
    }
    // 3) لا يوجد polyglot-constants.js
    resolve(null);
  });
}

function buildWorker(){
  var blobURL = URL.createObjectURL(new Blob([engineSrc], {type:'application/javascript'}));

  var workerSrc =
    'importScripts(' + JSON.stringify(blobURL) + ');\n' +
    'var currentId = 0;\n' +
    'var book = null;\n' +
    'var bookMaxPlies = ' + DEFAULT_BOOK_PLIES + ';\n' +
    'self.Engine.onSearchInfo = function(info){\n' +
    '  self.postMessage({type:"info", id:currentId, depth:info.depth, score:info.score, nodes:info.nodes});\n' +
    '};\n' +
    'function parseBin(buffer){\n' +
    '  var view = new DataView(buffer);\n' +
    '  var map = new Map();\n' +
    '  for (var i = 0; i + 16 <= buffer.byteLength; i += 16) {\n' +
    '    var keyHi = view.getUint32(i, false);\n' +
    '    var keyLo = view.getUint32(i + 4, false);\n' +
    '    var mv = view.getUint16(i + 8, false);\n' +
    '    var w  = view.getUint16(i + 10, false);\n' +
    '    var key = (keyHi>>>0) + ":" + (keyLo>>>0);\n' +
    '    var arr = map.get(key);\n' +
    '    if (!arr) { arr = []; map.set(key, arr); }\n' +
    '    arr.push({mv:mv, w:w});\n' +
    '  }\n' +
    '  return map;\n' +
    '}\n' +
    'function pickBookMove(){\n' +
    '  if (!book) return null;\n' +
    '  if (!self.Engine.isPolyglotReady || !self.Engine.isPolyglotReady()) return null;\n' +
    '  var key = self.Engine.polyglotHash();\n' +
    '  if (!key) return null;\n' +
    '  var entries = book.get(key);\n' +
    '  if (!entries || !entries.length) return null;\n' +
    '  var total = 0;\n' +
    '  for (var j = 0; j < entries.length; j++) total += entries[j].w;\n' +
    '  var r = Math.random() * total;\n' +
    '  var chosen = entries[entries.length-1].mv;\n' +
    '  for (var k = 0; k < entries.length; k++) {\n' +
    '    r -= entries[k].w;\n' +
    '    if (r <= 0) { chosen = entries[k].mv; break; }\n' +
    '  }\n' +
    '  var to = chosen & 63;\n' +
    '  var from = (chosen >> 6) & 63;\n' +
    '  var promo = (chosen >> 12) & 7;\n' +
    '  var promoMap = [0, self.Engine.KNIGHT, self.Engine.BISHOP, self.Engine.ROOK, self.Engine.QUEEN];\n' +
    '  var fromE = (7 - (from >> 3)) * 8 + (from & 7);\n' +
    '  var toE   = (7 - (to   >> 3)) * 8 + (to   & 7);\n' +
    '  var p = promoMap[promo] || 0;\n' +
    '  var m = (fromE | (toE << 6) | (p << 12)) | 0;\n' +
    '  var legal = self.Engine.legalMoves();\n' +
    '  for (var l = 0; l < legal.length; l++) {\n' +
    '    if (legal[l] === m) return m;\n' +
    '    if (promo && (legal[l] & 0xFFF) === (m & 0xFFF)) return legal[l];\n' +
    '  }\n' +
    '  return null;\n' +
    '}\n' +
    'self.onmessage = function(e){\n' +
    '  var d = e.data;\n' +
    '  if (d.cmd === "setPolyglotConstants") {\n' +
    '    self.Engine.setPolyglotConstants(d.data);\n' +
    '    self.postMessage({type:"polyglotReady"});\n' +
    '    return;\n' +
    '  }\n' +
    '  if (d.cmd === "loadBook") {\n' +
    '    try { book = parseBin(d.buffer); } catch(err) { book = null; }\n' +
    '    self.postMessage({type:"bookLoaded", count: book ? book.size : 0});\n' +
    '  } else if (d.cmd === "setBookPlies") {\n' +
    '    bookMaxPlies = d.value | 0;\n' +
    '  } else if (d.cmd === "search") {\n' +
    '    currentId = d.id;\n' +
    '    self.Engine.setFen(d.fen, { prevHashes: d.prevHashes, newGame: d.newGame });\n' +
    '    if (d.plyCount < bookMaxPlies) {\n' +
    '      var bm = pickBookMove();\n' +
    '      if (bm) {\n' +
    '        self.postMessage({type:"bestmove", id:d.id, move:bm, score:0, depth:0, nodes:0, time:0, fromBook:true});\n' +
    '        return;\n' +
    '      }\n' +
    '    }\n' +
    '    var r = self.Engine.search(d.depth, d.timeLimit);\n' +
    '    self.postMessage({type:"bestmove", id:d.id, move:r.move, score:r.score, depth:r.depth, nodes:r.nodes, time:r.time});\n' +
    '  } else if (d.cmd === "stop") {\n' +
    '    self.Engine.stopSearch();\n' +
    '  }\n' +
    '};';

  var wURL = URL.createObjectURL(new Blob([workerSrc], {type:'application/javascript'}));
  try {
    worker = new Worker(wURL);
    attachWorkerHandlers(worker);
    return true;
  } catch(e) {
    console.warn('فشل إنشاء Worker:', e);
    worker = null;
    return false;
  }
}

/* ═══════════════════════════════════════════════════════════════
   البدء
   ═══════════════════════════════════════════════════════════════ */

renderPieces();renderHighlights();updateStatus();
stateTxt.textContent='دورك';

setBookStatus('جاري تحميل ثوابت Polyglot...','loading');
showProgress(true);

waitForPolyglot().then(function(pg){
  showProgress(false);

  if(pg){
    // طبق الثوابت على محرك الصفحة الرئيسية
    E.setPolyglotConstants(pg);
    setBookStatus('✓ ثوابت Polyglot جاهزة — جاري البحث عن الكتاب...','ok');
  } else {
    setBookStatus('⚠ polyglot-constants.js غير محمّل — الكتاب معطّل','');
    // نكمل بدون كتاب
  }

  // ابنِ الـ Worker
  var ok = buildWorker();
  if(!ok){
    setBookStatus('⚠ Worker غير مدعوم — سيُستخدم البحث المباشر','');
  }

  // إن كانت الثوابت جاهزة، أرسلها للـ Worker ثم ابحث عن الكتاب
  if(pg && worker){
    var arr = Array.from(pg);
    worker.postMessage({cmd:'setPolyglotConstants', data: arr});

    // ابدأ الكشف التلقائي
    setTimeout(autoDetectBook, 300);
  } else if(!pg){
    // عطّل أزرار الكتاب
    bookReloadBtn.disabled = true;
    bookFileBtn.disabled = true;
  }
});

})();
