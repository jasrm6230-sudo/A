<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرك شطرنج — WASM</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%,#2c3040,#0e0f15 65%);
    color:#e9eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .app{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1200px;width:100%}
  .board-outer{position:relative;padding:26px;border-radius:18px;
    background:linear-gradient(145deg,#3b4055,#20232f);
    box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
  #board{position:relative;width:min(74vh,68vw,600px);aspect-ratio:1;border-radius:6px;overflow:hidden;
    direction:ltr;touch-action:none;user-select:none;
    box-shadow:0 0 0 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.55)}
  .sq{position:absolute;top:0;left:0;width:12.5%;height:12.5%;cursor:pointer}
  .sq.light{background:#f0d9b5}.sq.dark{background:#b58863}
  .sq.last::before{content:'';position:absolute;inset:0;background:rgba(255,236,80,.36);pointer-events:none}
  .sq.sel::after{content:'';position:absolute;inset:0;background:rgba(255,196,0,.48);box-shadow:inset 0 0 0 4px rgba(255,170,0,.95);pointer-events:none}
  .sq.tgt::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;
    transform:translate(-50%,-50%);border-radius:50%;background:rgba(15,20,15,.34);pointer-events:none}
  .sq.tgt.cap::after{content:'';position:absolute;inset:7%;width:auto;height:auto;left:7%;top:7%;
    transform:none;border-radius:50%;background:transparent;border:6px solid rgba(15,20,15,.32);pointer-events:none}
  .sq.check::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle,rgba(255,45,45,.95),rgba(255,45,45,0) 72%)}
  .pieces{position:absolute;inset:0;pointer-events:none}
  .piece{position:absolute;top:0;left:0;width:12.5%;height:12.5%;
    display:flex;align-items:center;justify-content:center;
    font-size:min(9.2vh,8.4vw,74px);line-height:1;
    font-family:'Segoe UI Symbol','Apple Symbols',sans-serif;pointer-events:none}
  .piece.w{color:#fff;text-shadow:1px 1px 0 #222,-1px 1px 0 #222,1px -1px 0 #222,-1px -1px 0 #222,0 2px 4px rgba(0,0,0,.55)}
  .piece.b{color:#1b1b1e;text-shadow:1px 1px 0 #ddd,-1px 1px 0 #ddd,1px -1px 0 #ddd,-1px -1px 0 #ddd,0 2px 4px rgba(0,0,0,.55)}
  .panel{width:330px;background:linear-gradient(180deg,#1e212c,#171a24);border-radius:18px;padding:18px;
    border:1px solid rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:14px}
  .panel h1{font-size:17px;background:linear-gradient(90deg,#8ef0c8,#6cc6ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .status{background:#262a38;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.9}
  .status .row{display:flex;justify-content:space-between;gap:8px}
  .status .k{color:#8b90a8;font-size:12px}
  .status .v{font-weight:700;font-variant-numeric:tabular-nums}
  select,button{font-family:inherit;font-size:13px;border-radius:10px;border:1px solid rgba(255,255,255,.09);
    background:#2c3142;color:#e9eaf0;padding:9px 11px;cursor:pointer;transition:.15s}
  select:hover,button:hover{background:#363c50;border-color:rgba(255,255,255,.18)}
  button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(135deg,#2f9e79,#1f7a5c);border-color:#2f9e79;font-weight:700;grid-column:span 2}
  button.primary:hover{background:linear-gradient(135deg,#36b48b,#258c6a)}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls label{font-size:11px;color:#8b90a8;display:block;margin-bottom:4px}
  .moves{background:#15171f;border-radius:12px;padding:10px;height:210px;overflow-y:auto;
    font-size:13px;font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.06)}
  .moves .mv{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:3px 4px;border-radius:6px}
  .moves .mv:nth-child(odd){background:rgba(255,255,255,.025)}
  .moves .num{color:#727892;font-size:12px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:9999;color:#8ef0c8;font-size:16px;font-weight:700;
    text-align:center;padding:24px;line-height:1.8}
  .overlay.off{display:none}
  .overlay .err{color:#ff8a94;font-size:14px;font-weight:400;max-width:520px;margin-top:14px;direction:ltr;text-align:left;background:rgba(255,93,108,.08);padding:12px;border-radius:8px;border:1px solid rgba(255,93,108,.3);white-space:pre-wrap}
  .promo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
  .promo.on{display:flex}
  .promo .box{background:#232735;padding:18px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.1);text-align:center}
  .promo .box p{font-size:13px;color:#9aa0b8;margin-bottom:12px}
  .promo .opts{display:flex;gap:10px}
  .promo .opts div{width:64px;height:64px;border-radius:12px;background:#2f3547;display:flex;
    align-items:center;justify-content:center;font-size:42px;cursor:pointer;
    font-family:'Segoe UI Symbol','Apple Symbols',sans-serif}
  .promo .opts div:hover{background:#3d465e}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  ⏳ جاري تحميل محرك WASM...
  <div id="overlayMsg"></div>
</div>

<div class="promo" id="promo">
  <div class="box">
    <p>اختر قطعة الترقية</p>
    <div class="opts" id="promoOpts"></div>
  </div>
</div>

<div class="app">
  <div class="board-outer">
    <div id="board">
      <div class="squares" id="squares"></div>
      <div class="pieces" id="pieces"></div>
    </div>
  </div>

  <aside class="panel">
    <h1>♛ محرك شطرنج WASM</h1>

    <div class="status">
      <div class="row"><span class="k">الدور</span><span class="v" id="turnTxt">—</span></div>
      <div class="row"><span class="k">التقييم</span><span class="v" id="evalTxt">0.00</span></div>
      <div class="row"><span class="k">العمق / العقد / الوقت</span><span class="v" id="depthTxt">—</span></div>
      <div class="row"><span class="k">الحالة</span><span class="v" id="stateTxt">—</span></div>
    </div>

    <div class="controls">
      <div>
        <label>العمق</label>
        <select id="depthSel">
          <option>4</option><option>5</option><option>6</option>
          <option>7</option><option selected>8</option><option>9</option>
          <option>10</option><option>11</option><option>12</option>
        </select>
      </div>
      <div>
        <label>الوقت</label>
        <select id="timeSel">
          <option value="1000">1s</option>
          <option value="3000" selected>3s</option>
          <option value="6000">6s</option>
          <option value="12000">12s</option>
          <option value="30000">30s</option>
          <option value="0">∞</option>
        </select>
      </div>
      <div>
        <label>أنا</label>
        <select id="sideSel">
          <option value="0" selected>الأبيض</option>
          <option value="1">الأسود</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="flipBtn">↻ اقلب</button>
      </div>
      <button class="primary" id="newBtn">لعبة جديدة</button>
      <button id="undoBtn" style="grid-column:span 2">↶ تراجع</button>
    </div>

    <div class="moves" id="moves"></div>
  </aside>
</div>

<script>
'use strict';

/* ============================================================
   1) WORKER — يحمّل chess.js / chess.wasm (non-modularized build)
   ============================================================ */
const CHESS_JS_URL = new URL('chess.js', window.location.href).href;

const workerCode = `
'use strict';
let M = null, ready = false;

// ضبط Module قبل importScripts
self.Module = {
  locateFile: function(path) {
    // لو الـbuild بيطلُب chess.wasm، رجّع الرابط المطلق
    return new URL(path, '${CHESS_JS_URL}').href;
  },
  print: function(t) { /* console.log(t); */ },
  printErr: function(t) { /* console.warn(t); */ },
  onRuntimeInitialized: function() {
    M = self.Module;
    try {
      M._engine_init();
      ready = true;
      self.postMessage({type:'ready'});
    } catch(e) {
      self.postMessage({type:'error', msg:'engine_init failed: ' + String(e)});
    }
  },
  onAbort: function(what) {
    self.postMessage({type:'error', msg:'WASM abort: ' + what});
  }
};

try {
  importScripts('${CHESS_JS_URL}');
} catch(e) {
  self.postMessage({type:'error', msg:'importScripts failed: ' + String(e)});
}

function cstr(s) {
  const bytes = new TextEncoder().encode(s + '\\0');
  const ptr = M._malloc(bytes.length);
  M.HEAPU8.set(bytes, ptr);
  return ptr;
}

self.onmessage = function(e) {
  const d = e.data;
  if (!ready) {
    self.postMessage({type:'error', id:d.id, msg:'engine not ready'});
    return;
  }
  try {
    if (d.cmd === 'set_fen') {
      const p = cstr(d.fen);
      M._engine_set_fen(p);
      M._free(p);
      self.postMessage({type:'ok', id:d.id});
    } else if (d.cmd === 'get_fen') {
      const p = M._engine_get_fen();
      self.postMessage({type:'fen', id:d.id, fen: M.UTF8ToString(p)});
    } else if (d.cmd === 'search') {
      const mv = M._engine_search(d.depth, d.timeLimit);
      const score = M._engine_get_score();
      const depth = M._engine_get_depth();
      const nodes = Number(M._engine_get_nodes());
      self.postMessage({type:'bestmove', id:d.id, move:mv, score, depth, nodes});
    } else if (d.cmd === 'legal_moves') {
      const n = M._engine_gen_legal_moves();
      const moves = [];
      for (let i = 0; i < n; i++) moves.push(M._engine_get_legal_move(i));
      self.postMessage({type:'legal_moves', id:d.id, moves});
    } else if (d.cmd === 'make_move') {
      M._engine_make_move(d.move);
      self.postMessage({type:'ok', id:d.id});
    } else if (d.cmd === 'unmake_move') {
      M._engine_unmake_move();
      self.postMessage({type:'ok', id:d.id});
    } else if (d.cmd === 'move_to_san') {
      const p = M._engine_move_to_san(d.move);
      self.postMessage({type:'san', id:d.id, san: M.UTF8ToString(p)});
    } else if (d.cmd === 'game_status') {
      const s = M._engine_game_status();
      const side = M._engine_get_side();
      const half = M._engine_get_halfmove();
      const chk = M._engine_in_check();
      self.postMessage({type:'status', id:d.id, status:s, side, half, chk});
    } else if (d.cmd === 'perft') {
      const n = M._engine_perft(d.depth);
      self.postMessage({type:'perft', id:d.id, nodes:Number(n)});
    }
  } catch(err) {
    self.postMessage({type:'error', id:d.id, msg:String(err)});
  }
};
`;

const workerBlob = new Blob([workerCode], {type:'application/javascript'});
const workerURL = URL.createObjectURL(workerBlob);
const worker = new Worker(workerURL);

/* ============================================================
   2) REQUEST/RESPONSE
   ============================================================ */
let msgId = 0;
const pending = new Map();

worker.onmessage = (e) => {
  const d = e.data;
  if (d.type === 'ready') {
    document.getElementById('overlay').classList.add('off');
    initGame();
    return;
  }
  if (d.type === 'error') {
    console.error('Engine error:', d.msg);
    const ov = document.getElementById('overlay');
    ov.classList.remove('off');
    ov.innerHTML = '❌ فشل تحميل المحرك<div class="err">' + d.msg + '</div>';
    return;
  }
  const cb = pending.get(d.id);
  if (cb) { pending.delete(d.id); cb(d); }
};

worker.onerror = (e) => {
  console.error('Worker error:', e);
  const ov = document.getElementById('overlay');
  ov.classList.remove('off');
  ov.innerHTML = '❌ Worker error<div class="err">' + (e.message || JSON.stringify(e)) + '</div>';
};

function ask(cmd, extra = {}) {
  const id = ++msgId;
  return new Promise(resolve => {
    pending.set(id, resolve);
    worker.postMessage({cmd, id, ...extra});
  });
}

/* ============================================================
   3) UI STATE
   ============================================================ */
const $ = id => document.getElementById(id);
const boardEl = $('board');
const squaresEl = $('squares');
const piecesEl = $('pieces');
const movesEl = $('moves');
const turnTxt = $('turnTxt');
const evalTxt = $('evalTxt');
const depthTxt = $('depthTxt');
const stateTxt = $('stateTxt');
const depthSel = $('depthSel');
const timeSel = $('timeSel');
const sideSel = $('sideSel');
const overlay = $('overlay');
const promoEl = $('promo');
const promoOpts = $('promoOpts');

const GLYPH = {1:'♟',2:'♞',3:'♝',4:'♜',5:'♛',6:'♚'};
const FILES = 'abcdefgh';

let flipped = false;
let humanColor = 0;
let boardState = new Int8Array(64);
let sideToMove = 0;
let selected = -1;
let legalFromSelected = [];
let allLegal = [];
let sanList = [];
let lastMove = null;
let thinking = false;
let gameOver = false;
let pliesPlayed = 0;
let kingSq = [-1, -1];
let inCheckFlag = false;

const mFrom = m => m & 63;
const mTo = m => (m >> 6) & 63;
const mPromo = m => (m >> 12) & 7;
const mFlag = m => (m >> 15) & 7;

function moveToUci(m) {
  const from = mFrom(m), to = mTo(m), p = mPromo(m);
  let s = FILES[from & 7] + (8 - (from >> 3)) + FILES[to & 7] + (8 - (to >> 3));
  if (p) s += '--nbrq'[p];
  return s;
}

function transform(i) {
  const f = i & 7, r = i >> 3;
  const df = flipped ? 7 - f : f;
  const dr = flipped ? 7 - r : r;
  return `translate(${df * 100}%,${dr * 100}%)`;
}

/* ============================================================
   4) BUILD BOARD (once)
   ============================================================ */
function buildBoard() {
  squaresEl.innerHTML = '';
  for (let i = 0; i < 64; i++) {
    const sq = document.createElement('div');
    sq.className = 'sq ' + ((((i >> 3) + (i & 7)) % 2) ? 'dark' : 'light');
    sq.style.transform = transform(i);
    sq.dataset.sq = i;
    sq.addEventListener('click', () => onSquareClick(i));
    squaresEl.appendChild(sq);
  }
}

/* ============================================================
   5) REFRESH from engine
   ============================================================ */
async function refreshBoard() {
  const fenR = await ask('get_fen');
  const fen = fenR.fen;
  const parts = fen.split(' ');
  const placement = parts[0];
  sideToMove = parts[1] === 'b' ? 1 : 0;

  boardState.fill(0);
  kingSq = [-1, -1];
  let idx = 0;
  for (const ch of placement) {
    if (ch === '/') continue;
    if (ch >= '1' && ch <= '8') idx += +ch;
    else {
      const color = ch === ch.toUpperCase() ? 0 : 1;
      const type = ' PNBRQK'.indexOf(ch.toUpperCase());
      const p = type | (color << 3);
      boardState[idx] = p;
      if (type === 6) kingSq[color] = idx;
      idx++;
    }
  }

  const stR = await ask('game_status');
  inCheckFlag = stR.chk === 1;

  const mvR = await ask('legal_moves');
  allLegal = mvR.moves;

  renderPieces();
  renderHighlights();
  turnTxt.textContent = sideToMove === 0 ? 'دور الأبيض' : 'دور الأسود';
  updateStatusText(stR);
}

function renderPieces() {
  piecesEl.innerHTML = '';
  for (let i = 0; i < 64; i++) {
    const p = boardState[i];
    if (!p) continue;
    const type = p & 7, color = p >> 3;
    const el = document.createElement('div');
    el.className = 'piece ' + (color === 0 ? 'w' : 'b');
    el.textContent = GLYPH[type];
    el.style.transform = transform(i);
    piecesEl.appendChild(el);
  }
}

function renderHighlights() {
  const sqs = squaresEl.children;
  for (let i = 0; i < 64; i++) {
    sqs[i].className = 'sq ' + ((((i >> 3) + (i & 7)) % 2) ? 'dark' : 'light');
  }
  if (lastMove !== null) {
    sqs[mFrom(lastMove)].classList.add('last');
    sqs[mTo(lastMove)].classList.add('last');
  }
  if (inCheckFlag && kingSq[sideToMove] >= 0) {
    sqs[kingSq[sideToMove]].classList.add('check');
  }
  if (selected >= 0) {
    sqs[selected].classList.add('sel');
    for (const m of legalFromSelected) {
      const to = mTo(m);
      sqs[to].classList.add('tgt');
      if (boardState[to] !== 0 || mFlag(m) === 2) sqs[to].classList.add('cap');
    }
  }
}

function updateStatusText(stR) {
  if (gameOver) return;
  if (stR.status === 1) { stateTxt.textContent = 'كش مات'; gameOver = true; }
  else if (stR.status === 2) { stateTxt.textContent = 'جمود (تعادل)'; gameOver = true; }
  else if (stR.status === 3) { stateTxt.textContent = 'تعادل 50 نقلة'; gameOver = true; }
  else if (stR.status === 4) { stateTxt.textContent = 'تعادل تكرار'; gameOver = true; }
  else if (stR.status === 5) { stateTxt.textContent = 'تعادل مادة'; gameOver = true; }
  else if (inCheckFlag) { stateTxt.textContent = 'كش!'; }
  else { stateTxt.textContent = thinking ? 'المحرك يفكر...' : 'جاهز'; }
}

/* ============================================================
   6) PLAYER INTERACTION
   ============================================================ */
async function onSquareClick(sq) {
  if (thinking || gameOver) return;
  if (sideToMove !== humanColor) return;

  const p = boardState[sq];

  // If clicking own piece → select
  if (p && (p >> 3) === humanColor) {
    selected = sq;
    legalFromSelected = allLegal.filter(m => mFrom(m) === sq);
    renderHighlights();
    return;
  }

  // If something selected and clicking elsewhere → try move
  if (selected >= 0) {
    const matches = legalFromSelected.filter(m => mTo(m) === sq);
    if (matches.length === 0) {
      selected = -1;
      legalFromSelected = [];
      renderHighlights();
      return;
    }
    // Promotion?
    if (matches.length > 1 && matches[0] && mPromo(matches[0])) {
      showPromo(matches);
      return;
    }
    await playMove(matches[0]);
  }
}

async function playMove(m) {
  // SAN must be computed BEFORE making the move
  const sanR = await ask('move_to_san', {move: m});
  const san = sanR.san;

  await ask('make_move', {move: m});
  pliesPlayed++;
  lastMove = m;
  sanList.push(san);
  selected = -1;
  legalFromSelected = [];
  renderMoves();

  await refreshBoard();

  if (!gameOver && sideToMove !== humanColor) {
    await engineTurn();
  }
}

async function engineTurn() {
  if (gameOver) return;
  thinking = true;
  stateTxt.textContent = 'المحرك يفكر...';

  const depth = parseInt(depthSel.value, 10);
  const tl = parseInt(timeSel.value, 10);

  const t0 = performance.now();
  const r = await ask('search', {depth, timeLimit: tl});
  const ms = Math.round(performance.now() - t0);

  thinking = false;

  if (!r.move) { await refreshBoard(); return; }

  const scoreWhite = sideToMove === 0 ? r.score : -r.score;
  if (Math.abs(scoreWhite) > 90000) {
    evalTxt.textContent = scoreWhite > 0 ? 'مات للأبيض' : 'مات للأسود';
  } else {
    evalTxt.textContent = (scoreWhite > 0 ? '+' : '') + (scoreWhite / 100).toFixed(2);
  }
  depthTxt.textContent = `${r.depth} / ${r.nodes.toLocaleString('en-US')} / ${ms}ms`;

  const sanR = await ask('move_to_san', {move: r.move});
  await ask('make_move', {move: r.move});
  pliesPlayed++;
  lastMove = r.move;
  sanList.push(sanR.san);
  renderMoves();
  await refreshBoard();
}

function showPromo(matches) {
  promoOpts.innerHTML = '';
  const order = [5, 4, 3, 2]; // Q R B N
  for (const t of order) {
    const el = document.createElement('div');
    el.textContent = GLYPH[t];
    el.style.color = humanColor === 0 ? '#fff' : '#1b1b1e';
    el.addEventListener('click', async () => {
      const chosen = matches.find(m => mPromo(m) === t);
      promoEl.classList.remove('on');
      if (chosen) await playMove(chosen);
    });
    promoOpts.appendChild(el);
  }
  promoEl.classList.add('on');
}

function renderMoves() {
  movesEl.innerHTML = '';
  for (let i = 0; i < sanList.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'mv';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = (i / 2 + 1) + '.';
    row.appendChild(num);
    const w = document.createElement('span');
    w.textContent = sanList[i] || '';
    row.appendChild(w);
    const b = document.createElement('span');
    b.textContent = sanList[i + 1] || '';
    row.appendChild(b);
    movesEl.appendChild(row);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

/* ============================================================
   7) BUTTONS
   ============================================================ */
$('newBtn').addEventListener('click', async () => {
  await ask('set_fen', {fen:'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'});
  humanColor = parseInt(sideSel.value, 10);
  sanList = [];
  lastMove = null;
  selected = -1;
  legalFromSelected = [];
  gameOver = false;
  pliesPlayed = 0;
  evalTxt.textContent = '0.00';
  depthTxt.textContent = '—';
  renderMoves();
  await refreshBoard();
  if (sideToMove !== humanColor) await engineTurn();
});

$('undoBtn').addEventListener('click', async () => {
  if (pliesPlayed < 2) return;
  await ask('unmake_move');
  await ask('unmake_move');
  pliesPlayed -= 2;
  sanList.splice(-2);
  lastMove = null;
  selected = -1;
  legalFromSelected = [];
  gameOver = false;
  renderMoves();
  await refreshBoard();
});

$('flipBtn').addEventListener('click', async () => {
  flipped = !flipped;
  buildBoard();
  await refreshBoard();
});

/* ============================================================
   8) STARTUP
   ============================================================ */
async function initGame() {
  buildBoard();
  humanColor = parseInt(sideSel.value, 10);
  await refreshBoard();
}

   9) PERFT TEST
   ============================================================ */
window.perft = async (d) => {
  const r = await ask('perft', {depth: d});
  console.log(`perft(${d}) = ${r.nodes.toLocaleString('en-US')}`);
  return r.nodes;
};
</script>
