<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>WASM Test</title></head>
<body>
<h1>WASM Test</h1>
<pre id="out">Loading...</pre>
<script>
window.Module = {
  locateFile: (path) => new URL(path, location.href).href,
  onRuntimeInitialized: function() {
    const lines = [];
    lines.push('Module loaded!');
    lines.push('typeof _engine_init: ' + typeof Module._engine_init);
    lines.push('typeof _engine_search: ' + typeof Module._engine_search);
    if (typeof Module._engine_init === 'function') {
      Module._engine_init();
      const p = Module._engine_get_fen();
      lines.push('FEN: ' + Module.UTF8ToString(p));
      // perft test
      const n = Module._engine_perft(5);
      lines.push('perft(5) = ' + n);
    } else {
      lines.push('ENGINE FUNCTIONS MISSING — rebuild needed');
      lines.push('Keys: ' + Object.keys(Module).filter(k=>k.startsWith('_')).join(', '));
    }
    document.getElementById('out').textContent = lines.join('\n');
  },
  onAbort: (x) => { document.getElementById('out').textContent = 'ABORT: ' + x; }
};
</script>
<script src="chess.js"></script>
</body>
</html>
