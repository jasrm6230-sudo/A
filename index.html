<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>شطرنج ضد الحاسوب</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<style>
:root{
  --bg:#1a1a2e; --panel:#16213e; --light:#f0d9b5; --dark:#b58863;
  --accent:#e2b714; --danger:#e74c3c; --text:#eee; --muted:#888;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#1a1a2e 0%,#0f1729 100%);
  color:var(--text);min-height:100vh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;-webkit-user-select:none;overflow-x:hidden;
}
#loader{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;gap:16px;padding:20px;text-align:center;
}
.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader h2{margin:0;font-size:1.3em;font-weight:500}
#load-status{margin:0;color:var(--muted);font-size:.9em;min-height:1.2em}
#error{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;padding:20px;text-align:center;gap:16px}
#error h2{color:var(--danger);margin:0}
#error pre{background:#000;color:#f88;padding:12px;border-radius:8px;max-width:92vw;
  overflow:auto;font-size:.75em;text-align:left;direction:ltr;white-space:pre-wrap;
  word-break:break-all;max-height:60vh}
#app{display:none;flex-direction:column;align-items:center;padding:10px;gap:8px;
  max-width:560px;margin:0 auto;width:100%}
#header{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
#header h1{margin:0;font-size:1.05em;font-weight:500;color:var(--accent)}
.captures{display:flex;align-items:center;width:100%;min-height:26px;padding:0 4px;
  font-size:20px;line-height:1;gap:1px;flex-wrap:wrap}
.captures .p{font-size:20px;line-height:1}
.captures .w{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000}
.captures .b{color:#111;text-shadow:0 0 2px #aaa}
.captures .adv{margin-inline-start:auto;font-size:.75em;color:var(--accent);font-weight:600;padding:0 6px}
#board-wrap{position:relative;width:min(94vw,520px);aspect-ratio:1;border-radius:8px;
  overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:100%;height:100%}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.light{background:var(--light)}
.sq.dark{background:var(--dark)}
.sq .coord{position:absolute;font-size:10px;font-weight:700;opacity:.55;pointer-events:none}
.sq .coord.file{bottom:2px;right:4px}
.sq .coord.rank{top:2px;left:4px}
.sq.light .coord{color:var(--dark)}
.sq.dark .coord{color:var(--light)}
.piece{font-size:min(9vw,46px);line-height:1;pointer-events:none;position:relative;z-index:2;
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans",sans-serif}
.piece.w{color:#fff;text-shadow:0 1px 0 #444,0 0 3px rgba(0,0,0,.8),1px 1px 0 #333,-1px 0 0 #333,0 -1px 0 #333,1px 0 0 #333,0 1px 0 #333}
.piece.b{color:#1a1a1a;text-shadow:0 1px 0 #777,0 0 3px rgba(255,255,255,.4)}
.sq.sel{background:var(--accent)!important}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(226,183,20,.35);pointer-events:none;z-index:1}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;
  background:rgba(20,120,20,.55);pointer-events:none;z-index:3}
.sq.hint-cap::after{content:"";position:absolute;inset:6%;border-radius:50%;
  border:5px solid rgba(200,30,30,.75);pointer-events:none;z-index:3}
.sq.check{background:radial-gradient(circle,var(--danger) 20%,transparent 70%)!important}
.status-bar{display:flex;align-items:center;gap:8px;background:var(--panel);
  padding:8px 12px;border-radius:8px;font-size:.85em;width:100%;justify-content:center;min-height:36px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.dot.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.btn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:10px 6px;font-size:.85em;font-family:inherit;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.btn:hover{background:#1e2a4a;border-color:var(--accent)}
.btn:active{transform:scale(.96)}
#level{appearance:none;-webkit-appearance:none;text-align:center;padding:10px 4px}
#move-list{width:100%;background:var(--panel);border-radius:8px;padding:8px;
  max-height:140px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:.82em}
#move-list:empty::before{content:"لا توجد نقلات بعد";color:var(--muted);
  display:block;text-align:center;padding:8px}
.move-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;padding:3px 6px;border-radius:4px}
.move-row:nth-child(odd){background:rgba(255,255,255,.03)}
.move-num{color:var(--muted);font-weight:600}
.move-cell{padding:2px 6px;border-radius:4px}
.move-cell.current{background:var(--accent);color:#000;font-weight:700}
#info{font-size:.72em;color:var(--muted);text-align:center;min-height:1em;direction:ltr}
#promo,#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
  align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
#promo.show,#modal.show{display:flex}
.promo-box{background:var(--panel);border-radius:12px;padding:16px;display:flex;gap:8px;
  box-shadow:0 16px 48px rgba(0,0,0,.6)}
.promo-btn{width:58px;height:58px;background:var(--light);border:2px solid var(--dark);
  border-radius:8px;cursor:pointer;font-size:42px;display:flex;align-items:center;
  justify-content:center;color:#fff;text-shadow:0 1px 0 #444,0 0 3px rgba(0,0,0,.7);
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;transition:transform .15s}
.promo-btn:hover{transform:scale(1.1);border-color:var(--accent)}
.modal-box{background:var(--panel);border-radius:16px;padding:24px;text-align:center;
  max-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{margin:0 0 8px;color:var(--accent);font-size:1.4em}
.modal-box p{margin:0 0 16px;color:var(--muted)}
.modal-box button{width:100%}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <h2>جاري تحميل محرك الشطرنج</h2>
  <p id="load-status">تهيئة...</p>
</div>

<div id="error">
  <h2>⚠️ خطأ في التحميل</h2>
  <pre id="error-msg"></pre>
  <button class="btn" onclick="location.reload()">إعادة المحاولة</button>
</div>

<div id="app">
  <div id="header">
    <h1>♞ شطرنج ضد الحاسوب</h1>
    <button class="btn" id="btn-new-top" style="padding:6px 10px">🔄 جديد</button>
  </div>

  <div class="captures" id="cap-top"></div>
  <div id="board-wrap"><div id="board"></div></div>
  <div class="captures" id="cap-bot"></div>

  <div class="status-bar">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">جاري التحضير...</span>
  </div>

  <div id="controls">
    <button class="btn" id="btn-new">🔄 جديد</button>
    <button class="btn" id="btn-undo">↶ تراجع</button>
    <button class="btn" id="btn-flip">⇅ قلب</button>
    <select class="btn" id="level">
      <option value="1">سهل</option>
      <option value="3">متوسط</option>
      <option value="5" selected>جيد</option>
      <option value="7">قوي</option>
      <option value="9">خبير</option>
    </select>
  </div>

  <div id="move-list"></div>
  <div id="info"></div>
</div>

<div id="promo"><div class="promo-box" id="promo-box"></div></div>

<div id="modal">
  <div class="modal-box">
    <h2 id="modal-title">انتهت اللعبة</h2>
    <p id="modal-sub"></p>
    <button class="btn" id="modal-btn">لعبة جديدة</button>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var loadStatus = $('load-status');
var errorBox = $('error');
var errorMsg = $('error-msg');

function fatal(msg){
  console.error('[fatal]', msg);
  $('loader').style.display = 'none';
  errorBox.style.display = 'flex';
  errorMsg.textContent = String(msg && msg.stack ? msg.stack : msg);
}
function step(msg){ loadStatus.textContent = msg; console.log('[loader]', msg); }

window.addEventListener('error', function(e){ fatal(e.error || e.message); });
window.addEventListener('unhandledrejection', function(e){ fatal(e.reason); });

var GLYPH = { P:'\u2659\uFE0E', N:'\u2658\uFE0E', B:'\u2657\uFE0E', R:'\u2656\uFE0E', Q:'\u2655\uFE0E', K:'\u2654\uFE0E',
              p:'\u265F\uFE0E', n:'\u265E\uFE0E', b:'\u265D\uFE0E', r:'\u265C\uFE0E', q:'\u265B\uFE0E', k:'\u265A\uFE0E' };
var PIECE_VALUE = {p:1,n:3,b:3,r:5,q:9,k:0};
var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

var state = {
  flipped:false, selected:-1, legalFromSel:[], lastMove:null,
  busy:false, gameOver:false, history:[]
};

// ========== LOAD ENGINE ==========
(function boot(){
  step('تحميل engine.js...');
  if (typeof createEngine !== 'function'){
    return fatal('createEngine غير موجود. تأكد أن engine.js محمّل بشكل صحيح قبل هذا السكربت.');
  }
  step('تشغيل WASM...');
  createEngine().then(function(Module){
    window.Module = Module;
    console.log('[engine] loaded');
    step('تهيئة المحرك...');
    if (typeof Module._engine_init !== 'function'){
      return fatal('engine_init غير موجود. تحقق من EXPORTED_FUNCTIONS في أمر البناء.');
    }
    Module._engine_init();
    Module._engine_set_silent(1);
    step('اختبار المحرك...');
    var fen = Module.UTF8ToString(Module._engine_get_fen());
    console.log('[engine] FEN:', fen);
    if (!fen || fen.length < 20) return fatal('FEN غير صالح: ' + fen);
    var nMoves = Module._engine_gen_legal();
    console.log('[engine] legal moves:', nMoves);
    if (nMoves < 20) return fatal('عدد النقلات غير متوقع: ' + nMoves);
    step('جاهز!');
    setTimeout(function(){
      $('loader').style.display = 'none';
      $('app').style.display = 'flex';
      startGame();
    }, 250);
  }).catch(fatal);
})();

// ========== HELPERS ==========
function fenToGrid(fen){
  var g = new Array(64); for (var i=0;i<64;i++) g[i]=null;
  var rows = fen.split(' ')[0].split('/');
  for (var r=0;r<8;r++){
    var f=0, row = rows[7-r];
    for (var k=0;k<row.length;k++){
      var c = row[k];
      if (c>='1' && c<='8') f += +c;
      else { g[r*8+f] = c; f++; }
    }
  }
  return g;
}

function buildBoard(){
  var boardEl = $('board');
  boardEl.innerHTML = '';
  for (var vr=0; vr<8; vr++){
    for (var vf=0; vf<8; vf++){
      var r,f;
      if (state.flipped){ r=vr; f=7-vf; } else { r=7-vr; f=vf; }
      var sq = r*8 + f;
      var el = document.createElement('div');
      el.className = 'sq ' + ((f+r)%2===1 ? 'light' : 'dark');
      el.dataset.sq = sq;
      if (vf===7){
        var cf = document.createElement('span');
        cf.className = 'coord file';
        cf.textContent = 'abcdefgh'[f];
        el.appendChild(cf);
      }
      if (vf===0){
        var cr = document.createElement('span');
        cr.className = 'coord rank';
        cr.textContent = (r+1);
        el.appendChild(cr);
      }
      (function(sq){ el.addEventListener('click', function(){ onClickSquare(sq); }); })(sq);
      boardEl.appendChild(el);
    }
  }
}

function render(){
  var M = window.Module; if (!M) return;
  var fen = M.UTF8ToString(M._engine_get_fen());
  var grid = fenToGrid(fen);
  var side = M._engine_get_side();
  var inChk = M._engine_in_check();
  var st = M._engine_game_status();

  var kingSq = -1;
  if (inChk){
    for (var s=0;s<64;s++){
      var p = grid[s];
      if ((side===0 && p==='K') || (side===1 && p==='k')){ kingSq=s; break; }
    }
  }

  var dests = new Set();
  for (var i=0;i<state.legalFromSel.length;i++)
    dests.add(M._engine_move_to(state.legalFromSel[i]));

  var boardEl = $('board');
  for (var j=0;j<64;j++){
    var el = boardEl.children[j];
    var sq = +el.dataset.sq;
    var pp = grid[sq];
    el.classList.remove('sel','hint','hint-cap','last','check');
    if (dests.has(sq)) el.classList.add(pp ? 'hint-cap' : 'hint');
    if (sq === state.selected) el.classList.add('sel');
    if (state.lastMove && (sq===state.lastMove.from || sq===state.lastMove.to))
      el.classList.add('last');
    if (sq === kingSq) el.classList.add('check');
    var old = el.querySelector('.piece'); if (old) old.remove();
    if (pp){
      var span = document.createElement('span');
      var isW = pp === pp.toUpperCase();
      span.className = 'piece ' + (isW ? 'w' : 'b');
      span.textContent = GLYPH[pp];
      el.appendChild(span);
    }
  }

  renderCaptures(grid);
  updateStatus(st, side, inChk);
}

function renderCaptures(grid){
  var init = {p:8,n:2,b:2,r:2,q:1};
  var curW = {p:0,n:0,b:0,r:0,q:0};
  var curB = {p:0,n:0,b:0,r:0,q:0};
  for (var i=0;i<64;i++){
    var p = grid[i]; if (!p) continue;
    var t = p.toLowerCase();
    if (t === 'k') continue;
    if (p === p.toUpperCase()) curW[t]++; else curB[t]++;
  }
  var capturedByW = {}, capturedByB = {};
  ['q','r','b','n','p'].forEach(function(t){
    var w = init[t] - curB[t]; if (w>0) capturedByW[t]=w;
    var b = init[t] - curW[t]; if (b>0) capturedByB[t]=b;
  });
  var build = function(cap, upper){
    var html='';
    ['q','r','b','n','p'].forEach(function(t){
      if (!cap[t]) return;
      for (var i=0;i<cap[t];i++){
        var g = upper ? GLYPH[t.toUpperCase()] : GLYPH[t];
        var cls = upper ? 'w' : 'b';
        html += '<span class="p '+cls+'">'+g+'</span>';
      }
    });
    return html;
  };
  var wVal=0, bVal=0;
  for (var t1 in capturedByW) wVal += PIECE_VALUE[t1]*capturedByW[t1];
  for (var t2 in capturedByB) bVal += PIECE_VALUE[t2]*capturedByB[t2];
  var d = wVal - bVal;
  $('cap-top').innerHTML = build(capturedByW, false) + '<span class="adv">' + (d>0?'+'+d:'') + '</span>';
  $('cap-bot').innerHTML = build(capturedByB, true);
}

function updateStatus(st, side, inChk){
  var text = $('status-text');
  var dot = $('status-dot');
  dot.classList.remove('pulse');
  if (st === 1){
    var winner = side === 0 ? 'الأسود' : 'الأبيض';
    text.textContent = 'كش مات! ' + winner + ' فاز';
    state.gameOver = true;
    showModal('كش مات!', winner + ' فاز');
  } else if (st === 2){
    text.textContent = 'تعادل — لا توجد نقلات';
    state.gameOver = true; showModal('تعادل','لا توجد نقلات قانونية');
  } else if (st === 3){
    text.textContent = 'تعادل — قاعدة 50 نقلة';
    state.gameOver = true; showModal('تعادل','قاعدة 50 نقلة');
  } else if (st === 4){
    text.textContent = 'تعادل — تكرار 3 مرات';
    state.gameOver = true; showModal('تعادل','تكرار الوضعية');
  } else if (inChk){
    text.textContent = side === 0 ? 'أنت في كش!' : 'الحاسوب في كش!';
  } else if (state.busy){
    text.textContent = 'الحاسوب يفكر...';
    dot.classList.add('pulse');
  } else if (side === 0){
    text.textContent = 'دورك — العب بالأبيض';
  } else {
    text.textContent = 'دور الحاسوب';
  }
}

function showModal(title, sub){
  $('modal-title').textContent = title;
  $('modal-sub').textContent = sub || '';
  $('modal').classList.add('show');
}

// ========== INTERACTION ==========
function onClickSquare(sq){
  var M = window.Module;
  if (!M || state.busy || state.gameOver) return;
  if (M._engine_get_side() !== 0) return;

  if (state.selected >= 0){
    for (var i=0;i<state.legalFromSel.length;i++){
      var m = state.legalFromSel[i];
      if (M._engine_move_to(m) === sq){
        if (M._engine_move_promo(m)) showPromotion(m);
        else playMove(m);
        return;
      }
    }
  }
  var fen = M.UTF8ToString(M._engine_get_fen());
  var grid = fenToGrid(fen);
  var p = grid[sq];
  if (!p || p !== p.toUpperCase()){
    state.selected = -1; state.legalFromSel = []; render(); return;
  }
  var n = M._engine_gen_legal();
  var arr = [];
  for (var j=0;j<n;j++){
    var mm = M._engine_get_legal(j);
    if (M._engine_move_from(mm) === sq) arr.push(mm);
  }
  state.selected = sq; state.legalFromSel = arr; render();
}

function showPromotion(m){
  var box = $('promo-box');
  box.innerHTML = '';
  var opts = [['q','\u2655\uFE0E',4], ['r','\u2656\uFE0E',3], ['b','\u2657\uFE0E',2], ['n','\u2658\uFE0E',1]];
  for (var i=0;i<opts.length;i++){
    (function(t, g, v){
      var btn = document.createElement('button');
      btn.className = 'promo-btn';
      btn.textContent = g;
      btn.addEventListener('click', function(){
        $('promo').classList.remove('show');
        var M = window.Module;
        for (var k=0;k<state.legalFromSel.length;k++){
          var cand = state.legalFromSel[k];
          if (M._engine_move_from(cand) === M._engine_move_from(m) &&
              M._engine_move_to(cand) === M._engine_move_to(m) &&
              M._engine_move_promo(cand) === v){
            playMove(cand); return;
          }
        }
        playMove(m);
      });
      box.appendChild(btn);
    })(opts[i][0], opts[i][1], opts[i][2]);
  }
  $('promo').classList.add('show');
}

function moveToSAN(M, m, gridBefore){
  var from = M._engine_move_from(m), to = M._engine_move_to(m);
  var promo = M._engine_move_promo(m);
  var piece = gridBefore[from];
  if (!piece) return '?';
  var t = piece.toLowerCase();
  var cap = gridBefore[to] !== null;
  var toSq = 'abcdefgh'[to&7] + ((to>>3)+1);
  if (t === 'k' && Math.abs((to&7)-(from&7)) === 2)
    return ((to&7) > (from&7)) ? 'O-O' : 'O-O-O';
  var san = '';
  if (t === 'p'){
    san = cap ? ('abcdefgh'[from&7] + 'x' + toSq) : toSq;
    if (promo) san += '=' + ['','N','B','R','Q'][promo];
  } else {
    san = piece.toUpperCase() + (cap ? 'x' : '') + toSq;
  }
  return san;
}

function playMove(m){
  var M = window.Module;
  var fenBefore = M.UTF8ToString(M._engine_get_fen());
  var gridBefore = fenToGrid(fenBefore);
  var san = moveToSAN(M, m, gridBefore);
  M._engine_make(m);
  state.lastMove = {from:M._engine_move_from(m), to:M._engine_move_to(m)};
  state.selected = -1; state.legalFromSel = [];
  state.history.push({san:san, fen:M.UTF8ToString(M._engine_get_fen())});
  render(); updateMoveList();
  if (M._engine_game_status() !== 0){ render(); return; }
  scheduleAI();
}

function updateMoveList(){
  var el = $('move-list');
  el.innerHTML = '';
  for (var i=0;i<state.history.length;i+=2){
    var row = document.createElement('div');
    row.className = 'move-row';
    var num = document.createElement('span');
    num.className = 'move-num';
    num.textContent = (i/2+1) + '.';
    var w = document.createElement('span');
    w.className = 'move-cell';
    w.textContent = state.history[i].san;
    var b = document.createElement('span');
    b.className = 'move-cell';
    b.textContent = state.history[i+1] ? state.history[i+1].san : '';
    if (i === state.history.length-1) w.classList.add('current');
    if (i+1 === state.history.length-1) b.classList.add('current');
    row.appendChild(num); row.appendChild(w); row.appendChild(b);
    el.appendChild(row);
  }
  el.scrollTop = el.scrollHeight;
}

function scheduleAI(){
  if (state.gameOver) return;
  state.busy = true; render();
  setTimeout(function(){ requestAnimationFrame(function(){ setTimeout(runAI, 20); }); }, 30);
}

function runAI(){
  var M = window.Module;
  try {
    var level = +$('level').value;
    var depth = level;
    var timeMs = Math.min(3000, level*350);
    var fenBefore = M.UTF8ToString(M._engine_get_fen());
    var gridBefore = fenToGrid(fenBefore);
    var t0 = performance.now();
    var m = M._engine_search(depth, timeMs);
    var elapsed = Math.round(performance.now() - t0);
    if (m === 0){ state.busy = false; render(); return; }
    var san = moveToSAN(M, m, gridBefore);
    M._engine_make(m);
    state.lastMove = {from:M._engine_move_from(m), to:M._engine_move_to(m)};
    state.history.push({san:san, fen:M.UTF8ToString(M._engine_get_fen())});
    $('info').textContent = 'depth ' + M._engine_get_depth()
      + ' | score ' + M._engine_get_score()
      + ' | nodes ' + M._engine_get_nodes()
      + ' | time ' + elapsed + 'ms';
    state.busy = false;
    render(); updateMoveList();
  } catch(e){
    console.error(e); state.busy = false; render();
  }
}

// ========== BUTTONS ==========
function startGame(){
  var M = window.Module;
  M._engine_init();
  M._engine_set_silent(1);
  M._engine_set_fen(START);
  state.selected = -1; state.legalFromSel = [];
  state.lastMove = null; state.busy = false; state.gameOver = false;
  state.history = [];
  $('info').textContent = '';
  $('modal').classList.remove('show');
  buildBoard(); render(); updateMoveList();
}

$('btn-new').addEventListener('click', startGame);
$('btn-new-top').addEventListener('click', startGame);

$('btn-undo').addEventListener('click', function(){
  if (state.busy) return;
  var M = window.Module;
  if (state.history.length >= 2){
    M._engine_unmake(); M._engine_unmake();
    state.history.pop(); state.history.pop();
  } else if (state.history.length === 1){
    M._engine_unmake(); state.history.pop();
  } else return;
  state.selected = -1; state.legalFromSel = [];
  state.lastMove = null; state.gameOver = false;
  $('modal').classList.remove('show');
  render(); updateMoveList();
});

$('btn-flip').addEventListener('click', function(){
  state.flipped = !state.flipped;
  buildBoard(); render();
});

$('modal-btn').addEventListener('click', startGame);
$('board-wrap').addEventListener('contextmenu', function(e){ e.preventDefault(); });

})();
</script>
