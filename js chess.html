<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>محرك شطرنج احترافي — نسخة مُصلّحة نهائية</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--light:#f0d9b5;--dark:#b58863;--panel:#1e212c;--panel2:#262a38}
  html,body{min-height:100%}
  body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%,#2c3040,#0e0f15 65%);
    color:#e9eaf0;min-height:100vh;padding:18px;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .app{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;
    max-width:1200px;width:100%;margin:0 auto}
  .board-outer{position:relative;padding:26px;border-radius:18px;
    background:linear-gradient(145deg,#3b4055,#20232f);
    box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
  #board{position:relative;width:min(74vh,68vw,600px);aspect-ratio:1;border-radius:6px;overflow:hidden;
    direction:ltr;touch-action:none;
    box-shadow:0 0 0 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.55);
    user-select:none;-webkit-user-select:none}
  .sq{position:absolute;top:0;left:0;width:12.5%;height:12.5%}
  .sq.light{background:var(--light)}.sq.dark{background:var(--dark)}
  .sq.last::before{content:'';position:absolute;inset:0;background:rgba(255,236,80,.36);pointer-events:none}
  .sq.check::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle,rgba(255,45,45,.95),rgba(255,45,45,0) 72%)}
  .sq.sel::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:rgba(255,196,0,.48);box-shadow:inset 0 0 0 4px rgba(255,170,0,.95)}
  .sq.tgt::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;
    transform:translate(-50%,-50%);border-radius:50%;background:rgba(15,20,15,.34);pointer-events:none}
  .sq.tgt.cap::after{content:'';position:absolute;inset:7%;width:auto;height:auto;left:7%;top:7%;
    transform:none;border-radius:50%;background:transparent;border:6px solid rgba(15,20,15,.32);pointer-events:none}
  .pieces{position:absolute;inset:0;pointer-events:none}
  .piece{position:absolute;top:0;left:0;width:12.5%;height:12.5%;
    display:flex;align-items:center;justify-content:center;
    font-size:min(9.2vh,8.4vw,74px);line-height:1;will-change:transform;
    font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',sans-serif}
  .piece.w{color:#fff;text-shadow:0 0 1px #222,1px 1px 0 #2a2a2a,-1px 1px 0 #2a2a2a,1px -1px 0 #2a2a2a,-1px -1px 0 #2a2a2a,0 2px 4px rgba(0,0,0,.55)}
  .piece.b{color:#1b1b1e;text-shadow:0 0 1px #000,1px 1px 0 #d6d6d6,-1px 1px 0 #d6d6d6,1px -1px 0 #d6d6d6,-1px -1px 0 #d6d6d6,0 2px 4px rgba(0,0,0,.55)}
  .piece.drag{position:fixed;z-index:999;pointer-events:none;width:12.5%;height:12.5%;
    filter:drop-shadow(0 12px 14px rgba(0,0,0,.55))}
  .coords{position:absolute;pointer-events:none;font-size:11px;font-weight:700;color:#c8cbe0;opacity:.85}
  .cfile{display:flex;justify-content:space-around;left:26px;right:26px;height:14px;bottom:7px}
  .cfile span{width:12.5%;text-align:center}
  .crank{display:flex;flex-direction:column;justify-content:space-around;top:26px;bottom:26px;width:14px;right:7px}
  .crank span{height:12.5%;display:flex;align-items:center;justify-content:center}
  body.flip .crank{right:auto;left:7px}
  .panel{width:330px;background:linear-gradient(180deg,var(--panel),#171a24);border-radius:18px;padding:18px;
    border:1px solid rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:14px}
  .panel h1{font-size:17px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(90deg,#8ef0c8,#6cc6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:13px;
    border:1px solid rgba(255,255,255,.06);line-height:1.9}
  .status .row{display:flex;justify-content:space-between;gap:8px}
  .status .k{color:#8b90a8;font-size:12px}
  .status .v{font-weight:700;font-variant-numeric:tabular-nums}
  .turn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #333 inset,0 0 8px rgba(255,255,255,.3)}
  .dot.b{background:#1b1b1e;box-shadow:0 0 0 2px #ddd inset}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls label{font-size:11px;color:#8b90a8;display:block;margin-bottom:4px}
  .field{display:flex;flex-direction:column}
  select,button{font-family:inherit;font-size:13px;border-radius:10px;border:1px solid rgba(255,255,255,.09);
    background:#2c3142;color:#e9eaf0;padding:9px 11px;cursor:pointer;transition:.16s}
  select:hover,button:hover{background:#363c50;border-color:rgba(255,255,255,.18)}
  button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(135deg,#2f9e79,#1f7a5c);border-color:#2f9e79;font-weight:700;grid-column:span 2}
  button.primary:hover{background:linear-gradient(135deg,#36b48b,#258c6a)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .moves{background:#15171f;border-radius:12px;padding:10px;height:210px;overflow-y:auto;
    font-size:13px;border:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
  .moves .mv{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:3px 4px;border-radius:6px}
  .moves .mv:nth-child(odd){background:rgba(255,255,255,.025)}
  .moves .num{color:#727892;font-size:12px}
  .moves .san{padding:1px 6px;border-radius:5px}
  .moves .san.last{background:rgba(127,209,174,.18);color:#9ff0cd}
  .moves::-webkit-scrollbar{width:8px}
  .moves::-webkit-scrollbar-thumb{background:#3a4055;border-radius:4px}
  .promo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(3px)}
  .promo.on{display:flex}
  .promo .box{background:#232735;padding:18px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 70px rgba(0,0,0,.7);text-align:center}
  .promo .box p{font-size:13px;color:#9aa0b8;margin-bottom:12px}
  .promo .opts{display:flex;gap:10px}
  .promo .opts div{width:64px;height:64px;border-radius:12px;background:#2f3547;display:flex;
    align-items:center;justify-content:center;font-size:42px;cursor:pointer;transition:.15s;
    font-family:'Segoe UI Symbol','Apple Symbols',sans-serif}
  .promo .opts div:hover{background:#3d465e;transform:translateY(-3px)}
  .pgn-box{background:var(--panel2);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px}
  .pgn-box label{font-size:11px;color:#8b90a8;display:block}
  .pgn-box textarea{width:100%;background:#15171f;color:#e9eaf0;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical;min-height:70px;direction:ltr;text-align:left}
  .pgn-box textarea:focus{outline:none;border-color:#6cc6ff}
  .pgn-row{display:flex;gap:6px}
  .pgn-row select,.pgn-row button{flex:1}
  .pgn-hint{font-size:10px;color:#727892;line-height:1.4}
  @media (max-width:820px){.panel{width:min(94vw,420px)}#board{width:min(88vw,520px)}}
</style>
</head>
<body>

<div class="app">
  <div class="board-outer">
    <div id="board">
      <div class="squares" id="squares"></div>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="coords cfile" id="cfile"></div>
    <div class="coords crank" id="crank"></div>
  </div>

  <aside class="panel">
    <h1>♛ محرك شطرنج — نسخة نهائية</h1>

    <div class="status">
      <div class="turn"><span class="dot" id="turnDot"></span><span id="turnTxt">دور الأبيض</span></div>
      <div class="row"><span class="k">التقييم (منظور الأبيض)</span><span class="v" id="evalTxt">0.00</span></div>
      <div class="row"><span class="k">العمق / العقد</span><span class="v" id="depthTxt">-</span></div>
      <div class="row"><span class="k">الحالة</span><span class="v" id="stateTxt">جاهز</span></div>
    </div>

    <div class="controls">
      <div class="field">
        <label>العمق الأقصى</label>
        <select id="depthSel">
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option selected>5</option><option>6</option><option>7</option>
          <option>8</option><option>9</option>
        </select>
      </div>
      <div class="field">
        <label>حد الزمن</label>
        <select id="timeSel">
          <option value="1000">1 ثانية</option>
          <option value="3000" selected>3 ثوانٍ</option>
          <option value="6000">6 ثوانٍ</option>
          <option value="12000">12 ثانية</option>
          <option value="30000">30 ثانية</option>
          <option value="0">بلا حد</option>
        </select>
      </div>
      <div class="field">
        <label>تلعب بـ</label>
        <select id="sideSel">
          <option value="0" selected>الأبيض</option>
          <option value="1">الأسود</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="flipBtn">↻ اقلب اللوحة</button>
      </div>
      <button class="primary" id="newBtn">لعبة جديدة</button>
      <button id="undoBtn" style="grid-column:span 2">↶ تراجع عن النقلة</button>
    </div>

    <div class="pgn-box">
      <label>📋 تحميل مباراة (PGN)</label>
      <textarea id="pgnInput" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 ..."></textarea>
      <div class="pgn-row">
        <select id="pgnSideSel">
          <option value="0">أنا الأبيض</option>
          <option value="1">أنا الأسود</option>
        </select>
        <button id="loadPgnBtn">تحميل</button>
      </div>
      <div class="pgn-hint">الصق نقلات PGN (بدون أو مع أرقام النقلات). المحرك سيلعب تلقائيًا الدور المعاكس من آخر موقف.</div>
    </div>

    <div class="moves" id="moves"></div>
  </aside>
</div>

<div class="promo" id="promo">
  <div class="box">
    <p>اختر قطعة الترقية</p>
    <div class="opts" id="promoOpts"></div>
  </div>
</div>

<!-- ===================== ENGINE ===================== -->
<script id="engine-src" type="text/js-worker">
(function (global) {
  'use strict';

  var EMPTY=0,PAWN=1,KNIGHT=2,BISHOP=3,ROOK=4,QUEEN=5,KING=6;
  var WHITE=0,BLACK=1;
  var FLAG_NORMAL=0,FLAG_DOUBLE=1,FLAG_EP=2,FLAG_CASTLE=3;
  var MAX_PLY=96, INF=1000000, MATE=100000;

  var HS=2048;

  function pc(t,c){return t|(c<<3)}
  function pType(p){return p&7}
  function pColor(p){return p>>3}
  function mv(from,to,promo,flag){return (from|(to<<6)|((promo||0)<<12)|((flag||0)<<15))|0}
  function mFrom(m){return m&63}
  function mTo(m){return (m>>6)&63}
  function mPromo(m){return (m>>12)&7}
  function mFlag(m){return (m>>15)&7}
  function idxToAlg(i){return 'abcdefgh'[i&7]+(8-(i>>3))}
  function algToIdx(s){return (8-parseInt(s[1],10))*8+(s.charCodeAt(0)-97)}
  var PIECE_CHARS=['','P','N','B','R','Q','K','','','p','n','b','r','q','k'];

  var board=new Int8Array(64);
  var side=WHITE, castling=0, epSq=-1, halfmove=0, fullmove=1;
  var kingSq=[60,4];
  var hashLo=0, hashHi=0;

  var zPieceLo=new Int32Array(15*64), zPieceHi=new Int32Array(15*64);
  var zCastleLo=new Int32Array(16), zCastleHi=new Int32Array(16);
  var zEpLo=new Int32Array(8), zEpHi=new Int32Array(8);
  var zTurnLo=0, zTurnHi=0;
  var _rngState=0x2F6E2B1;
  function rnd32(){_rngState^=_rngState<<13;_rngState>>>=0;_rngState^=_rngState>>>17;_rngState^=_rngState<<5;_rngState>>>=0;return _rngState>>>0}
  (function(){
    var i;
    for(i=0;i<15*64;i++){zPieceLo[i]=rnd32()|0;zPieceHi[i]=rnd32()|0}
    for(i=0;i<16;i++){zCastleLo[i]=rnd32()|0;zCastleHi[i]=rnd32()|0}
    for(i=0;i<8;i++){zEpLo[i]=rnd32()|0;zEpHi[i]=rnd32()|0}
    zTurnLo=rnd32()|0;zTurnHi=rnd32()|0;
  })();
  function hPiece(p,sq){hashLo^=zPieceLo[p*64+sq];hashHi^=zPieceHi[p*64+sq]}
  function computeHash(){
    var lo=0,hi=0,i,p;
    for(i=0;i<64;i++){p=board[i];if(p){lo^=zPieceLo[p*64+i];hi^=zPieceHi[p*64+i]}}
    lo^=zCastleLo[castling];hi^=zCastleHi[castling];
    if(epSq!==-1){lo^=zEpLo[epSq&7];hi^=zEpHi[epSq&7]}
    if(side===BLACK){lo^=zTurnLo;hi^=zTurnHi}
    hashLo=lo|0;hashHi=hi|0;
  }

  function charToPiece(c){
    var up=c.toUpperCase();
    var t={P:PAWN,N:KNIGHT,B:BISHOP,R:ROOK,Q:QUEEN,K:KING}[up];
    if(!t)return 0;
    return pc(t,c===up?WHITE:BLACK);
  }
  function setFen(fen,opts){
    opts=opts||{};
    var i;
    for(i=0;i<64;i++)board[i]=0;
    var parts=fen.trim().split(/\s+/);
    var rows=parts[0].split('/'), idx=0;
    for(var r=0;r<8&&r<rows.length;r++){
      var row=rows[r];
      for(var k=0;k<row.length;k++){
        var ch=row[k];
        if(ch>='1'&&ch<='8')idx+=ch.charCodeAt(0)-48;
        else if(idx<64)board[idx++]=charToPiece(ch);
      }
    }
    side=(parts[1]==='b')?BLACK:WHITE;
    castling=0;
    var cs=parts[2]||'-';
    if(cs.indexOf('K')>=0)castling|=1;
    if(cs.indexOf('Q')>=0)castling|=2;
    if(cs.indexOf('k')>=0)castling|=4;
    if(cs.indexOf('q')>=0)castling|=8;
    epSq=(!parts[3]||parts[3]==='-')?-1:algToIdx(parts[3]);
    halfmove=parseInt(parts[4],10); if(isNaN(halfmove))halfmove=0;
    fullmove=parseInt(parts[5],10); if(isNaN(fullmove)||fullmove<1)fullmove=1;

    if(epSq!==-1){
      var rank=epSq>>3, ok=false;
      if(board[epSq]!==0){ ok=false; }
      else if(rank===2 && side===BLACK){ if(board[epSq+8]===pc(PAWN,WHITE)) ok=true; }
      else if(rank===5 && side===WHITE){ if(board[epSq-8]===pc(PAWN,BLACK)) ok=true; }
      if(!ok) epSq=-1;
    }

    kingSq[WHITE]=-1; kingSq[BLACK]=-1;
    for(i=0;i<64;i++){
      if(board[i]===pc(KING,WHITE))kingSq[WHITE]=i;
      else if(board[i]===pc(KING,BLACK))kingSq[BLACK]=i;
    }
    computeHash();
    hIdx=0; posN=0;
    if(opts.prevHashes){
      var ph=opts.prevHashes;
      for(var pi=0;pi<ph.length&&posN<posHlo.length;pi++){
        posHlo[posN]=ph[pi][0]|0;
        posHhi[posN]=ph[pi][1]|0;
        posN++;
      }
    }
    if(!opts.keepTT){ ttKey.fill(0); ttLock.fill(0); ttDepth.fill(-1); }
  }
  function getFen(){
    var s='',r,f;
    for(r=0;r<8;r++){
      var empty=0;
      for(f=0;f<8;f++){
        var p=board[r*8+f];
        if(p===0)empty++;
        else{if(empty){s+=empty;empty=0}s+=PIECE_CHARS[p]}
      }
      if(empty)s+=empty;
      if(r<7)s+='/';
    }
    s+=' '+(side===WHITE?'w':'b');
    var c='';
    if(castling&1)c+='K'; if(castling&2)c+='Q';
    if(castling&4)c+='k'; if(castling&8)c+='q';
    s+=' '+(c||'-');
    s+=' '+(epSq===-1?'-':idxToAlg(epSq));
    s+=' '+halfmove+' '+fullmove;
    return s;
  }
  function getPositionKey(){return hashLo+':'+hashHi}

  var hMove=new Int32Array(HS),hCastle=new Int32Array(HS),hEp=new Int32Array(HS);
  var hHalf=new Int32Array(HS),hHl=new Int32Array(HS),hHh=new Int32Array(HS);
  var hCap=new Int32Array(HS),hCapSq=new Int32Array(HS);
  var hIdx=0;
  var posHlo=new Int32Array(HS), posHhi=new Int32Array(HS);
  var posN=0;

  function makeMove(m){
    var from=m&63,to=(m>>6)&63,promo=(m>>12)&7,flag=(m>>15)&7;
    var p=board[from], us=side;
    var captured=board[to], capSq=to;
    if(flag===FLAG_EP){capSq=(us===WHITE)?to+8:to-8;captured=board[capSq]}

    var hi=hIdx++;
    hMove[hi]=m;hCastle[hi]=castling;hEp[hi]=epSq;hHalf[hi]=halfmove;
    hHl[hi]=hashLo;hHh[hi]=hashHi;hCap[hi]=captured;hCapSq[hi]=capSq;

    board[from]=0;hPiece(p,from);
    if(flag===FLAG_EP){board[capSq]=0;hPiece(captured,capSq)}
    else if(captured){hPiece(captured,to)}
    var placed=promo?pc(promo,us):p;
    board[to]=placed;hPiece(placed,to);
    if((p&7)===KING)kingSq[us]=to;

    if(flag===FLAG_CASTLE){
      var rf,rt;
      if(to===62){rf=63;rt=61}
      else if(to===58){rf=56;rt=59}
      else if(to===6){rf=7;rt=5}
      else{rf=0;rt=3}
      var rk=board[rf];
      board[rf]=0;hPiece(rk,rf);
      board[rt]=rk;hPiece(rk,rt);
    }

    var nc=castling;
    if((p&7)===KING)nc&=(us===WHITE)?~3:~12;
    if(from===63||to===63)nc&=~1;
    if(from===56||to===56)nc&=~2;
    if(from===7||to===7)nc&=~4;
    if(from===0||to===0)nc&=~8;
    if(nc!==castling){
      hashLo^=zCastleLo[castling]^zCastleLo[nc];
      hashHi^=zCastleHi[castling]^zCastleHi[nc];
      castling=nc;
    }

    if(epSq!==-1){hashLo^=zEpLo[epSq&7];hashHi^=zEpHi[epSq&7]}
    epSq=-1;
    if(flag===FLAG_DOUBLE){
      epSq=(us===WHITE)?to+8:to-8;
      hashLo^=zEpLo[epSq&7];hashHi^=zEpHi[epSq&7];
    }
    if((p&7)===PAWN||captured)halfmove=0;else halfmove++;
    side=us^1;
    hashLo^=zTurnLo;hashHi^=zTurnHi;
    if(us===BLACK)fullmove++;
    if(posN<posHlo.length){posHlo[posN]=hashLo;posHhi[posN]=hashHi;posN++}
  }
  function unmakeMove(){
    var hi=--hIdx, m=hMove[hi];
    var from=m&63,to=(m>>6)&63,promo=(m>>12)&7,flag=(m>>15)&7;
    side^=1;
    var us=side;
    castling=hCastle[hi];epSq=hEp[hi];halfmove=hHalf[hi];
    hashLo=hHl[hi];hashHi=hHh[hi];
    if(us===BLACK)fullmove--;
    var p=board[to];
    if(promo)p=pc(PAWN,us);
    board[from]=p;board[to]=0;
    if((p&7)===KING)kingSq[us]=from;
    var captured=hCap[hi];
    if(flag===FLAG_EP){board[hCapSq[hi]]=captured}
    else if(captured){board[to]=captured}
    if(flag===FLAG_CASTLE){
      var rf,rt;
      if(to===62){rf=63;rt=61}
      else if(to===58){rf=56;rt=59}
      else if(to===6){rf=7;rt=5}
      else{rf=0;rt=3}
      board[rf]=board[rt];board[rt]=0;
    }
    if(posN>0)posN--;
  }
  function makeNull(){
    var hi=hIdx++;
    hMove[hi]=0;hCastle[hi]=castling;hEp[hi]=epSq;hHalf[hi]=halfmove;
    hHl[hi]=hashLo;hHh[hi]=hashHi;hCap[hi]=0;hCapSq[hi]=-1;
    if(epSq!==-1){hashLo^=zEpLo[epSq&7];hashHi^=zEpHi[epSq&7];epSq=-1}
    side^=1;hashLo^=zTurnLo;hashHi^=zTurnHi;halfmove++;
    if(posN<posHlo.length){posHlo[posN]=hashLo;posHhi[posN]=hashHi;posN++}
  }
  function unmakeNull(){
    var hi=--hIdx;
    side^=1;

    var nsq=DS3_KNIGHT_ATK[sq];
    var kn=pc(KNIGHT,by);

    var gsq=DS3_KING_ATK[sq];

    return c;
  }
  function E_mobQueen(sq,enemyColor){return E_mobBishop(sq,enemyColor)+E_mobRook(sq,enemyColor);}

  function E_kingSafety(kSq,epS,epP,epN,enemyColor){
    if(kSq<0)return 0;
    E_stamp++;
    E_zone[kSq]=E_stamp;
    var adj=E_KING_ATT[kSq];
    for(var i=0;i<9;i++){var s=adj[i];if(s<0)break;E_zone[s]=E_stamp;}
    var attackers=0,weight=0;
    for(var j=0;j<epN;j++){
      var pt=epP[j];if(pt===KING)continue;
      var ssq=epS[j],hit=false;
      if(pt===PAWN){
        var aP=E_PAWN_ATT[enemyColor][ssq];
        for(var k=0;k<3;k++){var sP=aP[k];if(sP<0)break;if(E_zone[sP]===E_stamp){hit=true;break;}}
      } else if(pt===KNIGHT){
        var aN=E_KNIGHT_ATT[ssq];
        for(var k2=0;k2<9;k2++){var sN=aN[k2];if(sN<0)break;if(E_zone[sN]===E_stamp){hit=true;break;}}
      } else {
        var rays=(pt===BISHOP)?E_BISHOP_RAYS[ssq]:(pt===ROOK)?E_ROOK_RAYS[ssq]:E_QUEEN_RAYS[ssq];
        outer:for(var d=0;d<rays.length;d++){
          var ray=rays[d];
          for(var ii=0;ii<8;ii++){
            var s2=ray[ii];if(s2<0)break;
            if(E_zone[s2]===E_stamp){hit=true;break outer;}
            if(board[s2]!==0)break;
          }
        }
      }
      if(hit){attackers++;weight+=E_KING_ATT_W[pt];}
    }
    if(attackers<2)return 0;
    return weight*attackers;
  }

  function E_shield(kSq,ownPawnCnt,ownPawnMax,isWhite){
    if(kSq<0)return 0;
    var kf=kSq&7,kr=kSq>>3,s=0;
    for(var df=-1;df<=1;df++){
      var f=kf+df;if(f<0||f>7)continue;
      if(ownPawnCnt[f]===0){s-=E_OPEN_KING;continue;}
      var pr=ownPawnMax[f];
      if(isWhite){
        if(pr===kr-1)s+=E_SHIELD_MG_1;
        else if(pr===kr-2)s+=E_SHIELD_MG_2;
        else s-=E_OPEN_KING;
      } else {
        if(pr===kr+1)s+=E_SHIELD_MG_1;
        else if(pr===kr+2)s+=E_SHIELD_MG_2;
        else s-=E_OPEN_KING;
      }
    }
    return s;
  }

  function evaluate(){
    var i,f,r,p,c,t,sq,rel,pstIdx;
    for(i=0;i<8;i++){
      E_wPawnCnt[i]=0;E_bPawnCnt[i]=0;
      E_wMax[i]=-1;E_bMax[i]=-1;
      E_wMin[i]=8;E_bMin[i]=8;
    }
    var mgW=0,egW=0,mgB=0,egB=0,phase=0;
    var wKing=-1,bKing=-1;
    var wBish=0,bBish=0,wRookN=0,bRookN=0;
    var wPawnD=0,wPawnL=0,bPawnD=0,bPawnL=0;
    var wNP=0,bNP=0;
    for(sq=0;sq<64;sq++){
      p=board[sq];if(p===0)continue;
      c=p>>3;t=p&7;f=sq&7;r=sq>>3;
      rel=(c===0)?sq:(sq^56);
      pstIdx=(t-1)*64+rel;
      phase+=E_PHASE_W[t];
      if(c===0){
        mgW+=E_MAT_MG[t]+E_PST_MG[pstIdx];
        egW+=E_MAT_EG[t]+E_PST_EG[pstIdx];
        E_wPS[wNP]=sq;E_wPP[wNP]=t;wNP++;
      } else {
        mgB+=E_MAT_MG[t]+E_PST_MG[pstIdx];
        egB+=E_MAT_EG[t]+E_PST_EG[pstIdx];
        E_bPS[bNP]=sq;E_bPP[bNP]=t;bNP++;
      }
      if(t===PAWN){
        if(c===0){
          E_wPawnCnt[f]++;
          if(r>E_wMax[f])E_wMax[f]=r;
          if(r<E_wMin[f])E_wMin[f]=r;
          if(((f+r)&1)===0)wPawnD++;else wPawnL++;
        } else {
          E_bPawnCnt[f]++;
          if(r>E_bMax[f])E_bMax[f]=r;
          if(r<E_bMin[f])E_bMin[f]=r;
          if(((f+r)&1)===0)bPawnD++;else bPawnL++;
        }
      } else if(t===BISHOP){if(c===0)wBish++;else bBish++;}
      else if(t===ROOK){if(c===0)wRookN++;else bRookN++;}
      else if(t===KING){if(c===0)wKing=sq;else bKing=sq;}
      else if(t===KNIGHT){
        if(f===0||f===7){
          if(c===0){mgW-=12;egW-=12;}
          else{mgB-=12;egB-=12;}
        }
      }
    }

    for(i=0;i<wNP;i++){
      sq=E_wPS[i];t=E_wPP[i];
      if(t===KNIGHT){
        var aN=E_KNIGHT_ATT[sq],cN=0;
        for(var k=0;k<9;k++){var sN=aN[k];if(sN<0)break;var q=board[sN];if(q===0||(q>>3)===1)cN++;}
        if(cN>8)cN=8;
        mgW+=E_MOB_N[cN];egW+=E_MOB_N_EG[cN];
      } else if(t===BISHOP){
        var cB=E_mobBishop(sq,1);if(cB>13)cB=13;
        mgW+=E_MOB_B[cB];egW+=E_MOB_B_EG[cB];
      } else if(t===ROOK){
        var cR=E_mobRook(sq,1);if(cR>14)cR=14;
        mgW+=E_MOB_R[cR];egW+=E_MOB_R_EG[cR];
      } else if(t===QUEEN){
        var cQ=E_mobQueen(sq,1);if(cQ>27)cQ=27;
        mgW+=E_MOB_Q[cQ];egW+=E_MOB_Q_EG[cQ];
      }
    }
    for(i=0;i<bNP;i++){
      sq=E_bPS[i];t=E_bPP[i];
      if(t===KNIGHT){
        var aN2=E_KNIGHT_ATT[sq],cN2=0;
        for(var k2=0;k2<9;k2++){var sN2=aN2[k2];if(sN2<0)break;var q2=board[sN2];if(q2===0||(q2>>3)===0)cN2++;}
        if(cN2>8)cN2=8;
        mgB+=E_MOB_N[cN2];egB+=E_MOB_N_EG[cN2];
      } else if(t===BISHOP){
        var cB2=E_mobBishop(sq,0);if(cB2>13)cB2=13;
        mgB+=E_MOB_B[cB2];egB+=E_MOB_B_EG[cB2];
      } else if(t===ROOK){
        var cR2=E_mobRook(sq,0);if(cR2>14)cR2=14;
        mgB+=E_MOB_R[cR2];egB+=E_MOB_R_EG[cR2];
      } else if(t===QUEEN){
        var cQ2=E_mobQueen(sq,0);if(cQ2>27)cQ2=27;
        mgB+=E_MOB_Q[cQ2];egB+=E_MOB_Q_EG[cQ2];
      }
    }

    for(f=0;f<8;f++){
      var wc=E_wPawnCnt[f],bc=E_bPawnCnt[f];
      var wL=f>0?E_wPawnCnt[f-1]:0,wR=f<7?E_wPawnCnt[f+1]:0;
      var bL=f>0?E_bPawnCnt[f-1]:0,bR=f<7?E_bPawnCnt[f+1]:0;
      if(wc>1){var d1=wc-1;mgW+=E_DOUBLED_MG*d1;egW+=E_DOUBLED_EG*d1;}
      if(bc>1){var d2=bc-1;mgB+=E_DOUBLED_MG*d2;egB+=E_DOUBLED_EG*d2;}
      if(wc>0&&wL===0&&wR===0){mgW+=E_ISOLATED_MG*wc;egW+=E_ISOLATED_EG*wc;}
      if(bc>0&&bL===0&&bR===0){mgB+=E_ISOLATED_MG*bc;egB+=E_ISOLATED_EG*bc;}
    }

    for(i=0;i<wNP;i++){
      if(E_wPP[i]!==PAWN)continue;
      sq=E_wPS[i];f=sq&7;r=sq>>3;
      var bm0=E_bMin[f],bmL=f>0?E_bMin[f-1]:8,bmR=f<7?E_bMin[f+1]:8;
      if(bmL>=r&&bm0>=r&&bmR>=r){
        var advW=7-r;
        mgW+=E_PASSED_MG[advW];egW+=E_PASSED_EG[advW];
      }
      var wML=f>0?E_wMax[f-1]:-1,wMR=f<7?E_wMax[f+1]:-1;
      var wmL=f>0?E_wMin[f-1]:8,wmR=f<7?E_wMin[f+1]:8;
      var hasSupport=(wML>=r-1&&wmL<=r+1)||(wMR>=r-1&&wmR<=r+1);
      if(!hasSupport&&(bmL<r||bmR<r)){mgW+=E_BACKWARD_MG;egW+=E_BACKWARD_EG;}
      if((wML>=r-1&&wmL<=r+1)||(wMR>=r-1&&wmR<=r+1)){
        mgW+=E_CONN_PAWN_MG;egW+=E_CONN_PAWN_EG;
      }
    }
    for(i=0;i<bNP;i++){
      if(E_bPP[i]!==PAWN)continue;
      sq=E_bPS[i];f=sq&7;r=sq>>3;
      var wm0=E_wMin[f],wmL2=f>0?E_wMin[f-1]:8,wmR2=f<7?E_wMin[f+1]:8;
      if(wmL2>=r&&wm0>=r&&wmR2>=r){
        mgB+=E_PASSED_MG[r];egB+=E_PASSED_EG[r];
      }
      var bML=f>0?E_bMax[f-1]:-1,bMR=f<7?E_bMax[f+1]:-1;
      var bmL2=f>0?E_bMin[f-1]:8,bmR2=f<7?E_bMin[f+1]:8;
      var hasSup2=(bML<=r+1&&bmL2>=r-1)||(bMR<=r+1&&bmR2>=r-1);
      if(!hasSup2&&(wmL2<r||wmR2<r)){mgB+=E_BACKWARD_MG;egB+=E_BACKWARD_EG;}
      if((bML<=r+1&&bmL2>=r-1)||(bMR<=r+1&&bmR2>=r-1)){
        mgB+=E_CONN_PAWN_MG;egB+=E_CONN_PAWN_EG;
      }
    }

    if(wBish>=2){mgW+=E_BISHOP_PAIR_MG;egW+=E_BISHOP_PAIR_EG;}
    if(bBish>=2){mgB+=E_BISHOP_PAIR_MG;egB+=E_BISHOP_PAIR_EG;}
    for(i=0;i<wNP;i++){
      if(E_wPP[i]!==BISHOP)continue;
      sq=E_wPS[i];
      var colW=((sq&7)+(sq>>3))&1;
      var cntW=(colW===0)?wPawnD:wPawnL;
      mgW+=E_BAD_BISHOP_MG*cntW;egW+=E_BAD_BISHOP_EG*cntW;
    }
    for(i=0;i<bNP;i++){
      if(E_bPP[i]!==BISHOP)continue;
      sq=E_bPS[i];
      var colB=((sq&7)+(sq>>3))&1;
      var cntB=(colB===0)?bPawnD:bPawnL;
      mgB+=E_BAD_BISHOP_MG*cntB;egB+=E_BAD_BISHOP_EG*cntB;
    }

    for(i=0;i<wNP;i++){
      if(E_wPP[i]!==ROOK)continue;
      sq=E_wPS[i];f=sq&7;r=sq>>3;
      if(E_wPawnCnt[f]===0){
        if(E_bPawnCnt[f]===0){mgW+=E_ROOK_OPEN_MG;egW+=E_ROOK_OPEN_EG;}
        else {mgW+=E_ROOK_SEMI_MG;egW+=E_ROOK_SEMI_EG;}
      }
      if(r===1){mgW+=E_ROOK_7TH_MG;egW+=E_ROOK_7TH_EG;}
    }
    for(i=0;i<bNP;i++){
      if(E_bPP[i]!==ROOK)continue;
      sq=E_bPS[i];f=sq&7;r=sq>>3;
      if(E_bPawnCnt[f]===0){
        if(E_wPawnCnt[f]===0){mgB+=E_ROOK_OPEN_MG;egB+=E_ROOK_OPEN_EG;}
        else {mgB+=E_ROOK_SEMI_MG;egB+=E_ROOK_SEMI_EG;}
      }
      if(r===6){mgB+=E_ROOK_7TH_MG;egB+=E_ROOK_7TH_EG;}
    }
    if(wRookN>=2){
      for(i=0;i<wNP;i++){
        if(E_wPP[i]!==ROOK)continue;
        for(var j=i+1;j<wNP;j++){
          if(E_wPP[j]!==ROOK)continue;
          var a=E_wPS[i],b2=E_wPS[j];
          if((a>>3)===(b2>>3)||(a&7)===(b2&7)){
            var blocked=false,s3;
            if((a>>3)===(b2>>3)){
              var lo=(a<b2?a:b2)+1,hi=(a<b2?b2:a);
              for(s3=lo;s3<hi;s3++)if(board[s3]!==0){blocked=true;break;}
            } else {
              var step=a<b2?8:-8;
              for(s3=a+step;s3!==b2;s3+=step)if(board[s3]!==0){blocked=true;break;}
            }
            if(!blocked){mgW+=E_CONN_ROOKS;egW+=E_CONN_ROOKS;}
          }
        }
      }
    }
    if(bRookN>=2){
      for(i=0;i<bNP;i++){
        if(E_bPP[i]!==ROOK)continue;
        for(var j2=i+1;j2<bNP;j2++){
          if(E_bPP[j2]!==ROOK)continue;
          var a2=E_bPS[i],b3=E_bPS[j2];
          if((a2>>3)===(b3>>3)||(a2&7)===(b3&7)){
            var blocked2=false,s4;
            if((a2>>3)===(b3>>3)){
              var lo2=(a2<b3?a2:b3)+1,hi2=(a2<b3?b3:a2);
              for(s4=lo2;s4<hi2;s4++)if(board[s4]!==0){blocked2=true;break;}
            } else {
              var step2=a2<b3?8:-8;
              for(s4=a2+step2;s4!==b3;s4+=step2)if(board[s4]!==0){blocked2=true;break;}
            }
            if(!blocked2){mgB+=E_CONN_ROOKS;egB+=E_CONN_ROOKS;}
          }
        }
      }
    }

    for(i=0;i<wNP;i++){
      if(E_wPP[i]!==KNIGHT)continue;
      sq=E_wPS[i];f=sq&7;r=sq>>3;
      if(r<2||r>4)continue;
      var supW=false;
      if(f>0&&E_wPawnCnt[f-1]>0&&E_wMax[f-1]===r+1)supW=true;
      if(f<7&&E_wPawnCnt[f+1]>0&&E_wMax[f+1]===r+1)supW=true;
      if(!supW)continue;
      var kickable=false;
      if(f>0&&E_bPawnCnt[f-1]>0&&E_bMin[f-1]<=r)kickable=true;
      if(f<7&&E_bPawnCnt[f+1]>0&&E_bMin[f+1]<=r)kickable=true;
      if(!kickable){mgW+=E_OUTPOST_MG;egW+=E_OUTPOST_EG;}
    }
    for(i=0;i<bNP;i++){
      if(E_bPP[i]!==KNIGHT)continue;
      sq=E_bPS[i];f=sq&7;r=sq>>3;
      var rr=7-r;if(rr<2||rr>4)continue;
      var supB=false;
      if(f>0&&E_bPawnCnt[f-1]>0&&E_bMin[f-1]===r-1)supB=true;
      if(f<7&&E_bPawnCnt[f+1]>0&&E_bMin[f+1]===r-1)supB=true;
      if(!supB)continue;
      var kickable2=false;
      if(f>0&&E_wPawnCnt[f-1]>0&&E_wMax[f-1]>=r)kickable2=true;
      if(f<7&&E_wPawnCnt[f+1]>0&&E_wMax[f+1]>=r)kickable2=true;
      if(!kickable2){mgB+=E_OUTPOST_MG;egB+=E_OUTPOST_EG;}
    }

    for(i=0;i<wNP;i++){
      if(E_wPP[i]!==PAWN)continue;
      var aPW=E_PAWN_ATT[0][E_wPS[i]];
      for(var k3=0;k3<3;k3++){
        var tSq=aPW[k3];if(tSq<0)break;
        var tp=board[tSq];
        if(tp!==0&&(tp>>3)===1){var ttype=tp&7;if(ttype>=KNIGHT&&ttype<=QUEEN){mgW+=E_THREAT_PAWN_MG;egW+=E_THREAT_PAWN_EG;}}
      }
    }
    for(i=0;i<bNP;i++){
      if(E_bPP[i]!==PAWN)continue;
      var aPB=E_PAWN_ATT[1][E_bPS[i]];
      for(var k4=0;k4<3;k4++){
        var tSq2=aPB[k4];if(tSq2<0)break;
        var tp2=board[tSq2];
        if(tp2!==0&&(tp2>>3)===0){var ttype2=tp2&7;if(ttype2>=KNIGHT&&ttype2<=QUEEN){mgB+=E_THREAT_PAWN_MG;egB+=E_THREAT_PAWN_EG;}}
      }
    }

    mgW-=E_kingSafety(wKing,E_bPS,E_bPP,bNP,1);
    mgB-=E_kingSafety(bKing,E_wPS,E_wPP,wNP,0);
    mgW+=E_shield(wKing,E_wPawnCnt,E_wMax,true);
    mgB+=E_shield(bKing,E_bPawnCnt,E_bMax,false);

    var ph=phase>24?24:phase;
    var mgDiff=mgW-mgB;
    var egDiff=egW-egB;
    var score=((mgDiff*ph)+(egDiff*(24-ph)))/24|0;
    score = (side===0)?score:-score;
    return score + 20;
  }

  var TT_BITS=20,TT_SIZE=1<<TT_BITS,TT_MASK=TT_SIZE-1;
  var ttKey=new Int32Array(TT_SIZE),ttLock=new Int32Array(TT_SIZE);
  var ttDepth=new Int8Array(TT_SIZE).fill(-1);
  var ttFlag=new Int8Array(TT_SIZE),ttScore=new Int32Array(TT_SIZE),ttMove=new Int32Array(TT_SIZE);

  function ds3_findLVA(sq,color,remLo,remHi){
    var b=board;
    var pwn=pc(PAWN,color),kn=pc(KNIGHT,color),kg=pc(KING,color);
    var bsh=pc(BISHOP,color),rk=pc(ROOK,color),qn=pc(QUEEN,color);
    var psq=DS3_PAWN_ATK[color][sq];
    for(var i=0,L=psq.length;i<L;i++){
      var s=psq[i];
      if(s<32?(remLo>>>s)&1:(remHi>>>(s-32))&1)continue;
      if(b[s]===pwn)return s|(PAWN<<6);
    }
    var nsq=DS3_KNIGHT_ATK[sq];
    for(var i2=0,L2=nsq.length;i2<L2;i2++){
      var s2=nsq[i2];
      if(s2<32?(remLo>>>s2)&1:(remHi>>>(s2-32))&1)continue;
      if(b[s2]===kn)return s2|(KNIGHT<<6);
    }
    var bRays=DS3_BISHOP_RAYS[sq];
    for(var d=0;d<4;d++){
      var ray=bRays[d];
      for(var j=0,M=ray.length;j<M;j++){
        var s3=ray[j];
        if(s3<32?(remLo>>>s3)&1:(remHi>>>(s3-32))&1)continue;
        var p=b[s3];if(p===0)continue;
        if(p===bsh)return s3|(BISHOP<<6);
        if(p===qn)return s3|(QUEEN<<6);
        break;
      }
    }
    var rRays=DS3_ROOK_RAYS[sq];
    for(var e=0;e<4;e++){
      var ray2=rRays[e];
      for(var j2=0,M2=ray2.length;j2<M2;j2++){
        var s4=ray2[j2];
        if(s4<32?(remLo>>>s4)&1:(remHi>>>(s4-32))&1)continue;
        var p2=b[s4];if(p2===0)continue;
        if(p2===rk)return s4|(ROOK<<6);
        if(p2===qn)return s4|(QUEEN<<6);
        break;
      }
    }
    var gsq=DS3_KING_ATK[sq];
    for(var i4=0,L4=gsq.length;i4<L4;i4++){
      var s5=gsq[i4];
      if(s5<32?(remLo>>>s5)&1:(remHi>>>(s5-32))&1)continue;
      if(b[s5]===kg)return s5|(KING<<6);
    }
    return -1;
  }

  function see(move){
    var from=move&63,to=(move>>6)&63,promo=(move>>12)&7,flag=(move>>15)&7;
    var capSq=-1,v0,ourVal;
    if(flag===FLAG_EP){
      capSq=(side===WHITE)?to+8:to-8;
      v0=DS3_SEE_VAL[PAWN];ourVal=DS3_SEE_VAL[PAWN];
    } else {
      var cp=board[to];
      v0=(cp!==0)?DS3_SEE_VAL[cp&7]:0;
      if(promo){v0+=DS3_SEE_VAL[promo]-DS3_SEE_VAL[PAWN];ourVal=DS3_SEE_VAL[promo];}
      else ourVal=DS3_SEE_VAL[board[from]&7];
    }
    if(v0===0&&promo===0)return 0;
    var remLo=0,remHi=0;
    if(from<32)remLo|=(1<<from);else remHi|=(1<<(from-32));
    if(capSq>=0){if(capSq<32)remLo|=(1<<capSq);else remHi|=(1<<(capSq-32));}
    _seeSeq[0]=v0;
    var n=1,stm=side^1,nextVal=ourVal;
    while(n<32){
      var atk=ds3_findLVA(to,stm,remLo,remHi);
      if(atk<0)break;
      var atkSq=atk&63,atkType=atk>>6;
      _seeSeq[n++]=nextVal;
      nextVal=DS3_SEE_VAL[atkType];
      if(atkSq<32)remLo|=(1<<atkSq);else remHi|=(1<<(atkSq-32));
      stm^=1;
    }
    var V=0;
    for(var i=n-1;i>=1;i--){V=_seeSeq[i]-V;if(V<0)V=0;}
    return _seeSeq[0]-V;
  }
  function seeGE(move,threshold){return see(move)>=threshold;}

  }

  function scoreMoves(ply,n,ttM){
    var base=ply*256;
    var k1=killers[ply*2],k2=killers[ply*2+1];
    var counterMove=0;
    if(hIdx>0){
      var prev=hMove[hIdx-1];
      if(prev!==0)counterMove=counterMoves[(prev&63)*64+((prev>>6)&63)];
    }
    for(var i=0;i<n;i++){
      var m=mStack[base+i];
      var s;
      if(m===ttM&&ttM!==0){s=3000000;}
      else {
        var from=m&63,to=(m>>6)&63;
        var promo=(m>>12)&7,flag=(m>>15)&7;
        var victimPiece=board[to];
        if(flag===FLAG_EP)victimPiece=pc(PAWN,side^1);
        var attackerPiece=board[from];
        if(victimPiece!==0){
          var seeWin=seeGE(m,0);
          var vType=victimPiece&7,aType=attackerPiece&7;
          if(promo){
            s=seeWin?(2500000+MVV[promo]+MVV[vType]):(500000+MVV[promo]+MVV[vType]);
          } else {
            s=seeWin?(2000000+MVV[vType]*10-MVV[aType]):(-100000+MVV[vType]*10-MVV[aType]);
          }
        } else if(promo){s=1500000+MVV[promo];}
        else if(m===k1){s=800000;}
        else if(m===k2){s=790000;}
        else if(counterMove!==0&&m===counterMove){s=780000;}
        else {s=historyTable[from*64+to]>>4;}
      }
      sStack[base+i]=s;
    }
  }

  var nodes=0,startTime=0,timeLimit=1e9,stopped=false;
  var rootDepthLimit=6;

  function checkTime(){if(Date.now()-startTime>timeLimit)stopped=true}

  function isRepetition(){
    var lim=halfmove<posN?halfmove:posN;
    for(var k=posN-3;k>=0&&k>=posN-1-lim;k-=2){
      if(posHlo[k]===hashLo&&posHhi[k]===hashHi)return true;
    }
    return false;
  }

  function countGameRepetitions(){
    var lim=halfmove<posN?halfmove:posN;
    var cnt=1;
    for(var k=posN-3;k>=0&&k>=posN-1-lim;k-=2){
      if(posHlo[k]===hashLo&&posHhi[k]===hashHi)cnt++;
    }
    return cnt;
  }

  function hasNonPawn(c){
    for(var i=0;i<64;i++){
      var p=board[i];
      if(p!==0&&(p>>3)===c){var t=p&7;if(t>=KNIGHT&&t<=QUEEN)return true}
    }
    return false;
  }

  function quiesce(alpha,beta,ply){
    if(stopped)return 0;
    if((nodes&1023)===0)checkTime();
    nodes++;
    if(ply>=MAX_PLY-1)return evaluate();

    var checked=isAttacked(kingSq[side],side^1);
    var n;
    if(checked){
      n=genMoves(ply,false);
    } else {
      var stand=evaluate();
      if(stand>=beta)return stand;
      if(stand>alpha)alpha=stand;
      n=genMoves(ply,true);
    }
    var base=ply*256;
    scoreMoves(ply,n,0);

    var best=checked?-INF:alpha;
    var legal=0;
    for(var i=0;i<n;i++){
      var bi=i;
      for(var j=i+1;j<n;j++)if(sStack[base+j]>sStack[base+bi])bi=j;
      if(bi!==i){
        var tm=mStack[base+i];mStack[base+i]=mStack[base+bi];mStack[base+bi]=tm;
        var ts=sStack[base+i];sStack[base+i]=sStack[base+bi];sStack[base+bi]=ts;
      }
      var m=mStack[base+i];
      makeMove(m);
      if(inCheck(side^1)){unmakeMove();continue}
      legal++;
      var score=-quiesce(-beta,-alpha,ply+1);
      unmakeMove();
      if(stopped)return 0;
      if(score>best)best=score;
      if(score>alpha)alpha=score;
      if(alpha>=beta)break;
    }
    if(checked&&legal===0)return -MATE+ply;
    return best;
  }

  function negamax(depth,alpha,beta,ply,allowNull){
    if(stopped)return 0;
    if((nodes&1023)===0)checkTime();
    nodes++;
    if(ply>0){
      if(halfmove>=100)return 0;
      if(isRepetition())return 0;
      if(ply>=MAX_PLY-1)return evaluate();
      if(alpha<-MATE+ply)alpha=-MATE+ply;
      if(beta>MATE-ply-1)beta=MATE-ply-1;
      if(alpha>=beta)return alpha;
    }
    var isPv=(beta-alpha)>1;
    var checked=isAttacked(kingSq[side],side^1);
    if(checked&&ply<rootDepthLimit*2)depth++;
    if(depth<=0)return quiesce(alpha,beta,ply);

    var idx=hashLo&TT_MASK;
    var ttM=0;
    if(ttDepth[idx]>=0&&ttKey[idx]===hashLo&&ttLock[idx]===hashHi){
      ttM=ttMove[idx];
      if(ply>0&&!isPv&&ttDepth[idx]>=depth){
        var s=ttScore[idx],fl=ttFlag[idx];
        if(s>MATE-1000)s-=ply; else if(s<-MATE+1000)s+=ply;
        if(fl===0)return s;
        if(fl===1&&s>=beta)return s;
        if(fl===2&&s<=alpha)return s;
      }
    }

    var staticEval=evaluate();

    if(!isPv&&!checked&&depth<=4&&Math.abs(beta)<MATE-1000){
      if(staticEval-90*depth>=beta)return staticEval;
    }

    if(!isPv&&!checked&&depth<=2&&Math.abs(alpha)<MATE-1000){
      if(staticEval+150+80*depth<=alpha)return staticEval;
    }

    if(!isPv&&!checked&&allowNull&&depth>=3&&ply>0&&
       staticEval>=beta&&Math.abs(beta)<MATE-1000&&hasNonPawn(side)){
      var R=2+(depth>6?1:0);
      makeNull();
      var ns=-negamax(depth-1-R,-beta,-beta+1,ply+1,false);
      unmakeNull();
      if(stopped)return 0;
      if(ns>=beta)return (ns>MATE-1000)?beta:ns;
    }

    var n=genMoves(ply,false);
    var base=ply*256;
    scoreMoves(ply,n,ttM);
    var best=-INF,bestMove=0,legal=0;
    var origAlpha=alpha;

    for(var i=0;i<n;i++){
      var bi=i;
      for(var j=i+1;j<n;j++)if(sStack[base+j]>sStack[base+bi])bi=j;
      if(bi!==i){
        var tm=mStack[base+i];mStack[base+i]=mStack[base+bi];mStack[base+bi]=tm;
        var ts=sStack[base+i];sStack[base+i]=sStack[base+bi];sStack[base+bi]=ts;
      }
      var m=mStack[base+i];
      var toSq=(m>>6)&63, flagM=(m>>15)&7;
      var quiet=(board[toSq]===0)&&flagM!==FLAG_EP;

      if(!isPv&&!checked&&quiet&&depth<=3&&i>=4+depth*depth){
        continue;
      }

      makeMove(m);
      if(inCheck(side^1)){unmakeMove();continue}
      legal++;
      var newDepth=depth-1, score;
      if(legal===1){
        score=-negamax(newDepth,-beta,-alpha,ply+1,true);
      } else {
        var red=0;
        if(depth>=3&&legal>=3&&quiet&&!checked&&newDepth>2){
          red=1;
          if(legal>=6)red=2;
          if(depth>=6)red=3;
          if(isPv)red=Math.max(0,red-1);
          if(red>newDepth-2)red=Math.max(0,newDepth-2);
        }
        score=-negamax(newDepth-red,-alpha-1,-alpha,ply+1,true);
        if(score>alpha&&red>0){
          score=-negamax(newDepth,-alpha-1,-alpha,ply+1,true);
        }
        if(score>alpha&&score<beta){
          score=-negamax(newDepth,-beta,-alpha,ply+1,true);
        }
      }
      unmakeMove();
      if(stopped)return 0;
      if(score>best){best=score;bestMove=m}
      if(score>alpha){
        alpha=score;
        if(alpha>=beta){
          if(quiet){
            if(killers[ply*2]!==m){
              killers[ply*2+1]=killers[ply*2];
              killers[ply*2]=m;
            }
            var hi=(m&63)*64+((m>>6)&63);
            historyTable[hi]+=depth*depth;
            if(historyTable[hi]>1000000){
              for(var z=0;z<historyTable.length;z++)historyTable[z]>>=1;
            }
            ds3_updateQuietStats(ply,m);
          }
          break;
        }
      }
    }
    if(legal===0)return checked?(-MATE+ply):0;

    var flag2=(best<=origAlpha)?2:((best>=beta)?1:0);
    var storeScore=best;
    if(storeScore>MATE-1000)storeScore+=ply;
    else if(storeScore<-MATE+1000)storeScore-=ply;
    if(ttDepth[idx]<0||depth>=ttDepth[idx]||ttKey[idx]!==hashLo||ttLock[idx]!==hashHi){
      ttKey[idx]=hashLo;ttLock[idx]=hashHi;ttDepth[idx]=depth;
      ttFlag[idx]=flag2;ttScore[idx]=storeScore;ttMove[idx]=bestMove;
    }
    return best;
  }

  function searchRoot(depth,alpha,beta,prevBest){
    var n=genMoves(0,false);
    scoreMoves(0,n,prevBest);
    var best=-INF,bestM=0,legal=0;
    for(var i=0;i<n;i++){
      var bi=i;
      for(var j=i+1;j<n;j++)if(sStack[j]>sStack[bi])bi=j;
      if(bi!==i){
        var tm=mStack[i];mStack[i]=mStack[bi];mStack[bi]=tm;
        var ts=sStack[i];sStack[i]=sStack[bi];sStack[bi]=ts;
      }
      var m=mStack[i];
      makeMove(m);
      if(inCheck(side^1)){unmakeMove();continue}
      legal++;
      var score;
      if(legal===1){
        score=-negamax(depth-1,-beta,-alpha,1,true);
      } else {
        score=-negamax(depth-1,-alpha-1,-alpha,1,true);
        if(score>alpha&&score<beta){
          score=-negamax(depth-1,-beta,-alpha,1,true);
        }
      }
      unmakeMove();
      if(stopped)break;
      if(score>best){best=score;bestM=m}
      if(score>alpha)alpha=score;
    }
    if(legal===0){
      return {score:isAttacked(kingSq[side],side^1)?-MATE:0,move:0,complete:true};
    }
    return {score:best,move:bestM,complete:!stopped};
  }

  function search(maxDepth,timeMs){
    nodes=0;stopped=false;startTime=Date.now();
    timeLimit=(timeMs&&timeMs>0)?timeMs:1e12;
    killers.fill(0);historyTable.fill(0);counterMoves.fill(0);

    var legalMoves=generateLegalMoves();
    if(legalMoves.length===0){
      return {move:0,score:0,depth:0,nodes:0,time:0};
    }
    var bestMove=legalMoves[0], bestScore=0, completedDepth=0, prevBest=0;
    for(var d=1;d<=maxDepth;d++){
      rootDepthLimit=d;
      var alpha=-INF,beta=INF;
      if(d>=4&&Math.abs(bestScore)<MATE-1000){
        alpha=bestScore-40; beta=bestScore+40;
      }
      var res=null, guard=0;
      while(guard++<12){
        res=searchRoot(d,alpha,beta,prevBest);
        if(stopped)break;
        if(res.score<=alpha){beta=(alpha+beta)>>1;alpha=res.score-90;continue;}
        if(res.score>=beta){alpha=(alpha+beta)>>1;beta=res.score+90;continue;}
        break;
      }
      if(stopped)break;
      if(!res||!res.complete)break;
      if(res.move){bestMove=res.move;prevBest=res.move}
      bestScore=res.score;
      completedDepth=d;
      if(global.onSearchInfo){
        global.onSearchInfo({depth:d,score:bestScore,nodes:nodes,move:bestMove,time:Date.now()-startTime});
      }
      if(Math.abs(bestScore)>MATE-1000)break;
      if((Date.now()-startTime)>timeLimit*0.5)break;
    }
    return {move:bestMove,score:bestScore,depth:completedDepth,nodes:nodes,time:Date.now()-startTime,stopped:stopped};
  }

  var LETTERS=['','','N','B','R','Q','K'];
  function moveToSan(m){
    var from=m&63,to=(m>>6)&63,promo=(m>>12)&7,flag=(m>>15)&7;
    var p=board[from], t=p&7;
    var capture=(board[to]!==0)||(flag===FLAG_EP);
    var san;
    if(flag===FLAG_CASTLE){
      san=(to===62||to===6)?'O-O':'O-O-O';
    } else if(t===PAWN){
      san=capture?('abcdefgh'[from&7]+'x'+idxToAlg(to)):idxToAlg(to);
      if(promo)san+='='+LETTERS[promo];
    } else {
      var legal=generateLegalMoves();
      var sameFile=false,sameRank=false,any=false;
      for(var i=0;i<legal.length;i++){
        var mm=legal[i];
        if(mm===m)continue;
        if(((mm>>6)&63)!==to)continue;
        if(board[mm&63]!==p)continue;
        any=true;
        if((mm&7)===(from&7))sameFile=true;
        if(((mm>>3)&7)===(from>>3))sameRank=true;
      }
      var dis='';
      if(any){
        if(!sameFile)dis='abcdefgh'[from&7];
        else if(!sameRank)dis=String(8-(from>>3));
        else dis='abcdefgh'[from&7]+String(8-(from>>3));
      }
      san=LETTERS[t]+dis+(capture?'x':'')+idxToAlg(to);
    }
    makeMove(m);
    var opp=side;
    var oppLegal=generateLegalMoves();
    if(isAttacked(kingSq[opp],opp^1)){
      san+=(oppLegal.length===0)?'#':'+';
    }
    unmakeMove();
    return san;
  }

  function insufficientMaterial(){
    var wB=0,bB=0,wN=0,bN=0;
    var wBc=[0,0], bBc=[0,0];
    for(var i=0;i<64;i++){
      var p=board[i]; if(!p)continue;
      var t=p&7,c=p>>3;
      if(t===PAWN||t===ROOK||t===QUEEN)return false;
      if(t===BISHOP){
        var color=((i>>3)+(i&7))&1;
        if(c===WHITE){wB++;wBc[color]++} else {bB++;bBc[color]++}
      } else if(t===KNIGHT){
        if(c===WHITE)wN++; else bN++;
      }
    }
    var wMinors=wB+wN, bMinors=bB+bN;
    if(wMinors===0&&bMinors===0)return true;
    if(wMinors+bMinors===1)return true;
    if(wMinors===1&&bMinors===1&&wN===0&&bN===0){
      if((wBc[0]>0&&bBc[0]>0)||(wBc[1]>0&&bBc[1]>0))return true;
    }
    return false;
  }

  function gameStatus(){
    var legal=generateLegalMoves();
    if(legal.length===0){
      if(isAttacked(kingSq[side],side^1)){
        return {over:true,result:(side===WHITE?'0-1':'1-0'),reason:'checkmate',
                text:(side===WHITE?'كش مات — فاز الأسود':'كش مات — فاز الأبيض')};
      }
      return {over:true,result:'1/2-1/2',reason:'stalemate',text:'تعادل — جمود (Stalemate)'};
    }
    if(halfmove>=100)return {over:true,result:'1/2-1/2',reason:'fifty',text:'تعادل — قاعدة 50 نقلة'};
    if(countGameRepetitions()>=3)
      return {over:true,result:'1/2-1/2',reason:'repetition',text:'تعادل — تكرار ثلاثي'};
    if(insufficientMaterial())return {over:true,result:'1/2-1/2',reason:'material',text:'تعادل — قطع غير كافية'};
    return {over:false,text:(side===WHITE?'دور الأبيض':'دور الأسود')};
  }

  function getPositionHistory(){
    var out=new Array(posN);
    for(var i=0;i<posN;i++)out[i]=[posHlo[i],posHhi[i]];
    return out;
  }

  global.Engine={
    WHITE:WHITE,BLACK:BLACK,
    PAWN:PAWN,KNIGHT:KNIGHT,BISHOP:BISHOP,ROOK:ROOK,QUEEN:QUEEN,KING:KING,
    FLAG_EP:FLAG_EP,FLAG_CASTLE:FLAG_CASTLE,
    setFen:setFen, getFen:getFen,
    getPositionKey:getPositionKey,
    getPositionHistory:getPositionHistory,
    getBoard:function(){return board},
    getSide:function(){return side},
    getKingSq:function(c){return kingSq[c]},
    getHalfmove:function(){return halfmove},
    inCheck:inCheck,
    legalMoves:generateLegalMoves,
    makeMove:makeMove,
    unmakeMove:unmakeMove,
    moveToSan:moveToSan,
    gameStatus:gameStatus,
    search:search,
    stopSearch:function(){stopped=true},
    pType:pType, pColor:pColor,
    mFrom:mFrom, mTo:mTo, mPromo:mPromo, mFlag:mFlag,
    idxToAlg:idxToAlg,
    START_FEN:'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
  };
})(self);
</script>

  function buildBoard(){

  function updateStatus(){

    if(thinking)stateTxt.textContent='المحرك يفكر…';
  }

  function updateEvalFromSearch(score, sideAtSearch){
    var whiteScore=(sideAtSearch===E.WHITE)?score:-score;
    if(Math.abs(whiteScore)>90000){
      evalTxt.textContent = whiteScore>0 ? 'مات للأبيض' : 'مات للأسود';
      return;
    }
    var v=whiteScore/100;
    evalTxt.textContent=(v>0?'+':'')+v.toFixed(2);
  }

  function applyMove(m, recordSan){
    var san=recordSan?E.moveToSan(m):null;
    E.makeMove(m);
    pliesPlayed++;
    var newLast={from:E.mFrom(m),to:E.mTo(m)};
    lastMoveHistory.push(newLast);
    lastMove=newLast;
    if(san)sanList.push(san);
    selected=-1;
    legalFromSelected=[];
    renderPieces();
    renderHighlights();
    renderMoves();
    updateStatus();
    var gs=E.gameStatus();
    if(gs.over){
      gameOver=true;
      stateTxt.textContent=gs.text;
      turnTxt.textContent='انتهت اللعبة';
    } else {
      stateTxt.textContent='جاهز';
    }
  }

  function engineTurn(){
    if(gameOver)return;
    if(E.getSide()===humanColor)return;
    thinking=true;
    updateStatus();
    depthTxt.textContent='...';
    var fen=E.getFen();
    var depth=parseInt(depthSel.value,10)||5;
    var tl=parseInt(timeSel.value,10)||0;
    var id=++searchId;
    var sideAtSearch=E.getSide();
    currentSearchSide=sideAtSearch;
    var prevHashes = E.getPositionHistory ? E.getPositionHistory() : [];
    if(worker){
      worker._sideAtSearch=sideAtSearch;
      worker.postMessage({cmd:'search',fen:fen,depth:depth,timeLimit:tl,id:id,prevHashes:prevHashes});
    } else {
      setTimeout(function(){
        var r=E.search(depth,tl);
        onEngineResult({id:id,move:r.move,score:r.score,depth:r.depth,nodes:r.nodes,side:sideAtSearch});
      },30);
    }
  }

  function onEngineResult(d){
    if(d.id!==searchId) return;
    thinking=false;
    depthTxt.textContent=d.depth+' / '+(d.nodes||0).toLocaleString('en-US');
    var sideAtSearch = (typeof d.side!=='undefined') ? d.side : (worker && worker._sideAtSearch);
    if(typeof d.score==='number' && sideAtSearch!==undefined){
      updateEvalFromSearch(d.score, sideAtSearch);
    }
    if(!d.move){updateStatus();return}
    applyMove(d.move,true);
    var gs=E.gameStatus();
    if(!gs.over){ stateTxt.textContent='دورك'; updateStatus(); }
  }

  function attachWorkerHandlers(w){
    w.onmessage=function(e){
      var d=e.data;
      if(d.type==='info'){
        if(d.id!==searchId)return;
        depthTxt.textContent=d.depth+' / '+(d.nodes||0).toLocaleString('en-US');
      } else if(d.type==='bestmove'){
        d.side=w._sideAtSearch;
        onEngineResult(d);
      }
    };
    w.onerror=function(ev){
      console.error('Worker error:', ev);
      searchId++;
      thinking=false;
      worker=null;
      stateTxt.textContent='خطأ في المحرك — جرّب "لعبة جديدة"';
      updateStatus();
    };
  }
  if(worker)attachWorkerHandlers(worker);

  function squareFromPoint(cx,cy){
    var rect=boardEl.getBoundingClientRect();
    var cw=rect.width/8,ch=rect.height/8;
    var col=Math.floor((cx-rect.left)/cw);
    var row=Math.floor((cy-rect.top)/ch);
    if(col<0||col>7||row<0||row>7)return -1;
    if(flipped){col=7-col;row=7-row}
    return row*8+col;
  }
  function isHumanTurn(){return !gameOver&&!thinking&&E.getSide()===humanColor}
  function selectSquare(sq){
    var b=E.getBoard(),p=b[sq];
    if(!p||E.pColor(p)!==humanColor){selected=-1;legalFromSelected=[];return false}
    var all=E.legalMoves();
    legalFromSelected=[];
    for(var i=0;i<all.length;i++)if(E.mFrom(all[i])===sq)legalFromSelected.push(all[i]);
    if(legalFromSelected.length===0){selected=-1;return false}
    selected=sq; return true;
  }
  function tryMoveTo(sq){
    if(selected<0)return false;
    var matches=[];
    for(var i=0;i<legalFromSelected.length;i++)
      if(E.mTo(legalFromSelected[i])===sq)matches.push(legalFromSelected[i]);
    if(matches.length===0)return false;
    if(matches.length>1){ pendingPromo=matches; showPromo(matches); return true; }
    applyMove(matches[0],true);
    afterHumanMove();
    return true;
  }
  function afterHumanMove(){
    var gs=E.gameStatus();
    if(gs.over){
      gameOver=true;
      stateTxt.textContent=gs.text;
      turnTxt.textContent='انتهت اللعبة';
      return;
    }
    if(E.getSide()!==humanColor){
      stateTxt.textContent='المحرك يفكر…';
      setTimeout(engineTurn,60);
    } else {
      stateTxt.textContent='دورك';
    }
  }
  function showPromo(moves){
    promoOpts.innerHTML='';
    var order=[E.QUEEN,E.ROOK,E.BISHOP,E.KNIGHT];
    order.forEach(function(t){
      var d=document.createElement('div');
      d.textContent=GLYPH[t];
      d.style.color=(humanColor===E.WHITE)?'#fff':'#1b1b1e';
      d.style.textShadow=(humanColor===E.WHITE)
        ?'1px 1px 0 #222,-1px 1px 0 #222,1px -1px 0 #222,-1px -1px 0 #222'
        :'1px 1px 0 #ddd,-1px 1px 0 #ddd,1px -1px 0 #ddd,-1px -1px 0 #ddd';
      d.addEventListener('click',function(){
        var found=null;
        for(var i=0;i<pendingPromo.length;i++)
          if(E.mPromo(pendingPromo[i])===t){found=pendingPromo[i];break}
        promoEl.classList.remove('on'); pendingPromo=null;
        if(found!==null){ applyMove(found,true); afterHumanMove(); }
      });
      promoOpts.appendChild(d);
    });
    promoEl.classList.add('on');
  }

  var dragEl=null,dragFrom=-1,dragStartX=0,dragStartY=0,dragging=false;
  boardEl.addEventListener('pointerdown',function(ev){
    if(promoEl.classList.contains('on'))return;
    if(!isHumanTurn())return;
    var sq=squareFromPoint(ev.clientX,ev.clientY);
    if(sq<0)return;
    if(selected>=0&&selected!==sq){
      if(tryMoveTo(sq)){ev.preventDefault();return}
    }
    var b=E.getBoard(),p=b[sq];
    if(p&&E.pColor(p)===humanColor){
      selectSquare(sq);
      renderHighlights();
      dragFrom=sq; dragStartX=ev.clientX; dragStartY=ev.clientY; dragging=false;
      boardEl.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    } else {
      selected=-1; legalFromSelected=[]; renderHighlights();
    }
  });
  boardEl.addEventListener('pointermove',function(ev){
    if(dragFrom<0)return;
    var dx=ev.clientX-dragStartX,dy=ev.clientY-dragStartY;
    if(!dragging&&(dx*dx+dy*dy)>30){
      dragging=true;
      var el=pieceEls[dragFrom];
      if(el){
        var rect=boardEl.getBoundingClientRect();
        var size=rect.width/8;
        dragEl=el.cloneNode(true);
        dragEl.classList.add('drag');
        dragEl.style.width=size+'px';
        dragEl.style.height=size+'px';
        dragEl.style.fontSize=window.getComputedStyle(el).fontSize;
        dragEl.style.transform='translate('+(ev.clientX-size/2)+'px,'+(ev.clientY-size/2)+'px)';
        document.body.appendChild(dragEl);
        el.style.opacity='0.25';
      }
    }
    if(dragging&&dragEl){
      var r2=boardEl.getBoundingClientRect();
      var sz=r2.width/8;
      dragEl.style.transform='translate('+(ev.clientX-sz/2)+'px,'+(ev.clientY-sz/2)+'px)';
    }
  });
  function endDrag(ev){
    if(dragFrom<0)return;
    var from=dragFrom, wasDragging=dragging;
    dragFrom=-1; dragging=false;
    if(dragEl){dragEl.remove();dragEl=null}
    if(pieceEls[from])pieceEls[from].style.opacity='';
    if(!wasDragging)return;
    var sq=squareFromPoint(ev.clientX,ev.clientY);
    if(sq<0||sq===from){renderHighlights();return}
    if(selected===from){ if(!tryMoveTo(sq))renderHighlights(); }
  }
  boardEl.addEventListener('pointerup',endDrag);
  boardEl.addEventListener('pointercancel',function(){
    if(dragEl){dragEl.remove();dragEl=null}
    if(dragFrom>=0&&pieceEls[dragFrom])pieceEls[dragFrom].style.opacity='';
    dragFrom=-1;dragging=false;
  });

  function newGame(){
    searchId++;
    if(worker){
      try{ worker.postMessage({cmd:'stop'}) }catch(e){}
      try{ worker.terminate() }catch(e){}
      worker=makeWorker();
      if(worker)attachWorkerHandlers(worker);
    }
    thinking=false; gameOver=false;
    selected=-1; legalFromSelected=[]; lastMove=null;
    pliesPlayed=0; sanList=[]; pendingPromo=null;
    lastMoveHistory=[];
    promoEl.classList.remove('on');
    humanColor=parseInt(sideSel.value,10);
    E.setFen(E.START_FEN);
    renderPieces(); renderHighlights(); renderMoves();
    updateStatus();
    evalTxt.textContent='0.00';
    depthTxt.textContent='-';
    stateTxt.textContent='جاهز';
    if(E.getSide()!==humanColor)setTimeout(engineTurn,250);
  }

  function undoMove(){
    if(thinking){
      searchId++;
      thinking=false;
      if(worker){ try{ worker.postMessage({cmd:'stop'}); }catch(e){} }
    }

    var steps=0;
    while(pliesPlayed>0 && steps<2){
      E.unmakeMove();
      pliesPlayed--;
      sanList.pop();
      lastMoveHistory.pop();
      steps++;
      if(E.getSide()===humanColor) break;
    }
    if(steps===0) return;

    gameOver=false;
    searchId++;
    selected=-1; legalFromSelected=[];
    lastMove = lastMoveHistory.length ? lastMoveHistory[lastMoveHistory.length-1] : null;
    renderPieces(); renderHighlights(); renderMoves(); updateStatus();

    if(E.getSide()!==humanColor){
      stateTxt.textContent='المحرك يفكر…';
      setTimeout(engineTurn, 60);
    } else {
      stateTxt.textContent='دورك';
    }
  }

  flipBtn.addEventListener('click',function(){
    flipped=!flipped;
    document.body.classList.toggle('flip',flipped);
    layoutSquares(); renderPieces(); renderHighlights();
  });
  newBtn.addEventListener('click',newGame);
  undoBtn.addEventListener('click',undoMove);
  sideSel.addEventListener('change',newGame);

  function pgnStrip(text){
    var s = text || '';
    s = s.replace(/\[[^\]]*\]/g, ' ');
    s = s.replace(/\{[^}]*\}/g, ' ');
    var prev;
    do { prev = s; s = s.replace(/\([^()]*\)/g, ' '); } while (s !== prev);
    s = s.replace(/\$\d+/g, ' ');
    s = s.replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g, ' ');
    s = s.replace(/[!?]+/g, '');
    s = s.replace(/\d+\.+/g, ' ');
    return s.split(/\s+/).filter(function(t){return t.length>0;});
  }

  function sanToMove(san){
    var legal = E.legalMoves();
    for (var i = 0; i < legal.length; i++){
      if (E.moveToSan(legal[i]) === san) return legal[i];
    }
    var bare = san.replace(/[+#]+$/, '');
    for (var j = 0; j < legal.length; j++){
      if (E.moveToSan(legal[j]).replace(/[+#]+$/, '') === bare) return legal[j];
    }
    if (san === '0-0' || san === 'O-O'){
      for (var k = 0; k < legal.length; k++)
        if (E.mFlag(legal[k]) === E.FLAG_CASTLE && (E.mTo(legal[k]) === 6 || E.mTo(legal[k]) === 62)) return legal[k];
    }
    if (san === '0-0-0' || san === 'O-O-O'){
      for (var k2 = 0; k2 < legal.length; k2++)
        if (E.mFlag(legal[k2]) === E.FLAG_CASTLE && (E.mTo(legal[k2]) === 2 || E.mTo(legal[k2]) === 58)) return legal[k2];
    }
    return null;
  }

  function loadPgn(){
    var txt = document.getElementById('pgnInput').value || '';
    var tokens = pgnStrip(txt);
    if (tokens.length === 0){ alert('لم أجد نقلات في النص'); return; }

    searchId++;
    if (worker){ try{ worker.postMessage({cmd:'stop'}); }catch(e){} }
    thinking = false; gameOver = false;
    selected = -1; legalFromSelected = []; lastMove = null;
    pliesPlayed = 0; sanList = []; pendingPromo = null; lastMoveHistory = [];
    promoEl.classList.remove('on');

    humanColor = parseInt(document.getElementById('pgnSideSel').value, 10) || 0;
    E.setFen(E.START_FEN);

    var played = 0;
    var stoppedAt = null;
    for (var i = 0; i < tokens.length; i++){
      var san = tokens[i];
      var m = sanToMove(san);
      if (m === null){ stoppedAt = san; break; }

      var sanNorm = E.moveToSan(m);
      E.makeMove(m);
      pliesPlayed++;
      sanList.push(sanNorm);
      var nl = {from: E.mFrom(m), to: E.mTo(m)};
      lastMoveHistory.push(nl);
      lastMove = nl;
      played++;

      var gs = E.gameStatus();
      if (gs.over){ gameOver = true; stateTxt.textContent = gs.text; break; }
    }

    renderPieces(); renderHighlights(); renderMoves(); updateStatus();

    if (stoppedAt){
      stateTxt.textContent = 'توقفت عند: ' + stoppedAt;
      return;
    }
    if (played === 0){
      stateTxt.textContent = 'فشل تحميل النقلات';
      return;
    }

    if (gameOver){
      turnTxt.textContent = 'انتهت اللعبة';
      return;
    }

    if (E.getSide() !== humanColor){
      stateTxt.textContent = 'المحرك يفكر…';
      setTimeout(engineTurn, 250);
    } else {
      stateTxt.textContent = 'دورك';
    }
  }

  document.getElementById('loadPgnBtn').addEventListener('click', loadPgn);

  buildBoard();
  E.setFen(E.START_FEN);
  renderPieces(); renderHighlights(); updateStatus();
  stateTxt.textContent='دورك';
})();
</script>
